<h4>What you own as a DE</h4>

<ul>
  <li>Pipelines that move data from source systems into storage</li>
  <li>The warehouse or lake where that data lives</li>
  <li>The transformations that shape raw data into clean, usable models</li>
  <li>The orchestration that schedules and monitors all of the above</li>
  <li>The quality checks that catch bad data before it reaches consumers</li>
  <li>The infrastructure: networking, permissions, compute, cost</li>
</ul>

<h4>What you do not own</h4>

<ul>
  <li>The business questions being asked of the data</li>
  <li>The dashboards built on top of it</li>
  <li>The statistical models trained on it</li>
  <li>Whether the insights are correct <em>for the business</em> (you ensure the data is correct; interpreting it is someone else's job)</li>
</ul>

<h4>The three levels of "responding to a failure"</h4>

<p>Industry uses a vocabulary I want you to know. When a pipeline breaks, the response involves three potential layers of human:</p>

<p><strong>L1 (Tier 1) support</strong> is whoever first notices something is wrong. Often this is not the DE: it's an analyst whose dashboard is broken, or an automated alert that fires. L1 reports the problem and confirms it exists.</p>

<p><strong>L2 (Tier 2) support</strong> investigates. This is usually the on-call DE. They look at logs, metrics, recent changes. They determine: is this a transient failure (rerun the job), a known issue (apply documented workaround), or something new (escalate)?</p>

<p><strong>L3 (Tier 3) support</strong> is whoever fixes the root cause. Often this is the original author of the code, or the team that owns the upstream system that's actually broken. L3 fixes are the slowest because they require deep investigation and proper engineering.</p>

<p>A healthy data team has clear L1/L2/L3 roles. A dysfunctional one has the DE doing all three at 11pm. If you interview at a company and ask "how does on-call work" and the answer is some version of "we wing it": that's not a job. That's a fire you'll be standing in.</p>

<h3>The Data Analyst</h3>

<p>The DA consumes clean, modeled data to <strong>answer business questions.</strong></p>

<p>Key word: <em>consumes.</em> The DA is a downstream dependent of the DE. They are not building pipelines. They are not managing infrastructure. They are querying what the DE has made available and translating it into decisions.</p>

<h4>Where DAs actually sit in an org</h4>

<p>There are two common patterns and the difference matters for how you interact with them:</p>

<p><strong>Centralized analytics team.</strong> One DA team serves the whole company. Marketing asks them for marketing analyses. Finance asks them for finance analyses. Product asks them for product analyses. The team has one manager. Requests come in via a queue (a Jira board, a Slack channel, a form). Advantages: consistent quality, shared tools, the team gets good at being analysts. Disadvantages: distance from business context, slow response time, the analysts never get deep enough into one domain to develop intuition.</p>

<p><strong>Embedded analysts.</strong> Each business team (marketing, finance, product) has its own dedicated analyst. The marketing analyst reports into marketing's leadership. They sit in marketing's standups. They use marketing's vocabulary. Advantages: deep domain knowledge, fast turnaround, the analyst becomes a real partner to their stakeholders. Disadvantages: inconsistent tooling across the company, isolation from other analysts, harder career path for the analyst.</p>

<p>Most companies you'll encounter use one of these two, or a hybrid (a small central team plus some embedded analysts in critical functions). When you read a job description, the answer to "which model is this?" tells you a lot about what your day will look like.</p>

<h4>What they own</h4>

<ul>
  <li>SQL queries against the warehouse</li>
  <li>Dashboards and reports in BI tools (Tableau, Looker, Metabase, Power BI)</li>
  <li>Ad-hoc analysis: "why did conversions drop 12% last Tuesday?"</li>
  <li>Communicating findings to non-technical stakeholders</li>
  <li><em>Increasingly:</em> writing transformation logic in dbt (we'll come back to this)</li>
</ul>

<h4>What they depend on the DE for</h4>

<ul>
  <li>Data being there</li>
  <li>Data being correct</li>
  <li>Data being modeled in a shape that makes their queries possible</li>
</ul>

<p>Here's what a DA <strong>cannot</strong> do if the DE hasn't done their job: anything. A DA with no clean data is a person with a very expensive SQL editor and nothing to query.</p>

<p>The relationship is a dependency chain. And dependency chains have a direction. Data flows one way (from DE to DA) and accountability flows the other. When the DA's dashboard shows wrong numbers, the first question is always: <em>is the underlying data correct?</em> That's a DE question before it's a DA question.</p>

<h3>The Data Scientist</h3>

<p>The DS builds <strong>statistical and machine learning models</strong> that generate predictions or insights beyond what descriptive analytics can show.</p>

<p>Where the DA asks <em>"what happened?"</em> (revenue by region last quarter) the DS asks <em>"what will happen?"</em> or <em>"why is this happening?"</em>, which customers are likely to churn, which products drive basket size, what's the causal effect of a UI change on conversion.</p>

<h4>The dirty secret of data science</h4>

<p>I want to tell you something the bootcamp marketing for data science roles doesn't tell you, because it'll change how you think about this whole field.</p>

<p><strong>A data scientist's day is not 80% modeling and 20% data work.</strong> It is closer to 60-80% data work and 20-40% modeling. Multiple industry surveys have asked this question over the last decade. The number is remarkably consistent. Most DSes spend most of their time doing exactly the things a DE should have already done: cleaning data, joining tables, hunting down the right column, debugging why two sources disagree.</p>

<p>This is true for two reasons:</p>

<p>One, in companies with weak data engineering, the DS has to do their own pipeline work just to have anything to model on. Their notebooks become brittle production systems by accident.</p>

<p>Two, even in companies with strong data engineering, the DS often needs data in a shape no existing pipeline produces. Building that shape (feature engineering) is itself a DE-shaped task.</p>

<p>Why does this matter for you as a future DE? Two reasons:</p>

<p><strong>One: when a DS complains that they spend all their time on data work, the implicit question is "where's our data engineer?"</strong> A senior DS will say this to leadership. The fix is hiring or developing DEs. If you do your job well, your DSes become more productive immediately.</p>

<p><strong>Two: a lot of the work you see labeled "data scientist" in job postings is actually DE work.</strong> Especially in India. Especially in service companies. A "Data Scientist" role asking for SQL, Python, and dashboarding skills is a DA. A role asking for Spark, Airflow, and cloud architecture is a DE. A role asking for statistics, ML algorithms, and experimental design is an actual DS. <em>Read the listed skills, not the title.</em></p>

<h4>What they own</h4>

<ul>
  <li>Feature engineering: transforming raw data into inputs for models</li>
  <li>Model training, validation, and evaluation</li>
  <li>Experimental design: A/B tests, causal inference</li>
  <li>Statistical analysis that requires more than GROUP BY</li>
</ul>

<h4>What they depend on the DE for</h4>

<ul>
  <li>Clean, reliable datasets to train on</li>
  <li>Feature pipelines: data transformed into the exact shape a model needs</li>
  <li>Historical data going back far enough to train on (you can't train a churn model on two weeks of data)</li>
</ul>

<h3>The ML Engineer</h3>

<p>The MLE takes a model the DS built and <strong>productionizes it</strong>: makes it run reliably, at scale, in a real system serving real users.</p>

<p>A DS might train a recommendation model in a Jupyter notebook. The MLE takes that and builds the serving infrastructure: an API endpoint that accepts a user ID and returns recommendations in under 100ms, handles 50,000 requests per second, retrains on fresh data every 24 hours, and sends an alert if model accuracy degrades.</p>

<h4>The MLE role is newer than you think</h4>

<p>"ML Engineer" as a distinct title is roughly eight years old. Before that, this work was done by some combination of: DSes who learned to deploy, software engineers who learned ML, and DEs who got pulled into model serving because nobody else knew the data infrastructure.</p>

<p>Some companies still don't have MLEs as a distinct role: the DS owns the whole lifecycle from training to serving. Other companies have whole MLE teams. The role is still differentiating itself, and you'll encounter all the variants in the market.</p>

<p>For you, the practical impact: when you join a team, ask explicitly "who owns model serving?" Sometimes it's an MLE team. Sometimes it's the DS team. Sometimes it's the DE team (which means you). Sometimes it's nobody, which means the models are running on the original author's laptop and you should run from the building.</p>

<h4>What they own</h4>

<ul>
  <li>Model serving infrastructure</li>
  <li>Retraining pipelines</li>
  <li>Model monitoring: drift detection, accuracy tracking</li>
  <li>Latency and throughput optimization</li>
</ul>

<h4>What they depend on the DE for</h4>

<ul>
  <li><strong>Feature pipelines</strong>: this is the tightest DE-MLE dependency in the entire org. The same features used to train the model must be available at inference time, in real time, with the same transformations applied identically. If your training pipeline computes "average order value in the last 30 days" one way and your serving pipeline computes it a different way, your model makes wrong predictions. This class of bug (training/serving skew) is one of the most expensive in ML systems. It is a data engineering problem, and we'll spend a full section on it later in this lecture.</li>
</ul>

<hr>

<h2><span class="num">Part Two</span>The roles people will confuse you about</h2>

<p>The four roles above are the canonical ones. The reality is messier. The job market has invented sub-roles, hybrid roles, and renamed-the-same-thing roles. You will encounter all of them. Knowing the actual taxonomy lets you decode any job posting.</p>

<h3>Analytics Engineer</h3>

<p>The newest role on this list. Roughly five years old as a named title.</p>

<p>The Analytics Engineer sits between the DE and the DA. They write transformation code (almost always in dbt) that takes raw data the DE has loaded and shapes it into the modeled, tested, documented tables that DAs query. They are <em>not</em> doing ad-hoc analysis (that's the DA). They are <em>not</em> building pipelines (that's the DE). They are doing the SQL modeling layer in between.</p>

<p>Why this role exists: in companies with strong data engineering, the DE team became a bottleneck on transformation work. Every analyst request to add a column, fix a metric, or build a new mart required DE time. The Analytics Engineer is the role that absorbs that transformation work, freeing the DE to focus on pipelines and infrastructure.</p>

<p>Tools: dbt almost universally. SQL deeply. Some Python. Git workflow strong. Less infrastructure work than a DE; less business analysis than a DA.</p>

<p>Indian market reality: still rare as a titled role. More common is to find DEs and DAs both doing this work, with the title following whoever happens to do more of it. As the dbt ecosystem grows here, expect this title to appear more in the next two years.</p>

<h3>Data Platform Engineer</h3>

<p>A DE specialization. The Data Platform Engineer focuses on the <em>infrastructure</em> that data engineers use, rather than the pipelines themselves. They run the Airflow cluster. They manage Snowflake at the account level. They set up the CI/CD systems for dbt. They handle cost management at the platform level.</p>

<p>Think of it as: regular DEs build pipelines on top of the platform; Platform Engineers build the platform that the regular DEs use.</p>

<p>Common in larger companies (200+ data engineers). Rare in startups, where one DE does everything.</p>

<h3>Analytics-focused DE vs Platform-focused DE</h3>

<p>Even in companies without a separate Platform Engineer title, DEs tend to specialize. Some lean analytics-side: they care about dimensional modeling, work closely with analysts, optimize for query performance. Others lean platform-side: they care about pipeline reliability, infrastructure cost, system resilience.</p>

<p>Neither is wrong. Both are needed. When you interview, you'll figure out which lean the team wants by listening to what they emphasize. A team that talks a lot about "dbt models" and "marts" wants analytics-side. A team that talks a lot about "Spark tuning" and "pipeline SLAs" wants platform-side.</p>

<h3>ML Platform Engineer / MLOps Engineer</h3>

<p>The MLE equivalent of a Data Platform Engineer. They build the systems that MLEs use: feature stores, model registries, experimentation platforms, model monitoring infrastructure.</p>

<p>Very new role. Mostly exists in companies that have at least 50+ ML models in production. Below that scale, the regular MLE handles their own infra.</p>

<h3>"Full-stack data": the startup pattern</h3>

<p>In a startup with under 50 people and one data person, that one person is doing everything. Pipelines, dashboards, the occasional model, the cloud setup, the dbt models, the on-call rotation (of one). Title is usually just "Data Engineer" or "Head of Data" but the work crosses every category above.</p>

<p>This is a great place to learn quickly, because you're forced to do everything. It's also a great place to burn out, because you're doing everything. If you join one, negotiate for clear scope: <em>"here are the three things I will own; here are the four things we'll hire to fill in 6 months."</em> Without that conversation, the role inflates infinitely.</p>

<h3>The Indian market specifically</h3>

<p>Two patterns to know:</p>

<p><strong>Service companies (TCS, Infosys, Wipro, Cognizant, LTIMindtree, etc.):</strong> Roles are usually titled "Data Engineer" or "Big Data Engineer" or "ETL Developer." Work is typically: implementing pipelines for an external client, using whatever stack the client mandates. Heavy on Hadoop/Spark/Hive in legacy projects, modern Snowflake/dbt/Airflow in newer ones. Hiring bar focused on specific tools listed in the job description. Pay scales known and stable: fresher to mid-senior often follows predictable bands.</p>

<p><strong>Product companies (Indian-origin products, GCCs of global product companies, well-funded startups):</strong> Roles more closely match what I've described above. More variety in titles. More expectation of system design thinking. Higher pay, especially at senior levels. Higher hiring bar: they're testing whether you can <em>own</em> systems, not just build features in them.</p>

<p>Neither is better in isolation. Service companies give you breadth of exposure to client stacks and stable career progression. Product companies give you depth in one stack and higher compensation ceiling. Many DEs move from service to product after 2-4 years. The reverse (product to service) is rare.</p>

<hr>

<h2><span class="num">Part Three</span>Ownership vs accountability: the mechanics</h2>

<p>Here is where I want you to pay extra attention. This section is what separates a DE who knows the vocabulary from a DE who actually functions in a real team.</p>

<p>The words "own" and "accountable" sound interchangeable. In practice they are not. Most data team dysfunction stems from people using these words loosely, which means failures fall into gaps where nobody knew it was their job to catch them.</p>

<h3>Definitions, sharp ones</h3>

<div class="board">────────────────────────────────────────────────
OWNERSHIP - operational meaning

"X owns Y" means three things must be true:

  1. When Y breaks, X is the person paged
  2. X has the authority to make changes to fix Y
     without asking permission
  3. X's performance is evaluated, in part, on
     whether Y works

If any of those three is missing, X does not actually
own Y. They may be "associated with" Y, "responsible
for" Y, or "involved in" Y - but they don't own it.

The most common dysfunction: someone is held
responsible for Y but doesn't have authority to fix
Y, or someone has authority but isn't paged when it
breaks. Both create silent failures.
────────────────────────────────────────────────</div>

<div class="board">────────────────────────────────────────────────
ACCOUNTABILITY - operational meaning

"X is accountable for Y" means:

  - When Y fails, X is the person who answers for it
    in the post-mortem
  - X explains what happened, why, and what changes
    to prevent recurrence
  - This is true EVEN IF X did not write the code
    that caused the failure

Accountability and ownership often map to the same
person, but not always. A team lead may be
accountable for a system that an individual engineer
owns operationally.
────────────────────────────────────────────────</div>

<div class="board">────────────────────────────────────────────────
POST-MORTEM - operational meaning

After any significant failure, the team produces a
written document that answers:

  - What happened (timeline of events)
  - Why it happened (root cause)
  - How it was detected (or why it wasn't detected fast)
  - How it was resolved
  - What we'll change to prevent recurrence

In healthy teams, post-mortems are blameless - they
focus on the system that allowed the failure, not the
individual who triggered it. The point is to learn,
not to punish.

In unhealthy teams, post-mortems become performance
reviews in disguise. Engineers stop reporting failures
honestly. Things get hidden. The system rots.

Whether a team does blameless post-mortems is one of
the single best signals of team health.
────────────────────────────────────────────────</div>

<h3>Four kinds of ownership, and why this matters</h3>

<p>For any data system, there are at least four distinct things that can be owned, and they may be owned by different people:</p>

<p><strong>Code ownership.</strong> Who wrote and maintains the code? Who reviews changes to it? Whose name is in the CODEOWNERS file?</p>

<p><strong>Data ownership.</strong> Who is the canonical authority on what the data <em>means</em>? If revenue is wrong, who decides what the right definition should be?</p>

<p><strong>System ownership.</strong> Who keeps the system running? Who is paged at 2am? Who provisions the resources, monitors the metrics, handles upgrades?</p>

<p><strong>Outcome ownership.</strong> Who is held accountable for whether the system <em>produces the business outcome it's supposed to</em>? Not just "does it run" but "is the dashboard accurate, is the model useful, is the report what the business needs?"</p>

<p>Here is the trap: in a poorly designed team, these four can be split across four different people who don't talk regularly, and a failure can fall into the gap between them.</p>

<p>Concrete example. The revenue dashboard breaks Monday morning.</p>

<ul>
  <li>Code owner: an analyst who wrote the dbt model six months ago, but left the company three months ago.</li>
  <li>Data owner: finance, who defined what "revenue" means but never wrote it down.</li>
  <li>System owner: the DE on-call, who manages the Airflow DAG but has no idea what the SQL inside the model actually does.</li>
  <li>Outcome owner: the head of analytics, whose name is on the email that summarizes revenue weekly, but who hasn't looked at the SQL in two years.</li>
</ul>

<p>The system owner gets paged at 8am. They restart the job. The job runs successfully but produces wrong numbers. The code owner is gone. The data owner is unreachable until 10am. The outcome owner is in a meeting. The CEO email goes out with wrong numbers. Nobody can fix it because nobody knows what right looks like.</p>

<p>That is not a hypothetical. That is roughly weekly somewhere in the world. The dysfunction is not that people are bad at their jobs. The dysfunction is that the four ownerships were never explicitly assigned to people who could collectively keep the system functioning.</p>

<h3>RACI: the framework you'll see in real companies</h3>

<p>RACI is a framework borrowed from project management that data teams use to make ownership explicit. For each task or system, four roles get assigned:</p>

<p><strong>R: Responsible.</strong> The person(s) who do the work. Can be multiple people.</p>

<p><strong>A: Accountable.</strong> The single person who answers for the outcome. Always exactly one.</p>

<p><strong>C: Consulted.</strong> The people whose input is required before decisions. Multiple people.</p>

<p><strong>I: Informed.</strong> The people who need to know after decisions. Multiple people.</p>

<p>For the revenue dashboard, a healthy RACI looks like:</p>

<ul>
  <li><strong>R:</strong> the DE who maintains the dbt model and the Airflow DAG.</li>
  <li><strong>A:</strong> the head of data engineering (one human, named in the document, the one who answers if it breaks).</li>
  <li><strong>C:</strong> finance (they define revenue), the analytics team (they consume it).</li>
  <li><strong>I:</strong> the CEO, the CFO, anyone else who reads the dashboard.</li>
</ul>

<p>You will not always see a literal RACI document. But the <em>idea</em> (that for each system, exactly one person is accountable and there are clear responsible/consulted/informed lists) should always be answerable. If you join a team and nobody can tell you who is accountable for a system, that's a sign of dysfunction. Healthy teams know this without being asked.</p>

<h3>The "everyone owns it" failure mode</h3>

<p>The single most common ownership dysfunction in data teams is the diffusion of responsibility across "the data team." Pipelines exist that nobody specifically owns. Tables exist that nobody updates. Dashboards exist that nobody fact-checks. When something breaks, the answer to "who fixes this?" is "well, we all do."</p>

<p>This sounds collaborative. It is actually how systems decay.</p>

<p>When everybody owns something, nobody owns it. Nobody loses sleep over it. Nobody is evaluated on whether it works. Nobody has the authority to make hard decisions about it. It silently drifts into disrepair.</p>

<p>The fix is mundane: every system, every pipeline, every dataset has exactly one named human as its accountable owner. That name is in a document, on a wiki, in the dbt metadata, somewhere durable. When the named person leaves or changes roles, the accountability transfers explicitly. <em>Accountability is never to a team. Accountability is to a person.</em></p>

<hr>

<h2><span class="num">Part Four</span>Handoffs and contracts</h2>

<p>Data crosses team boundaries constantly. The backend team writes to a database. The DE reads from that database. The DE produces a fact table. The analyst queries the fact table. The DS uses the fact table to train a model. The MLE serves the model. At every crossing, one team's output becomes another team's input.</p>

<p>When the upstream team changes their output without warning, the downstream team breaks. This is the most common cause of pipeline failure in real data systems. Not bugs in your code. <em>Upstream changes you didn't know were coming.</em></p>

<p>The mechanism that prevents this (when it works) is called a <strong>data contract</strong>. Let's go deep on what that actually is.</p>

<h3>What a data contract is</h3>

<div class="board">────────────────────────────────────────────────
DATA CONTRACT - definition

A written, version-controlled, machine-readable
agreement between a data producer and a data consumer
specifying:

  - The schema of the data (column names, types,
    nullability)
  - The semantics (what each column means, in plain
    English)
  - The SLA (when and how often the data is updated)
  - The change policy (how much notice the producer
    gives before breaking changes, who must approve)

The contract is the source of truth. If the data
deviates from the contract, the producer is in
violation. If the consumer needs something not in
the contract, they must negotiate an update before
depending on it.
────────────────────────────────────────────────</div>

<p>Here's roughly what a real contract looks like, in a YAML format you'll encounter in dbt projects and tools like Soda or Recce:</p>

<pre><code>contract:
  name: orders_published
  producer: backend-team
  consumers:
    - analytics-team
    - ml-team
    - finance-team

  schema:
    columns:
      - name: order_id
        type: string
        nullable: false
        description: "Unique identifier. Stable. Never reused."
      - name: user_id
        type: string
        nullable: false
        description: "FK to users table. Always valid."
      - name: placed_at
        type: timestamp
        nullable: false
        description: "When user tapped Place Order. UTC."
      - name: total_amount_inr
        type: decimal(10,2)
        nullable: false
        description: "Customer-facing total. Includes tax and
                      delivery fee. Excludes platform-side
                      promotional discount."
      - name: status
        type: string
        nullable: false
        enum:
          - placed
          - accepted
          - picked_up
          - delivered
          - cancelled_before_accept
          - cancelled_after_accept
        description: "Current order status."

  sla:
    freshness: "1 hour"        # data no older than 1 hour
    completeness: "99.5%"      # ≥99.5% of orders captured
    availability: "99.9%"      # uptime of the stream

  change_policy:
    breaking_changes_require:
      - "30 days written notice"
      - "approval by all listed consumers"
      - "migration plan"
    non_breaking_changes:
      - "may be added with 7 days notice"</code></pre>

<p>That's a contract. Notice what it does:</p>

<ol>
  <li>It removes ambiguity about what <code>total_amount_inr</code> means. No more "wait, does that include delivery?"</li>
  <li>It commits the producer to a freshness SLA. They can't silently start updating once a day instead of hourly.</li>
  <li>It defines what counts as a "breaking" change and forces a process for them.</li>
  <li>It names the producer and consumers explicitly, so when something goes wrong there's no question about who to call.</li>
</ol>

<h3>Three kinds of contracts</h3>

<p><strong>Schema contracts.</strong> What the data looks like structurally. Column names, types, nullability. The most common type. The easiest to enforce automatically (your pipeline can refuse data that violates the schema).</p>

<p><strong>SLA contracts.</strong> When the data arrives, how complete it is, how available the source is. Harder to enforce automatically: you need monitoring infrastructure. But just as important. A perfectly-shaped dataset that arrives 6 hours late is still a broken dependency.</p>

<p><strong>Semantic contracts.</strong> What the data <em>means</em>. The hardest kind. Two teams can agree that the column is named <code>revenue</code> and is a decimal, but disagree on whether refunds are subtracted, whether to count cancelled orders, whether to use customer-paid or platform-recognized revenue. Schema validation catches none of this. The contract has to spell out the business logic in prose, and it has to be maintained as the business changes.</p>

<h3>Who writes the contract and how it gets agreed</h3>

<p>In a healthy team, the workflow looks like this:</p>

<p>Step 1: a consumer team needs data from a producer team. They draft a contract proposal: here's what we need, here's the shape, here's how often.</p>

<p>Step 2: the producer team reviews. They negotiate: maybe they can't commit to hourly freshness but can do every 2 hours. Maybe they need a different column name for technical reasons. The contract gets revised.</p>

<p>Step 3: both teams sign off. The contract is checked into a shared repository (often in the same git repo as the data pipeline code itself). Tooling enforces it: schema tests run on every change to the producer's data; freshness monitors fire alerts when SLAs are violated.</p>

<p>Step 4: when either side wants to change the contract, they propose a change. The process repeats. Breaking changes require longer notice and more sign-off.</p>

<p>In an <em>unhealthy</em> team, none of this happens. The producer team changes things without warning. The consumer team builds defensive code to detect breaks after the fact. Everyone is reactive. Nothing improves.</p>

<h3>"Shift-left": pushing accountability upstream</h3>

<p>The phrase "shift-left" has become common in data team conversations. The metaphor: in a pipeline diagram, data flows left-to-right (source → destination). "Shift-left" means pushing accountability for data quality toward the source, instead of fixing problems downstream.</p>

<p>Traditional model: the source team produces whatever they produce. The data team catches errors at ingestion time, cleans them up, fixes them in transformation. The downstream consumer never sees the raw mess. <em>The data team absorbs all the pain.</em>

<p>Shift-left model: the source team is responsible for producing clean, contract-compliant data. The data team enforces the contract at the source's gate, if the source produces bad data, the source's pipeline fails, not the data team's. <em>The source feels their own pain.</em></p>

<p>Why shift-left matters: when the source team feels the consequences of bad data, they fix the root causes. When the data team absorbs it, the source team has no incentive to improve, and the data team spends forever firefighting.</p>

<p>This is hard to implement because it requires organizational alignment. The source team has to accept that "your data is wrong" is now their problem, not the data team's. Many organizations are still moving toward this model. You'll join teams at various points on this maturity curve.</p>

<h3>What a contract conversation actually looks like</h3>

<p>I want to give you the texture of how this conversation happens, because most DE courses leave you thinking contracts are mechanical. They're not. They're political.</p>

<p>Imagine you're a DE. The backend team is about to ship a new feature: support for split payments (one order, multiple payment methods). You hear about it in a hallway conversation, not from them.</p>

<p>Bad version of the conversation:</p>

<blockquote>You: "Hey, I heard you're shipping split payments. Will the schema change?"<br><br>Them: "Yeah, we're adding a payments table."<br><br>You: "Oh okay. Cool."<br><br>(Two weeks later, the pipeline breaks. The orders table no longer has total_amount as a single column; it's split across the new payments table. Nobody told the data team this would happen. The CEO email goes out wrong.)</blockquote>

<p>Good version of the conversation:</p>

<blockquote>You: "Hey, I heard you're shipping split payments. I want to make sure our data contract holds. Three questions: (1) is the orders.total_amount column changing? (2) if there's a new payments table, can we add it to our contract before launch? (3) what's your timeline (we need 30 days to update our consumers if there are breaking changes."<br><br>Them: "Oh) we hadn't thought about that. Yes, total_amount changes meaning; it now becomes total_due, not total_paid. And yes, there's a new payments table. We were going to ship next Friday."<br><br>You: "Okay, that's a breaking semantic change to total_amount. I need to update three downstream consumers. Can we delay the launch by two weeks, or can we phase it, keep total_amount stable for now and introduce total_due as a new column, then deprecate total_amount over a quarter?"<br><br>Them: "Phasing works. Let's do that."</blockquote>

<p>The skill there is not technical. It's recognizing the contract implications of an upstream change, raising them early, and negotiating outcomes that work for both teams. Senior DEs do this dozens of times a year. The conversations are the work.</p>

<hr>

<h2><span class="num">Part Five</span>The dbt misconception, properly addressed</h2>

<p><strong>"Doesn't dbt mean analysts do transformations now?"</strong></p>

<p>You will hear this constantly. The shallow answer in v1 of this lecture was "the tool moved closer to the analyst; the accountability didn't." That's still true. But it's worth unpacking why, because the misconception keeps coming back in new shapes.</p>

<h3>What dbt actually is, mechanically</h3>

<p>dbt is a tool that lets you write SQL SELECT statements and have them automatically materialized as tables or views in the warehouse. You write a file that says "SELECT this from these tables, joined this way, with these filters." dbt runs the SELECT, wraps it in a CREATE TABLE statement, runs that, and now the result is a table in the warehouse that downstream queries can read.</p>

<p>It also handles dependencies, if model B depends on model A, dbt runs A first. It runs tests: you can declare that a column should never be null, and dbt fails the run if that's violated. It tracks lineage: you can see which downstream models depend on a given upstream model.</p>

<p>In short: dbt brings software engineering practices (version control, testing, modular code, automated runs) to SQL transformation work. It's not a magic tool. It's a discipline transfer.</p>

<h3>Why analysts adopt it</h3>

<p>Most analysts already know SQL. dbt lets them write transformations in SQL without having to learn Python, Spark, or pipeline frameworks. Their existing skills carry over. The barrier to writing production transformations becomes much lower.</p>

<p>This is genuinely good. It means analysts can ship transformation code without DE bottleneck. It means the people who understand the business logic (analysts) are the ones writing the code that encodes it.</p>

<h3>Why this doesn't change DE accountability</h3>

<p>Here's the careful version of the argument.</p>

<p>When an analyst writes a dbt model, three things are true:</p>

<p><strong>One:</strong> the model runs inside infrastructure the DE owns. Airflow or dbt Cloud or whatever orchestrates it: that's DE-managed. When the run fails at 3am, the pager goes to the DE, not the analyst. The analyst probably went home at 6pm.</p>

<p><strong>Two:</strong> the model depends on upstream data the DE produced. If the analyst's model breaks because the source schema changed, the root cause is upstream. The fix may require DE work even if the symptom is in the analyst's code.</p>

<p><strong>Three:</strong> the model's output is consumed by downstream systems (dashboards, alerts, sometimes other models). The DE is responsible for the reliability of the platform as a whole, including the chain that depends on this model.</p>

<p>So when something goes wrong, the DE is the one who has to figure out where in the chain it broke and orchestrate the fix, even if the specific bug is in code an analyst wrote.</p>

<p>That doesn't mean the DE rewrites the analyst's code. It means the DE is responsible for catching the failure, routing it to the right person, ensuring it gets fixed, and updating processes so it doesn't happen again.</p>

<p class="pull">Tool ownership and outcome ownership are different things. The tool can move to the analyst. The outcome stays with the DE.</p>

<h3>How healthy teams structure this</h3>

<p>In teams that have figured this out, the structure looks like:</p>

<ul>
  <li>Analysts write dbt models for the transformation logic (because they know the business)</li>
  <li>The DE team owns the dbt project structure, the conventions, the CI/CD pipeline, the orchestration</li>
  <li>Code review on dbt models is shared: analysts review for business correctness, DEs review for performance and operational reliability</li>
  <li>Tests are required: every model must declare what "correct" means via tests, and the tests must pass before merge</li>
  <li>When a model fails in production, on-call rotation handles immediate restoration; root cause is assigned to whoever owns that part of the pipeline (analyst for logic, DE for infrastructure)</li>
</ul>

<p>This works because the responsibility is clear at every step. The dysfunction happens when "analysts can write dbt" gets interpreted as "DEs don't need to worry about this anymore." That's never true.</p>

<hr>

<h2><span class="num">Part Six</span>Real failures: what they look like, what they teach</h2>

<p>I want to walk you through five failure shapes I've seen, repeatedly, at companies in the Indian market. I'm not naming the companies. I'm using shapes: recognizable patterns at recognizable kinds of companies. If you recognize the shape and not the specific company, that's the point. These patterns repeat.</p>

<h3>Failure 1: The orphaned dbt model</h3>

<p><strong>Shape:</strong> a 4-year-old fintech, ~150 employees, ~6 person data team. An analyst built a critical revenue dbt model 18 months ago. The model has 47 lines of SQL with several edge case handlers. The analyst left the company 8 months ago. The model has been running successfully ever since.</p>

<p>On a Monday morning, the model produces wrong revenue. Off by 12%. The CFO notices in his Slack feed before the data team does.</p>

<p>Investigation:</p>

<ul>
  <li>The DE on-call restarts the job. Same wrong number.</li>
  <li>Three people read the SQL. None of them fully understand why one of the edge cases is the way it is. There's a comment that says "// fix for special case in March 2023" with no further context.</li>
  <li>It turns out the source backend team added a new payment method last week that interacts badly with one of the edge case filters. The model is silently excluding those orders.</li>
  <li>Nobody on the current team has the business context to know whether the original edge case is still needed, or whether it should be removed, or modified.</li>
</ul>

<p><strong>Time to resolution:</strong> 14 hours. Plus three days of follow-up to figure out the right fix.</p>

<p><strong>Lesson:</strong> code ownership without documentation is technical debt that compounds when the author leaves. Every nontrivial transformation should have inline comments explaining the <em>why</em>, not just the what. The data team should periodically audit transformations whose original author has left, and either re-document them or rewrite them.</p>

<p><strong>What healthy teams do:</strong> a "knowledge handoff" process when anyone leaves. The departing person spends their last two weeks walking remaining team members through every nontrivial model they own. Decisions and edge cases get documented. After two weeks, the team is supposed to be able to maintain the model without the departing person.</p>

<h3>Failure 2: The undeclared schema change</h3>

<p><strong>Shape:</strong> a tier-1 video streaming company, ~1500 engineers, mature data team of ~40. Backend team ships a new feature that adds a column to the <code>plays</code> table. It's a non-breaking change in a strict sense: the existing columns are unchanged. They don't notify the data team because "we didn't break anything."</p>

<p>What goes wrong:</p>

<ul>
  <li>The data team's ingestion job uses <code>SELECT *</code>. The new column comes in. The schema of the destination table doesn't match the new source. The job fails.</li>
  <li>The on-call DE diagnoses in 20 minutes: easy fix, add the new column to the destination schema.</li>
  <li>But during the 20 minutes the pipeline was failing, the morning content recommendation refresh missed its window. The recommendations served between 8am and 10am are stale. Engagement metrics dip for those two hours.</li>
</ul>

<p><strong>Time to resolution:</strong> 20 minutes for the fix; 2 hours of bad recommendations served; 1 week of incident review.</p>

<p><strong>Lesson:</strong> "non-breaking" is in the eye of the consumer. The producer team's idea of what's safe to ship was based on their understanding, not the consumer's. A formal schema contract would have caught this: the contract would specify that any schema change, even adding columns, requires notice.</p>

<p><strong>What changed:</strong> the company implemented a schema-contract system where the backend team's CI runs schema diff checks before deployment. Any change to a contracted table requires explicit sign-off from the consumer teams in the form of a merge approval on a contract file. This added friction to backend deploys but eliminated the failure mode.</p>

<h3>Failure 3: The training-serving skew</h3>

<p><strong>Shape:</strong> a fast-growing e-commerce platform, ~80 engineers. Data science team builds a fraud detection model. The model uses 23 features. One of the features is "average transaction amount in the last 30 days."</p>

<p>Training pipeline (built by the DS):</p>
<ul>
  <li>Pulls 30 days of history from the warehouse</li>
  <li>Groups by user, averages transaction amount</li>
  <li>Joins back to the training set</li>
</ul>

<p>Serving pipeline (built by an MLE three months later):</p>
<ul>
  <li>For each incoming transaction, fetches the user's last 30 days of transactions from a real-time store</li>
  <li>Computes the average on the fly</li>
  <li>Sends the feature into the model</li>
</ul>

<p>The model is deployed. Initial monitoring shows it performing fine. Three weeks later, a fraud analyst notices that the model is missing obvious fraud patterns. Investigation begins.</p>

<p>After two months of analysis, the team finds it:</p>
<ul>
  <li>The training pipeline used <em>calendar days</em> (30 calendar days back from the prediction date)</li>
  <li>The serving pipeline used <em>30 × 24 hours</em> (a rolling 720-hour window)</li>
  <li>The training pipeline excluded cancelled transactions</li>
  <li>The serving pipeline included them</li>
</ul>

<p>The two ways of computing "average transaction amount in the last 30 days" produced systematically different numbers for the same user. The model saw one distribution in training and a different distribution in production. Performance degraded silently.</p>

<p><strong>Time to resolution:</strong> 2 months of analyst confusion; 6 weeks of engineering work to build a feature pipeline that both training and serving use; ongoing monitoring to ensure they stay in sync.</p>

<p><strong>Lesson:</strong> this is the textbook training-serving skew failure, and it cost the company seven figures in undetected fraud. The fix is a feature store: a single canonical pipeline that produces features used by both training and serving paths. Without that, every feature is a future skew waiting to happen.</p>

<p><strong>What changed:</strong> the company hired their first ML platform engineer, whose entire remit was building feature infrastructure. New ML models could only ship if their features came from the feature store. This eliminated the skew failure mode permanently: at the cost of slower feature development.</p>

<h3>Failure 4: The "everyone has admin" disaster</h3>

<p><strong>Shape:</strong> early-stage startup, ~25 employees, 1 person data team (the founder's friend). Snowflake permissions never got configured properly. Every employee has admin access to the warehouse, because "we trust everyone."</p>

<p>An analyst, trying to clean up old tables, runs <code>DROP TABLE customer_transactions</code> in production. They thought it was the dev environment. The table is gone. Time travel can recover the last 24 hours, but the table had 18 months of history.</p>

<p>Recovery:</p>
<ul>
  <li>Last 24 hours restored from Snowflake time travel</li>
  <li>Earlier data restored from S3 raw layer (which the data person had set up, fortunately): takes 3 days of pipeline re-runs</li>
  <li>The historical analyses that depended on derived state (cumulative customer lifetime value, etc.) take another week to reconcile</li>
</ul>

<p><strong>Time to resolution:</strong> 10 days of degraded analytics.</p>

<p><strong>Lesson:</strong> access control is not paranoia, it's operational hygiene. Even in small teams, people should have the minimum permissions they need. Production write access should be highly restricted. The analyst in this story is not a bad person: they made a small mistake that the system allowed to become a large failure.</p>

<p><strong>What changed:</strong> the company implemented role-based access control (RBAC). Analysts got read-only access to production. Write access was reserved for a small group with mandatory two-person approval for destructive operations.</p>

<h3>Failure 5: The departing knowledge loss</h3>

<p><strong>Shape:</strong> mid-size B2B SaaS, ~400 employees, data team of 8. A senior DE who built most of the foundational pipelines four years ago decides to leave. He gives 30 days notice.</p>

<p>The team plans a knowledge transfer. He documents the major systems. He walks through three of them with the team.</p>

<p>Three months after he leaves, an obscure data quality issue surfaces. The root cause is in a pipeline he built that he didn't think was important enough to document deeply. The current team doesn't have the context to debug it efficiently. It takes a week.</p>

<p>Six months after he leaves, another issue. Then another. Then the regulatory team asks a question about historical data lineage that requires understanding of decisions made three years ago: decisions he made, alone, and didn't document.</p>

<p><strong>The lesson is uncomfortable:</strong> 30 days of knowledge transfer is not enough for someone who built systems alone for four years. Knowledge that's only in one person's head is a fragility, not an asset. The company should have insisted on shared ownership of every system from year one, even if it slowed velocity. They didn't, and they're paying for it now.</p>

<p><strong>What changed:</strong> the team adopted a rule that no person could be the sole code owner on any pipeline. Every system requires at least two named owners, with periodic rotation. This costs throughput but eliminates the single-point-of-failure pattern.</p>

<hr>

<h2><span class="num">Part Seven</span>How data teams are organized</h2>

<p>I want to give you a map of the common ways data teams sit inside companies. When you read a job posting, listen to a recruiter, or interview at a company, you'll be able to identify which pattern they use, and that tells you a lot about what your day will look like.</p>

<h3>Pattern 1: Centralized data team</h3>

<p>One data team. All DEs, DAs, DSes, MLEs report into a single org under a Head of Data (or VP of Data, or Chief Data Officer). The team serves all other functions in the company: they support marketing, finance, product, ops, everyone.</p>

<p><strong>Advantages:</strong> consistent tooling, shared standards, unified data model, easier governance, clear career paths within the team.</p>

<p><strong>Disadvantages:</strong> distance from business context, request queue dynamics (every function competes for the team's time), slow to respond to fast-moving business teams.</p>

<p><strong>You'll find this in:</strong> early-stage companies (because there's only one team to have), some mature companies that explicitly value central governance.</p>

<h3>Pattern 2: Embedded data team</h3>

<p>Data engineers, analysts, and scientists are embedded directly into business teams. The marketing team has its own analyst. The product team has its own DE. They report into the business team, not into a data org.</p>

<p><strong>Advantages:</strong> deep domain knowledge, fast response time to business needs, tight alignment with stakeholders.</p>

<p><strong>Disadvantages:</strong> inconsistent tooling across the company, duplicated effort, isolated career paths for data professionals, no shared data infrastructure standards.</p>

<p><strong>You'll find this in:</strong> companies that prioritize speed over consistency. Often companies that grew very fast and never centralized.</p>

<h3>Pattern 3: Hub and spoke</h3>

<p>A central platform team (the "hub") provides shared infrastructure: the warehouse, ingestion pipelines, common transformations, dbt project structure, orchestration platform. Embedded analysts and scientists (the "spokes") sit in business teams and use the central infrastructure.</p>

<p>This is the most common pattern in mature companies. It balances the consistency of centralized with the responsiveness of embedded. The hub maintains standards; the spokes maintain context.</p>

<p><strong>You'll find this in:</strong> most mid-to-large companies with mature data practices. Probably 60-70% of the data jobs you'll encounter in product companies follow this pattern.</p>

<h3>Pattern 4: Data mesh</h3>

<p>The newest pattern, still maturing. The idea: data is owned by the business domain that produces it, not by a central data team. Each domain (orders, marketing, supply chain, etc.) produces and maintains its own "data products" with declared contracts. A central platform team provides the tools and standards that make this possible.</p>

<p>Data mesh is conceptually elegant but operationally hard. It requires every business domain to have its own data engineering capability, which most don't. Implementations in the wild are usually partial: domains own their data with central support.</p>

<p><strong>You'll find this in:</strong> large enterprises trying to escape the bottlenecks of centralized data teams. Often companies with thousands of engineers and complex domain structure.</p>

<h3>How to read between the lines of a job posting</h3>

<p>The job description will tell you which pattern the company uses if you read carefully:</p>

<p><strong>"Join our central data team..."</strong>: centralized pattern.</p>

<p><strong>"You'll be embedded with the marketing team..."</strong>: embedded pattern.</p>

<p><strong>"You'll work on our data platform that supports analysts across the company..."</strong>: hub-and-spoke, you're on the hub side.</p>

<p><strong>"You'll build pipelines for your domain (logistics) in collaboration with our platform team..."</strong>: hub-and-spoke, you're on the spoke side.</p>

<p><strong>"You'll own data products for the supply chain domain..."</strong>: data mesh.</p>

<p>The pattern dictates whether your work is shaped by standards (hub-and-spoke, centralized) or by your specific business context (embedded, mesh). Both have value. Pick based on what kind of work you want to do.</p>

<hr>

<h2><span class="num">Part Eight</span>What to ask in interviews</h2>

<p>You will interview for these roles. The interviewer will ask you questions. Most courses focus on what you should answer. I want to talk about what you should <em>ask</em>, because the questions you ask reveal whether you understand the role and they tell you whether the team is healthy.</p>

<p>I am putting this in Day 2, not Phase 12, on purpose. You won't interview for months. But knowing what a healthy team looks like changes how you read every other lecture in this curriculum: you'll notice when something we cover is the kind of thing only healthy teams do, and you'll start building the vocabulary to evaluate teams when the time comes.</p>

<h3>Questions about ownership</h3>

<p><strong>"Who's on call for the data pipelines, and how does the rotation work?"</strong></p>

<p>Good answer: "We have a weekly rotation across the DE team. PagerDuty routes alerts. We have a runbook for each pipeline. After-hours pages are rare, maybe one per month."</p>

<p>Bad answer: silence. Or "we don't really have one." Or "the senior person handles it." Translation: things break, nobody catches them quickly, and when you join you'll be the person who makes it everyone else's problem to fix.</p>

<p><strong>"How do you decide who owns a new pipeline?"</strong></p>

<p>Good answer: an actual process, "the person who builds it owns it operationally, and we assign a named accountable owner at the manager level. We have an ownership wiki."</p>

<p>Bad answer: "we figure it out as we go." Translation: there are pipelines nobody owns. They will break eventually and you will be drafted into fixing them.</p>

<h3>Questions about failure</h3>

<p><strong>"Walk me through the last time a dashboard had wrong numbers. How did you find out and how did you fix it?"</strong></p>

<p>Good answer: a real story with specifics. Detection, investigation, fix, learnings, what changed afterward.</p>

<p>Bad answer: "we don't really have that problem." Translation: either they have it and aren't aware, which is worse, or they have it and aren't honest about it, which is also worse.</p>

<p><strong>"What's your post-mortem process?"</strong></p>

<p>Good answer: blameless, written, shared, tracked. Action items get assigned and followed up on.</p>

<p>Bad answer: "we usually just chat about it in retro." Translation: lessons aren't being captured. The same failures will recur.</p>

<h3>Questions about contracts and handoffs</h3>

<p><strong>"How do schema changes from upstream teams get communicated to your team?"</strong></p>

<p>Good answer: explicit contracts, formal change-management process, automated schema diff checks in CI.</p>

<p>Bad answer: "Slack, mostly." Translation: things will break for you regularly and you'll be reactive.</p>

<p><strong>"What's the relationship between your team and the platform/infrastructure team?"</strong></p>

<p>Good answer: clear division of responsibility, regular collaboration, shared escalation paths.</p>

<p>Bad answer: vague description, tension when you push. Translation: you'll be caught between teams that don't communicate.</p>

<h3>Questions about your career</h3>

<p><strong>"What's the career progression for a DE on your team?"</strong></p>

<p>Good answer: they can name specific people who progressed, what the levels look like, what determines promotion. They can describe the difference between junior, mid, and senior expectations.</p>

<p>Bad answer: "we don't really have formal levels." Translation: promotions are political. Your trajectory will depend on your manager's mood.</p>

<p>You will not always have time to ask all of these. Pick three based on what matters most to you. The signal you get from how they answer (directness, specificity, comfort with discussing failure) tells you more than the answers themselves.</p>

<hr>

<h2><span class="num">Closing</span>The 2am question</h2>

<p><em>If a pipeline breaks at 2am and nobody is on call: whose problem is it?</em></p>

<p>The answer I want you to arrive at is: <strong>the DE owns the pipeline, so it's a DE problem the moment it fails (regardless of whether anyone is awake).</strong></p>

<p>But more importantly: a properly engineered pipeline doesn't wait for someone to notice it failed at 2am. It sends an alert. It pages the on-call. It has a dead man's switch, if the job didn't complete by 3am, something fires. <strong>Observability is not an add-on. It is part of the engineering.</strong></p>

<p>We will build this instinct into every pipeline you write in this program. Not in Week 10. Starting in Week 4 when you write your first Python pipeline. The first time you write a script without logging, I will send it back. No exceptions.</p>

<p>And now you understand <em>why</em>. Not just "logging is good practice." But: logging is how on-call works. On-call is how ownership works. Ownership is how systems stay reliable. Reliability is what makes the data team a trustworthy partner to the rest of the business. <em>Trust is the entire product of a data team.</em> When trust breaks, no amount of clever architecture restores it.</p>

<h2><span class="num">Opening</span>The story I'm starting with</h2>

<p>There's a fintech company I worked with: a 4-year-old digital payments startup, around 150 people, processing about 4 million transactions a day. Standard shape for the Indian fintech market: backend in Java, data team of seven, fraud detection model built by a DS who left the company three months earlier.</p>

<p>One Tuesday morning, the head of risk pulled up the daily fraud report. The number of flagged transactions for Monday was 312. A normal day is around 2,800. He assumed the model was broken. He paged the ML team. The ML team checked: the model was running, producing predictions, the inference latency was normal. They paged the data team.</p>

<p>It took the data team <strong>six hours</strong> to figure out what happened.</p>

<p>A field in the upstream transaction stream had been renamed three days earlier. The mobile team had pushed a release that changed <code>merchant_category_code</code> to <code>mcc_v2</code> in the event payload. They had communicated it: in a single line in the engineering changelog email that nobody on the data team reads, because there are forty engineering changelogs a week. The data ingestion pipeline didn't error on the rename. It just started writing NULL into that column for every transaction.</p>

<p>The fraud model used merchant category as one of its top three features. With NULLs flowing in, every transaction looked like a low-risk default category. The model, doing exactly what it was trained to do, flagged almost nothing.</p>

<p>Three days. <strong>Three days of unflagged fraud.</strong> The company had to manually review 12 million transactions retrospectively. The direct fraud loss was in the high seven figures of rupees. The trust loss with the risk team: harder to quantify, longer to recover.</p>

<p>Here's the question I want you sitting with for the next 90 minutes.</p>

<p class="pull">Where in the pipeline did that failure actually happen?</p>

<p>Most people answer "ingestion: that's where the field rename hit." That's where the <em>symptom</em> appeared. It is not where the failure happened. The failure happened in the <em>design</em> of the pipeline (across every stage) because nobody had built it to know what it didn't know. The raw data was technically fine. The ingestion was technically running. The transformation was technically running. The dashboard was technically showing numbers. The whole system was technically working. And it was completely wrong.</p>

<p>You cannot debug a system you do not understand. You cannot design observability for stages you cannot name. Today I'm going to give you the stages, the transitions, the failure modes, and the mechanics of how each stage works at ground level, not at the altitude where most courses leave you. By the end of this lecture you should be able to look at that fintech story and tell me, with precision, <strong>at least four places the pipeline should have caught it and didn't, and how each catch would have worked mechanically.</strong></p>
