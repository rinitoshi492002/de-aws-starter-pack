<h2><span class="num">Part One</span>The four stages: the skeleton</h2>

<p class="stage">*draws on the board*</p>

<div class="board">[ INGEST ]  →  [ STORE ]  →  [ PROCESS ]  →  [ SERVE ]</div>

<p>Four stages. Memorize them. Every tool you'll touch in this program lives in one or more of these. Every bug you'll debug in your career originated in one. Every architecture decision you'll make is a negotiation between their constraints.</p>

<p>One-line job description for each:</p>

<ul>
  <li><strong>Ingestion</strong>: move data from where it was created to where you control it.</li>
  <li><strong>Storage</strong>: hold data durably in a form the next stage can use.</li>
  <li><strong>Processing</strong>: change the shape, structure, or business meaning of data to make it useful.</li>
  <li><strong>Serving</strong>: deliver that processed data to the humans and systems that depend on it.</li>
</ul>

<p>Sounds simple. It is not simple. The <em>transitions</em> between these stages are where most pipelines die, and we'll spend most of today on the mechanics of each stage and the transitions between them.</p>

<p>To make all of this concrete, we're tracing one event through the entire lifecycle.</p>

<p>It's 8:47pm. You open Zomato. You order biryani. You tap <strong>Place Order.</strong></p>

<p>That tap kicks off two completely separate chains. One in the operational world: restaurant gets notified, rider gets assigned, payment is captured. We covered that world on Day 1. <strong>We don't own it. The backend team owns it.</strong></p>

<p>Simultaneously, that tap kicks off a second chain in the <em>data</em> world. That chain ends the next morning with a number on a dashboard that a VP looks at over chai. That chain is ours. Let's trace it, stage by stage, mechanic by mechanic.</p>

<hr>

<h2><span class="num">Part Two</span>Stage 1: Ingestion</h2>

<p class="stage">*draws first box on the left: "Source System"*</p>

<p>The Zomato backend just did its job: wrote rows to operational MySQL, triggered the payment service, told the restaurant. Done. From the backend's perspective, the order is complete.</p>

<p>From our perspective, <strong>nothing has happened yet.</strong> Data was created but it lives inside the source system. It is not in our world.</p>

<p>Ingestion is the act of moving that data (that order record, that event) from the system that created it into infrastructure we control. That sentence sounds boring. It is not. Ingestion is the single most dangerous stage in the entire lifecycle. Here's why.</p>

<h3>The fundamental problem of ingestion</h3>

<p>Source systems were not built for you.</p>

<p>The Zomato orders database exists to make the Zomato app work. It was built by backend engineers, optimized for backend workloads, owned by a team whose performance review depends on uptime and latency, not on your data pipeline. They will change schemas without telling you. They will add load that makes your extraction slow. They will rename <code>merchant_category_code</code> to <code>mcc_v2</code> and email it in a changelog you don't read.</p>

<p>You do not have a service contract with the source system unless you negotiate one (we covered contracts in Day 2). You have a relationship. And relationships break.</p>

<p class="pull">Ingestion is the discipline of moving data from systems that don't exist to serve you, without breaking them, without losing records, and without silently going out of sync with their changes.</p>

<p>If you internalize one sentence from today, internalize that one.</p>

<h3>The two axes of ingestion</h3>

<p>There are <strong>two independent axes</strong> to ingestion. Most courses collapse them into one. Don't.</p>

<p><strong>Axis 1: Initiation, who triggers the data transfer?</strong></p>

<ul>
  <li><strong>Pull:</strong> <em>you</em> initiate. Your pipeline reaches into the source and extracts. <em>"Give me everything created since the last time I asked."</em></li>
  <li><strong>Push:</strong> <em>the source</em> initiates. They send to a destination you've set up to receive. You don't ask: you receive.</li>
</ul>

<p><strong>Axis 2: Granularity (how does the data move)?</strong></p>

<ul>
  <li><strong>Batch:</strong> chunks at a time. A file. A result set. A window of records.</li>
  <li><strong>Streaming:</strong> event by event, continuously. Each record processed individually as it arrives.</li>
</ul>

<p>These axes are independent. You pick a position on each. That gives you four real, common combinations:</p>

<div class="board">                         INITIATION
                  Pull ←──────────────→ Push
                   │                     │
       Batch  ─────┼──── (1) ────── (2) ─┼──── Batch
   GRANULARITY     │                     │
   Streaming ─────┼──── (3) ────── (4) ─┼──── Streaming
                   │                     │

(1) Pull + Batch       - you ask, in chunks
(2) Push + Batch       - they send, in chunks
(3) Pull + Streaming   - you poll, continuously
(4) Push + Streaming   - they send, event-by-event</div>

<p><strong>(1) Pull + Batch</strong> (your pipeline queries the production MySQL replica at 2am): <code>SELECT * FROM orders WHERE created_at &gt; yesterday</code>. You initiated. You got a chunk. This is the classic nightly ETL.</p>

<p><strong>(2) Push + Batch</strong>: an ad-sales vendor generates a daily report and drops a file in your S3 bucket at 7am. They initiated the transfer. You got a chunk. This is the classic vendor-delivery pattern. Stripe daily settlement files, Google Ads daily reports, bank reconciliation drops: all push+batch.</p>

<p><strong>(3) Pull + Streaming</strong>: your consumer polls an API every few seconds asking "any new events?" Less common, often replaced by webhooks when the source supports them.</p>

<p><strong>(4) Push + Streaming</strong>: the source emits each event to a streaming platform (Kafka, Kinesis) as it happens. You're subscribed. Events arrive within milliseconds.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: Kafka (and what "subscribed" means)

Kafka is a piece of software that runs on servers
(originally built at LinkedIn, now open-source). It is
NOT something you write - it is something you install
and run, then send events to and read events from.

Think of it as a pipe with memory.

Key terms you'll hear:

  - TOPIC - a named channel inside Kafka.
    "order_placed_events" is a topic. "user_signups"
    is another topic. Different teams use different
    topics for different kinds of events.

  - PRODUCER - any system that sends events INTO a
    topic. The Tahini backend, when a user places an
    order, is the producer. It calls Kafka and says
    "here's an order_placed event for the
    order_placed_events topic."

  - CONSUMER - any system that reads events OUT of a
    topic. YOU write the consumer. It's a small Python
    program (or Java, or whatever) that connects to
    Kafka and says "give me events from the
    order_placed_events topic." Kafka sends them, one
    by one, in order.

  - SUBSCRIPTION - your consumer staying connected to
    Kafka and continuously receiving events as they
    arrive. Not a magical thing. Just your program
    sitting in a loop: receive event → do something
    with it → ask for the next one.

  - OFFSET - Kafka remembers where each consumer is in
    the stream. If your consumer reads event #1000 and
    crashes, when it restarts Kafka knows to send it
    event #1001 next. (This is also how the consumer
    lag concept we'll define later works.)

So when this lecture says "the Kafka consumer receives
the event" - that means: a Python program WE WROTE,
that we keep running 24/7, is connected to Kafka, and
Kafka just sent it the event over the network.

Kafka itself doesn't write to S3. Kafka doesn't write
to anything. Kafka just holds events and hands them to
consumers. Whatever happens next is the consumer's job
- which means it's YOUR job, because YOU wrote the
consumer.
────────────────────────────────────────────────</div>

<p><strong>All four are real. All four exist in production systems you will work on. Each has different failure modes, different monitoring requirements, different code paths.</strong> A pipeline architecture that handles only one of the four is a pipeline architecture that will be incomplete.</p>

<h3>The watermark problem: let's actually go deep</h3>

<p>Every quadrant of ingestion has the same fundamental question to answer: <strong>what did I already pull, and what's new?</strong></p>

<p>The mechanism that answers this is called a <strong>watermark</strong>. This is the single most important concept in batch ingestion, and most courses gesture at it for one paragraph and move on. We're going to spend time here.</p>

<div class="board">────────────────────────────────────────────────
WATERMARK - definition

A watermark is a value that represents "everything up
to this point has already been processed."

For batch ingestion, the watermark is typically:
  - The maximum timestamp of records pulled so far, OR
  - The maximum auto-incrementing ID pulled so far

It is stored somewhere durable BETWEEN runs of the
pipeline, so the next run knows where to start.

The next run's query looks like:
    SELECT * FROM orders
    WHERE updated_at > :last_watermark

After the run completes successfully, the watermark
gets advanced to the max(updated_at) seen in that batch.
────────────────────────────────────────────────</div>

<h4>Choosing your watermark column: the decisions matter</h4>

<p>You'd think "just use the timestamp." It's not that simple.</p>

<p><strong>Option A: created_at</strong>. The timestamp when the record was first inserted. Stable, never changes. <em>Problem:</em> if the source updates an existing record (e.g., an order's status changes from <code>placed</code> to <code>delivered</code>), your pipeline won't pick up the update. The record's <code>created_at</code> hasn't changed; it's already below your watermark. You'll have stale data downstream.</p>

<p><strong>Option B: updated_at</strong>. The timestamp of the last modification. <em>Better, but the source has to maintain it</em>. Some databases do this automatically via triggers; some don't. If the backend team forgets to update <code>updated_at</code> when they change a row, you miss the update silently.</p>

<p><strong>Option C: auto-incrementing ID</strong>. If the source uses sequential IDs, you can watermark on max(id). <em>Problem:</em> doesn't handle updates at all, only inserts. Useful for append-only sources like event logs.</p>

<p><strong>Option D: a dedicated change-log table or CDC stream</strong>. The source publishes every change to a separate stream you can read in order. We'll cover this in Phase 10. For now, just know it exists as the gold-standard option.</p>

<p>In practice, most batch pipelines use <code>updated_at</code> for transactional tables and <code>created_at</code> or auto-incrementing ID for append-only ones. You will make this decision explicitly. Document why.</p>

<h4>Where do you store the watermark?</h4>

<p>The watermark must survive between pipeline runs. Three common patterns:</p>

<p><strong>1. A dedicated state table in your warehouse</strong>: a table like <code>pipeline_state</code> with columns <code>(pipeline_name, last_watermark, last_run_at)</code>. Every successful run updates a row. Simple, durable, you can query it.</p>

<p><strong>2. The orchestrator's metadata</strong>: tools like Airflow track execution dates and can pass them to subsequent runs. We'll see this in Phase 9.</p>

<p><strong>3. A flag file in object storage</strong>: a small JSON file in S3 like <code>watermarks/orders/state.json</code> with the current watermark. Cheap and durable.</p>

<p>Any of these work. The wrong answer is "in memory" or "in a local file on the pipeline machine": anything that doesn't survive a machine reboot.</p>

<h4>The late-arriving records problem</h4>

<p>Now here's where it gets interesting. Imagine:</p>

<ul>
  <li>It's 2:00am. Your pipeline runs.</li>
  <li>It pulls all records with <code>updated_at &gt; 01:00am</code>.</li>
  <li>It finds 500 records. Processes them. Advances the watermark to 01:59:58.</li>
  <li>At 2:00:30am, a record gets inserted into the source with <code>updated_at = 01:59:30</code>.</li>
</ul>

<p>That last record is "late-arriving": it has a timestamp from your batch window, but it appeared <em>after</em> your batch read. Your next run starts from 01:59:58. The late record is below your new watermark. <strong>You will never pull that record.</strong></p>

<p>How does this happen? The source's transaction takes time to commit. The clock on the source machine is slightly off. Replication lag means the read replica saw it after the primary inserted it. There are a dozen ways this happens, and it happens constantly.</p>

<p>The fix: <strong>watermark with a lag</strong>. Instead of pulling <code>updated_at &gt; :last_watermark</code>, you pull <code>updated_at &gt; :last_watermark AND updated_at &lt;= NOW() - INTERVAL '5 minutes'</code>. You accept that you're always 5 minutes behind real-time, but you guarantee that any record visible during your window will eventually be picked up.</p>

<p>The lag value (5 minutes, 30 minutes, an hour) is a tradeoff between freshness and completeness. You will make this decision per pipeline. There is no universal right answer.</p>

<h4>The crash problem</h4>

<p>Your pipeline starts at 2am. It pulls 500 records. It begins writing them to the warehouse. Halfway through, the warehouse connection drops. The pipeline crashes.</p>

<p>Question: do you advance the watermark or not?</p>

<p>If you advance it: some records were written, some weren't. Next run starts above the watermark and never re-pulls the missing ones. <strong>Silent data loss.</strong></p>

<p>If you don't advance it: next run re-pulls everything from this batch. Some records get inserted twice. <strong>Duplicates.</strong></p>

<p>The right pattern is: <strong>only advance the watermark after the ENTIRE batch is durably committed.</strong> Concretely: write all records to the warehouse first (or to a staging area), confirm the write completed, then update the watermark in a separate transaction. If anything fails before the watermark advances, the next run re-pulls everything, and (critically) your insert logic is <em>idempotent</em>, which we'll get to in a moment.</p>

<h4>The bootstrap problem</h4>

<p>First run of any pipeline. There is no previous watermark. What do you do?</p>

<p>Options:</p>
<ul>
  <li>Pull everything (full backfill): fine for small tables, painful for large ones</li>
  <li>Pull from a configured "epoch" date: start from, say, the company's founding date</li>
  <li>Pull only forward: set the initial watermark to <code>NOW()</code> and ignore history</li>
</ul>

<p>For most analytical use cases you want option 1 or 2: you do need historical data. For pure operational replication you might want option 3.</p>

<p>Document the choice. The first time someone asks "why don't we have orders before 2023?" you'll wish you had.</p>

<h3>Idempotency: built in, not hoped for</h3>

<p>I mentioned this above. Let's go properly.</p>

<div class="board">────────────────────────────────────────────────
IDEMPOTENCY - definition

A pipeline is idempotent if running it twice on the
same input window produces the same destination state
as running it once.

More usefully: a re-run on the same input range
produces the same destination state regardless of
whether previous runs succeeded, failed partway, or
never ran.

This is a property you ENGINEER IN. Pipelines are not
idempotent by default. You make them idempotent through
specific mechanisms.
────────────────────────────────────────────────</div>

<h4>Three mechanisms to achieve idempotency</h4>

<p><strong>Mechanism 1: Deterministic destination keys.</strong></p>

<p>Every record you write has a primary key that comes from the source. When you write a record, you write it to a specific key. Re-writing the same record to the same key either overwrites (idempotent) or no-ops (also idempotent).</p>

<p>For tables, this looks like:</p>

<pre><code>-- Instead of:
INSERT INTO orders_warehouse SELECT * FROM staging;  -- creates duplicates on re-run

-- Use:
MERGE INTO orders_warehouse t
USING staging s
  ON t.order_id = s.order_id
WHEN MATCHED THEN UPDATE SET ...
WHEN NOT MATCHED THEN INSERT ...;  -- idempotent: re-run produces same result</code></pre>

<p>The MERGE operation (sometimes called UPSERT) is idempotent because it's keyed on <code>order_id</code>. Run it once or run it five times: same final state.</p>

<p><strong>Mechanism 2: Deterministic file paths.</strong></p>

<p>For object-storage writes, partition by the source data's date and use deterministic file names:</p>

<pre><code># Bad: timestamp-based file name
s3://raw/orders/2025-01-15/orders_20250115T020034.parquet  # different name every run

# Good: source-data-based deterministic path
s3://raw/orders/year=2025/month=01/day=15/orders.parquet  # re-run overwrites cleanly</code></pre>

<p>Re-runs overwrite the same file. No duplicates, no orphaned files from old runs.</p>

<p><strong>Mechanism 3: Watermark + transactional advancement.</strong></p>

<p>The pattern from earlier: only advance the watermark after the destination write succeeds. Combined with deterministic keys, this means a partial failure leads to a full re-run of the failed batch, with no duplicates and no losses.</p>

<p>These three mechanisms combine. A well-engineered batch pipeline uses all three: deterministic keys in the destination, deterministic paths in object storage, and watermark advancement only on commit.</p>

<p>We will hold every script you write in this bootcamp to this standard starting Week 11. The first Python pipeline you write that is not idempotent: I'm sending it back. Idempotency is not advanced engineering. It is baseline engineering.</p>

<h3>Quadrant-specific monitoring: what to actually watch</h3>

<p>Each ingestion quadrant fails in different ways. Each one needs different monitoring.</p>

<h4>Pull + Batch</h4>

<p>You own the schedule. You own the watermark. Failure modes:</p>

<ul>
  <li>Job doesn't run (scheduler died, infrastructure failure)</li>
  <li>Job runs but returns zero records (source down? Or zero actual new records?)</li>
  <li>Job runs slowly (volume grew, network slow)</li>
  <li>Job runs but writes corrupted data</li>
</ul>

<p>Monitors to set:</p>

<ul>
  <li><strong>Job-success monitor:</strong> did the job complete in its scheduled window?</li>
  <li><strong>Volume monitor:</strong> is row count today within historical bounds? (50% drop = alert)</li>
  <li><strong>Watermark-lag monitor:</strong> is the current watermark recent enough?</li>
</ul>

<h4>Push + Batch</h4>

<p>This is the most dangerous quadrant for one specific reason: <strong>you do not control when the file arrives.</strong></p>

<p>The vendor's pipeline ran late. Or didn't run at all. Or ran but the upload failed. Your monitoring cannot detect any of this through your own pipeline: your pipeline never executed because there was nothing to execute on.</p>

<p>The only signal you have is <strong>absence of data</strong>. And absence is the hardest thing to detect.</p>

<p>The pattern that catches this is a <strong>freshness check</strong>: a separate monitor that fires when expected data hasn't arrived by the expected time.</p>

<pre><code># Pseudo-code for a freshness check, runs every 15 minutes:

expected_arrival = "07:00 IST every weekday"
grace_window = 90 minutes

if today is a weekday and current_time > expected_arrival + grace_window:
    if no file present at s3://vendor-drops/ad-sales/year=YYYY/month=MM/day=DD/:
        page on-call: "Ad-sales file missing - expected by 07:00, currently 08:30+"</code></pre>

<p>You build this freshness sensor <em>before</em> you build the pipeline that processes the file. The processing pipeline is useless if you don't know when the file should have been there.</p>

<p>I have seen this exact failure cost a company an entire morning of stale dashboards because nobody built the freshness check. The vendor's S3 push failed silently at 06:55am. The data team's processing job had nothing to process, ran successfully on yesterday's leftover state, and the CEO email was wrong. <strong>The file didn't arrive. Nobody noticed for four hours.</strong></p>

<h4>Pull + Streaming</h4>

<p>Higher complexity than batch pull because you're polling constantly. Rate-limited by source-side concerns.</p>

<p>Monitors:</p>
<ul>
  <li><strong>Poll-success rate:</strong> what percentage of polls returned successfully?</li>
  <li><strong>Response-time monitor:</strong> if the source slows down, you'll see polls timing out</li>
  <li><strong>Rate-limit monitor:</strong> are you being throttled?</li>
</ul>

<h4>Push + Streaming</h4>

<p>The source pushes events. Your consumer is subscribed and must always be running to receive.</p>

<p>The critical concept here is <strong>consumer lag</strong>.</p>

<div class="board">────────────────────────────────────────────────
CONSUMER LAG - definition

In a push+streaming system (Kafka, Kinesis), events
accumulate in the source topic/stream. Consumers read
them in order, tracking their position via an OFFSET.

Consumer lag = the difference between the latest
offset in the topic and the offset your consumer
has processed up to.

If lag is 0 (or very small): your consumer is keeping
up with the stream.

If lag is growing: events are arriving faster than
your consumer is processing them. You're falling
behind real-time.

This is the single most important metric in a
streaming consumer. If lag grows unbounded, your
"real-time" pipeline is actually serving minute-old
data, then hour-old data, then yesterday's data.
────────────────────────────────────────────────</div>

<p>Monitors for push+streaming:</p>
<ul>
  <li><strong>Consumer lag:</strong> alert if it crosses a threshold (e.g., 1000 unprocessed messages, or 60 seconds behind)</li>
  <li><strong>Consumer aliveness:</strong> is the consumer process actually running?</li>
  <li><strong>Schema validation rate:</strong> what percentage of incoming events are passing validation? (We'll cover this in Part Four.)</li>
</ul>

<h3>The full ingestion failure catalog</h3>

<p>To close this section, the failure modes you should expect, organized so you can use this as a reference:</p>

<ul>
  <li><strong>Schema drift</strong>: source renames/adds/changes a column. Catches: schema validation at ingest, schema contracts (Day 2).</li>
  <li><strong>Network failures mid-extraction</strong>: connection drops. Catches: idempotent re-runs.</li>
  <li><strong>Source-side outages</strong>: source down during your run. Catches: zero-record alerts that distinguish "no new data" from "source unreachable."</li>
  <li><strong>Replica lag</strong>: read replica falls behind primary. Catches: replication-lag monitoring on the source side.</li>
  <li><strong>Rate limits</strong>: API caps your requests. Catches: rate-limit-aware client code, exponential backoff with jitter.</li>
  <li><strong>Time zone bugs</strong>: source in IST, pipeline assumes UTC. Catches: explicit timezone handling, always store UTC internally.</li>
  <li><strong>Missing file in push+batch</strong>: vendor didn't send. Catches: freshness sensors.</li>
  <li><strong>Late-arriving records</strong>: record committed after your watermark passed. Catches: watermark lag.</li>
  <li><strong>Consumer crash in push+streaming</strong>: consumer dies, events accumulate. Catches: consumer-lag monitoring, automatic restart.</li>
</ul>

<p>Every one of these has a known countermeasure. Each countermeasure is engineering work that lives in your ingestion code. Ingestion that "just pulls data" without handling any of this is not ingestion: it is a future incident with the date not yet filled in.</p>

<h3>Back to Zomato</h3>

<p>Your 8:47pm tap published an event to a Kafka topic. The payload looks like this:</p>

<pre><code>{
  "event_id": "evt_77a1b2",
  "event_type": "order_placed",
  "order_id": "zmt_881234",
  "user_id": "usr_9921",
  "restaurant_id": "rst_441",
  "items": [{"name": "Hyderabadi Biryani", "price_inr": 349, "qty": 1},
            {"name": "Raita", "price_inr": 60, "qty": 1}],
  "total_inr": 487,
  "placed_at": "2025-01-15T20:47:33+05:30"
}</code></pre>

<p>A consumer we own is subscribed to that topic. Within milliseconds of the event being published, our consumer receives it. <strong>Push + streaming</strong>, quadrant (4). The data is now in our world.</p>

<p>Now: what does our consumer DO with the event? This is where students often get a misleading mental picture, so I want to spell it out concretely before we move to the storage section.</p>

<p>Quick term first: I'm about to mention <strong>Redis</strong>. Redis is a database that lives entirely in RAM (memory) instead of on disk. That makes it extremely fast (sub-millisecond reads), but small (you can't fit terabytes of data in RAM). It's the standard tool for "I need to read and write small bits of state really fast." Live dashboards, session caches, real-time counters. We'll go deeper in the storage section.</p>

<p><strong>Our consumer is one Python program.</strong> When an event arrives, that single program does several things in sequence, milliseconds apart:</p>

<div class="board">────────────────────────────────────────────────
THE ONE-CONSUMER, MULTIPLE-WRITES PATTERN

Our consumer (a Python script running 24/7):

  1. Receives event from Kafka
  2. Validates it against the expected schema
     (good events continue; bad events go to quarantine
     - we'll cover this in Part Four)
  3. Writes a copy of the event to S3 raw layer
     (for archive + warehouse load later)
  4. Writes/updates relevant state in Redis
     (for the live dashboard - IF a live consumer needs
      this data; otherwise this step is skipped)
  5. Acknowledges to Kafka that the event was processed
  6. Loops back, waits for the next event

All five steps happen inside ONE consumer process,
typically within 100-200 milliseconds end-to-end.

Critical detail: Redis does NOT read from S3. Redis
and S3 are TWO SEPARATE WRITES from the same consumer.
The consumer fans out - same event, two destinations,
both written essentially in parallel.
────────────────────────────────────────────────</div>

<p>Why does this matter? Because a learner reading "data flows from Kafka to S3 to Redis" might think there's a slow path from S3 to Redis. There isn't. The streaming consumer writes directly to Redis. S3 is for the slow downstream batch path; Redis is for the live dashboard. <strong>The two writes happen from the same program at the same time.</strong> Lakshmi's dashboard sees fresh data because the consumer pushes to Redis as the event arrives, not because Redis is pulling from S3.</p>

<p>If a consumer doesn't need to feed a live dashboard, it skips step 4. Most consumers do. Real-time writes to Redis exist only where a real-time consumer demands them.</p>

<p>It has been ingested. That is all that has happened. Not cleaned, not transformed, not modeled, not useful. Raw, in our hands, and the clock is now ticking on what we do with it.</p>

<hr>

<h2><span class="num">Part Three</span>Stage 2: Storage</h2>

<p class="stage">*draws a box in the middle labeled "Storage", then immediately divides it into two boxes*</p>

<p>I'm going to do something now that students always object to the first time. I'm drawing <em>two</em> storage boxes, not one.</p>

<p>The single biggest mistake students make when sketching a data architecture is drawing "the database" as one box. <strong>Storage is not one thing.</strong> Treating it as one thing is how you build platforms where nobody can tell what's raw, what's clean, what's trusted. Where the data scientist trains a model on a table someone overwrote yesterday. Where the analyst's dashboard breaks because the schema was changed for a different team's needs.</p>

<p><strong>Storage is layered. Every layer has one job. The job is different at every layer.</strong></p>

<h3>Layer 1: The raw landing zone</h3>

<p>When the Kafka consumer receives our order event, the <em>first</em> thing it does (before any transformation) is write the event to an object store. The most common ones you'll encounter:</p>

<ul>
  <li><strong>S3</strong> on AWS</li>
  <li><strong>Google Cloud Storage (GCS)</strong> on Google Cloud</li>
  <li><strong>Azure Blob Storage</strong> on Azure</li>
</ul>

<p>For the rest of this lecture I'll say "S3" but the principle is the same across providers.</p>

<p>The raw layer holds exactly what arrived, exactly as it arrived, for as long as your retention policy says to keep it.</p>

<p>No transformation. No cleaning. The raw JSON of the order event lands in S3 as a file, organized into a structure that supports later querying.</p>

<h4>File organization matters</h4>

<p>How you organize files in the raw layer determines whether you can find anything later.</p>

<p>The standard pattern is <strong>partitioning by date and source</strong>, in this shape:</p>

<pre><code>s3://tahini-raw/kafka/orders_placed/
    year=2025/
        month=01/
            day=15/
                hour=20/
                    evt_77a1b2.json
                    evt_77a1b3.json
                    ...</code></pre>

<p>Why this shape? Three reasons:</p>

<p><strong>One: query engines can prune.</strong> When a downstream tool reads from S3, it can look at the path structure and skip directories that don't match the filter. If you query <code>WHERE day = 15</code>, the engine only reads files under <code>day=15/</code>. Files under <code>day=14/</code> are never opened. This makes queries dramatically faster.</p>

<p><strong>Two: it makes time-range operations natural.</strong> "Re-process January 2025" maps to a directory tree. "Delete data older than 2 years" maps to deleting old year directories. These operations would be painful with flat file names.</p>

<p><strong>Three: it's the standard.</strong> Hive-style partitioning (the <code>key=value</code> format) is recognized by every modern data tool. Choose your own format and you opt out of the ecosystem.</p>

<h4>Why have a raw layer at all?</h4>

<p>Three reasons, all needed:</p>

<p><strong>One: your transformation logic will be wrong.</strong> Not might be. <em>Will be.</em> Business definitions change. You'll find a bug in how you computed revenue six months ago. You'll need to recompute. If you've thrown away the raw data, you can't. The raw layer is your insurance policy against your own future mistakes.</p>

<p><strong>Two: business definitions change retroactively.</strong> Finance decides "revenue" now excludes partial refunds. That changes how every historical month should be calculated. You must be able to recompute the past from the original facts.</p>

<p><strong>Three: regulatory and audit requirements.</strong> Some industries (finance, healthcare) legally require retention of the original record. Modified data is not sufficient.</p>

<h4>Retention policy decisions</h4>

<p>The raw layer is <strong>append-only by default</strong>. You write to it. You don't modify what's there. But "forever" is not actually the retention policy: you make explicit decisions about how long to keep what.</p>

<p>Considerations:</p>

<ul>
  <li><strong>Storage cost.</strong> S3 is cheap but not free. Five years of high-volume event data at hot-tier pricing adds up.</li>
  <li><strong>Tiered storage.</strong> S3 has hot tiers (frequent access), cold tiers (rare access, cheaper), and archive tiers (slow retrieval, cheapest). Lifecycle rules can automatically move data between tiers as it ages.</li>
  <li><strong>GDPR right-to-erasure.</strong> European users have the legal right to request deletion of their data. The raw layer must support targeted deletion. "Append-only" has to accommodate this.</li>
  <li><strong>Audit requirements.</strong> Some industries require minimum retention (5 years, 7 years). You cannot delete below that.</li>
</ul>

<p>You will not solve retention on day one. Most teams start with "keep everything in hot tier" and add lifecycle policies later as costs grow. Just be aware that "forever" is a temporary answer.</p>

<p>Some architectures call this layer Bronze. Some call it Raw. Some call it Landing. Names vary, principle doesn't.</p>

<h3>Layer 2: The data warehouse</h3>

<p>After raw event lands, a processing step reads it, cleans it, applies business logic, joins it with reference data, and writes a structured row to a different system: the <strong>data warehouse</strong>. Common ones you'll encounter:</p>

<ul>
  <li><strong>Snowflake</strong>: multi-cloud, most popular in India for new projects</li>
  <li><strong>BigQuery</strong>: Google Cloud's native warehouse</li>
  <li><strong>Redshift</strong>: AWS's native warehouse</li>
  <li><strong>Databricks SQL</strong>: Databricks' warehouse layer</li>
</ul>

<p>For this lecture I'll say "Snowflake" but the architecture concepts apply universally.</p>

<p>The warehouse is engineered differently from operational databases:</p>

<ul>
  <li><strong>Columnar storage.</strong> Data is stored by column, not by row. Analytical queries that read 3 columns of a 50-column table only pay for those 3 columns. We'll cover this in Phase 7.</li>
  <li><strong>Separated storage and compute.</strong> The data sits in object storage; compute clusters spin up to query it. This means storage costs and compute costs scale independently.</li>
  <li><strong>Optimized for analytical queries.</strong> Joins across millions of rows, aggregations, window functions: these are what warehouses are built for.</li>
</ul>

<p>The warehouse is where curated, trusted, query-ready data lives. The <code>fct_order_items</code> table from Day 1 lives here. Clean, typed, modeled, documented. Analysts query it. Dashboards read from it. Models train on extracts from it.</p>

<h3>Layer 3: Real-time stores (when needed)</h3>

<p>Some consumer requirements cannot wait for warehouse-speed answers. The ops dashboard from Day 1's discussion needs "what is happening right now" in seconds, not in minutes.</p>

<p>For these consumers, you add a third layer: a <strong>real-time store</strong>.</p>

<p>Common ones:</p>

<ul>
  <li><strong>Redis</strong>: in-memory key-value store, sub-millisecond reads</li>
  <li><strong>Elasticsearch</strong>: search-optimized store with real-time aggregations</li>
  <li><strong>ClickHouse</strong>: columnar database optimized for low-latency analytical queries on fresh data</li>
  <li><strong>Apache Pinot, Apache Druid</strong>: real-time OLAP systems</li>
</ul>

<p>These stores are not your warehouse and not your raw layer. They hold a small slice of "what's currently happening": typically the last few minutes to last few hours of data, in a shape optimized for the specific live queries the consumer needs.</p>

<p>The critical architectural point: <strong>data flows to the real-time store directly from the streaming pipeline, bypassing the warehouse entirely.</strong></p>

<p>If you route through the warehouse, you add the warehouse's own latency to your real-time path. By the time data lands in Snowflake and is queryable, it's already 30 seconds to 2 minutes old. That blows a 60-second SLA. The warehouse is for "what happened" questions; the real-time store is for "what is happening now" questions.</p>

<h3>The lakehouse footnote</h3>

<p>You'll hear the word <em>lakehouse</em>: usually paired with names like <strong>Iceberg</strong>, <strong>Delta Lake</strong>, or <strong>Hudi</strong>.</p>

<p>These are table formats that bring warehouse-like guarantees (defined schemas, ACID transactions, time travel) to data sitting on object storage. They blur the line between "raw data lake" and "structured warehouse."</p>

<p>Why does this exist? Cost and flexibility. A warehouse like Snowflake charges premium prices for storage. Object storage is much cheaper. Lakehouses let you keep most of your data on cheap object storage with warehouse-style governance, only paying warehouse prices for the layer that genuinely needs warehouse features.</p>

<p>For today the cleaner framing: <strong>schema-on-read vs schema-on-write is a property of the table format and how it's configured, not a property of where the data physically lives.</strong> S3 can have schema-enforced Iceberg tables (warehouse-like). A warehouse can have semi-structured VARIANT columns that are effectively schema-on-read (lake-like). The principle that matters is: <em>at some point in your pipeline, schema must become enforced</em> (that's what makes downstream data trustworthy). <em>Where</em> you enforce it is a design choice driven by your stack.</p>

<p>We'll go deeper on lakehouses in Phase 7. For now, recognize the term.</p>

<hr>

<h2><span class="num">Part Four</span>The trust boundary: schema-on-read becomes schema-on-write, in code</h2>

<p>This is the single most important transition in your entire pipeline. Most courses bury it in vocabulary. We're going to make it concrete with actual code shapes.</p>

<p class="pull">The transition from raw storage to warehouse storage is the transition from schema-on-read to schema-on-write. That transition is where your data becomes trustworthy.</p>

<h3>What schema-on-read actually means, mechanically</h3>

<p>In the raw layer, when you write a JSON event to S3, no system checks its structure. The event is bytes on disk. It has whatever fields it has.</p>

<p>Later, when something reads that file (a Spark job, a Python script, a SQL query against an external table) the reader has to parse the bytes and figure out the structure. That figuring-out is what "schema-on-read" means.</p>

<p>If today's event has a field <code>merchant_category_code</code> and tomorrow's event has a field <code>mcc_v2</code>, both files get written to the raw layer without complaint. The reader has to handle both possibilities at query time.</p>

<p>This is <em>flexible</em>. Source systems can evolve. Your ingestion never breaks on a field rename. You always capture <em>something</em>.</p>

<p>It is also <em>unsafe</em>. Two events on two different days can have different shapes. No guarantee. No enforcement. No alarm bell when the structure changes.</p>

<h3>What schema-on-write means, mechanically</h3>

<p>In the warehouse, you define tables explicitly:</p>

<pre><code>CREATE TABLE orders (
    order_id        VARCHAR     NOT NULL,
    user_id         VARCHAR     NOT NULL,
    restaurant_id   VARCHAR     NOT NULL,
    placed_at       TIMESTAMP   NOT NULL,
    status          VARCHAR     NOT NULL,
    total_inr       DECIMAL(10,2) NOT NULL,
    -- ...
);</code></pre>

<p>The table has defined columns, defined types, defined nullability. When you load data into this table, the warehouse <em>can</em> reject input that violates the schema. But (and this is the caveat that catches students) <strong>only if you configure it to.</strong></p>

<h3>The configuration that matters: ON_ERROR</h3>

<p>The Snowflake COPY INTO statement loads data from S3 files into warehouse tables. It has a parameter called <code>ON_ERROR</code>. Different values produce wildly different behaviors:</p>

<pre><code>-- Option 1: ABORT on any bad row
COPY INTO orders
FROM @raw_stage/orders/
ON_ERROR = 'ABORT_STATEMENT';
-- One bad row, the whole load fails. Aggressive but loud.

-- Option 2: CONTINUE past bad rows silently
COPY INTO orders
FROM @raw_stage/orders/
ON_ERROR = 'CONTINUE';
-- Bad rows are skipped. Good rows loaded. NO ALERT.
-- This is the default-friendly trap.

-- Option 3: SKIP_FILE with a threshold
COPY INTO orders
FROM @raw_stage/orders/
ON_ERROR = 'SKIP_FILE_5%';
-- If more than 5% of rows in a file are bad, skip the
-- entire file. Otherwise continue.</code></pre>

<p>The fintech failure in our opening story happened, in part, because their COPY INTO was configured with the equivalent of <code>ON_ERROR = 'CONTINUE'</code>. When the source renamed a column, every row had a NULL where the column used to be. None of the rows were technically malformed: they had all the required columns; one of them was just NULL. The warehouse accepted them. The fraud model was trained on data where <code>merchant_category</code> was never null. Now it was always null. The model's input distribution shifted entirely. Outputs degraded silently.</p>

<p><strong>Schema enforcement in the warehouse happens because you configured the pipeline to enforce it.</strong> The warehouse provides the <em>capability</em>; you provide the <em>discipline</em>. A student who thinks "the warehouse will reject bad data" will get burned the first time their pipeline silently absorbs 50,000 malformed rows.</p>

<h3>Three choices when validation fails</h3>

<p>When a record fails validation at the trust boundary, you have three options. Most courses present them as equivalent. They are not.</p>

<p><strong>Choice 1: Crash the entire pipeline.</strong></p>

<pre><code>-- ON_ERROR = ABORT_STATEMENT
-- Any bad row → whole load fails → next batch tries again</code></pre>

<p>Pro: maximum signal. You will know something is wrong.</p>

<p>Con: a single bad record stops everything. Production pipelines hate this. One typo in one event blocks your entire evening's data.</p>

<p>Appropriate when: bad data is a critical failure that you genuinely should investigate immediately, and partial data is worse than no data.</p>

<p><strong>Choice 2: Silently drop the bad record.</strong></p>

<pre><code>-- ON_ERROR = CONTINUE
-- Bad rows skipped, good rows loaded, no alert</code></pre>

<p>Pro: pipeline keeps running.</p>

<p>Con: you have no idea anything failed. <em>This is exactly the fintech failure mode.</em> Silent drops are how seven-figure mistakes happen.</p>

<p>Appropriate when: never, in production. (Sometimes useful in development.)</p>

<p><strong>Choice 3: Quarantine the bad record and continue.</strong></p>

<pre><code>-- Custom pipeline logic:
-- 1. Validate each record
-- 2. Good records → load to orders table
-- 3. Bad records → load to orders_quarantine with rejection_reason
-- 4. Alert if quarantine rate > threshold</code></pre>

<p>Pro: pipeline runs, bad records are captured for investigation, alerts fire when something changes.</p>

<p>Con: requires more engineering than the other two. The validation logic, the quarantine table, the alerting threshold: all have to be designed.</p>

<p>Appropriate when: production. Always.</p>

<h3>The quarantine pattern in detail</h3>

<p>The quarantine table is a parallel structure to your main table, with extra columns for failure metadata:</p>

<pre><code>CREATE TABLE orders_quarantine (
    -- Original payload columns
    order_id        VARCHAR,
    user_id         VARCHAR,
    total_inr       VARCHAR,  -- intentionally permissive types
    status          VARCHAR,
    -- ...

    -- Quarantine metadata
    rejected_at     TIMESTAMP NOT NULL,
    rejection_reason TEXT     NOT NULL,
    raw_payload     VARIANT   NOT NULL  -- the original JSON, for debugging
);</code></pre>

<p>Note that the quarantine table uses permissive types (everything VARCHAR/VARIANT). The point of quarantine is to capture data that fails strict validation, so you can't impose strict types on the quarantine itself.</p>

<p>When a record fails validation, the validation code routes it here:</p>

<pre><code># Pseudo-code for the validation step:

for record in records_from_raw:
    validation_errors = validate(record, schema=orders_schema)

    if not validation_errors:
        write_to_warehouse(orders, record)
    else:
        write_to_warehouse(orders_quarantine, {
            **record,
            'rejected_at': now(),
            'rejection_reason': str(validation_errors),
            'raw_payload': original_json(record)
        })</code></pre>

<p>And the monitor that watches quarantine:</p>

<pre><code># Runs every hour:
SELECT COUNT(*) AS rejection_count
FROM orders_quarantine
WHERE rejected_at >= NOW() - INTERVAL '1 hour';

-- If count > threshold (e.g., 100), page on-call
-- If count > critical_threshold (e.g., 5000), wake people up</code></pre>

<h3>Validation libraries: pydantic and pandera</h3>

<p>For Python pipelines, you don't write validation logic from scratch. Two libraries dominate:</p>

<p><strong>pydantic</strong>: validates individual records against schemas. You define a model class, pass records to it, it raises exceptions on invalid input. Standard for API validation, also used in record-by-record pipelines.</p>

<p><strong>pandera</strong>: validates pandas/Spark DataFrames against schemas. Used when you're processing batches of records at once. Defines expected columns, types, value ranges, custom check functions.</p>

<p>We'll cover both properly in Phase 4 (Python). For Day 3, recognize them as tools. The <em>concept</em> matters more than the syntax: at the trust boundary, validation happens, and a library makes that validation declarative rather than ad-hoc.</p>

<h3>The fintech failure, mapped to this section</h3>

<p>Now let's go back to the fintech story and identify the specific mechanical catches that would have prevented it.</p>

<p><strong>Catch 1: schema validation at ingest.</strong></p>

<p>If the Kafka consumer had validated each event against an expected schema (using pydantic, or a JSON Schema validator), the first event with <code>mcc_v2</code> instead of <code>merchant_category_code</code> would have failed validation. The event would have been routed to a quarantine area. An alert would have fired on the first day.</p>

<p>Cost of catch: minutes after the schema change. Before the fraud model saw a single bad input.</p>

<p><strong>Catch 2: schema enforcement at the warehouse load.</strong></p>

<p>If the COPY INTO had used <code>ON_ERROR = ABORT_STATEMENT</code> with a strict schema, the load would have failed when records arrived without <code>merchant_category_code</code>. The on-call DE would have investigated and found the rename within hours.</p>

<p>Cost of catch: at the next batch load, typically within an hour.</p>

<p><strong>Catch 3: data quality checks on the loaded table.</strong></p>

<p>Even without strict schema enforcement, a simple monitor would have caught this: <em>"What percentage of merchant_category values are null today vs yesterday?"</em> Yesterday: 0.1%. Today: 100%. A 1000x change in null rate is an anomaly worth paging someone over.</p>

<p>Cost of catch: morning after the change, when the daily quality check ran.</p>

<p><strong>Catch 4: output monitoring on the fraud system.</strong></p>

<p>The fraud-flag rate dropped from ~2,800/day to 312/day overnight. That's a 90% drop in the system's own output. Monitoring the model's flag rate would have caught this on day one.</p>

<p>Cost of catch: morning after, when the model's daily metrics ran.</p>

<p>Four chances. Four mechanical patterns. None of them implemented. The team had built the pipeline to <em>run</em>, not to <em>know what it didn't know</em>.</p>

<p>We are going to build every pipeline in this bootcamp to know what it doesn't know. That is what "production-grade" means.</p>

<h2><span class="num">Part Five</span>Stage 3: Processing mechanics</h2>

<p>If ingestion is movement and storage is persistence, processing is <strong>transformation</strong>. This is where raw data becomes useful data. This is where almost all of the <em>interesting</em> engineering decisions live, and it's where the majority of code you write as a DE will sit.</p>

<p>Processing answers one question: <strong>what must happen to this data before it is useful to a consumer?</strong></p>

<p>The answer is never "nothing." Even the cleanest source data needs <em>some</em> work. Let me give you the real taxonomy with examples.</p>

<h3>What processing actually does</h3>

<h4>Cleaning</h4>

<p>Raw data is dirty. Concrete examples:</p>

<ul>
  <li>Fields that should be null are empty strings: <code>""</code> instead of <code>NULL</code></li>
  <li>Strings have leading/trailing whitespace: <code>"  Bangalore "</code> instead of <code>"Bangalore"</code></li>
  <li>Timestamps in three different formats because three SDK versions emitted them differently: <code>"2025-01-15T20:47:33Z"</code>, <code>"2025-01-15 20:47:33"</code>, <code>"1737030453"</code> (Unix epoch)</li>
  <li>Prices sometimes in paise (4870), sometimes in rupees (48.70), sometimes negative (refunds, with no indication that's what they are)</li>
  <li>Phone numbers include country codes sometimes (<code>+91XXXXXXXXXX</code>), don't other times (<code>XXXXXXXXXX</code>)</li>
  <li>Casing inconsistencies: <code>"Coimbatore"</code>, <code>"coimbatore"</code>, <code>"COIMBATORE"</code> (all the same city, three different strings)</li>
</ul>

<p>Cleaning is the unglamorous baseline. You will spend more of your career on cleaning than on any other single activity. Students who try to skip cleaning to get to "the interesting stuff" are the students whose pipelines fail in production six months later.</p>

<h4>Enrichment</h4>

<p>Raw events contain keys, not context. The order event has <code>restaurant_id: "rst_441"</code>. It does not contain the restaurant's name, city, cuisine, or rating.</p>

<p>To make the event useful for an analyst asking <em>"what's the top cuisine in Bangalore last week?"</em>, you have to join the order event with the restaurants reference table:</p>

<pre><code>-- Enrichment: join order with restaurant lookup
SELECT
    o.order_id,
    o.user_id,
    o.placed_at,
    o.total_inr,
    r.restaurant_name,
    r.city,
    r.cuisine_type
FROM orders o
JOIN restaurants r ON o.restaurant_id = r.restaurant_id;</code></pre>

<p>Enrichment resolves those joins at processing time, in advance, so the consumer doesn't have to. This is the denormalization we covered Day 1: the warehouse stores the joined, flattened result so analytical queries don't assemble it on the fly.</p>

<h4>Aggregation</h4>

<p>Sometimes the consumer doesn't need rows: they need summaries. Daily order counts by city. Hourly revenue by category. Weekly active users.</p>

<pre><code>-- Pre-aggregation: daily revenue by city
SELECT
    DATE(placed_at) AS order_date,
    city,
    COUNT(*) AS order_count,
    SUM(total_inr) AS revenue_inr
FROM enriched_orders
WHERE status NOT IN ('cancelled_before_accept', 'cancelled_by_restaurant')
GROUP BY DATE(placed_at), city;</code></pre>

<p>Aggregations are computationally expensive. Running them against 500 million rows every time a dashboard loads is what killed the company from Day 1's story. Running them once during processing (materializing the result into a summary table) means the dashboard is fast <em>for that specific question</em>.</p>

<p>I need to be honest about something: <strong>pre-aggregation is trading flexibility for speed on known queries.</strong> If you materialize "daily revenue by city" and a stakeholder shows up asking for "daily revenue by city <em>and payment method</em>," your materialization helps nothing (you're back to scanning the raw fact table). Pre-aggregation is not a free win. It's a specific bet on which questions matter enough to pre-compute. Choose the bets deliberately.</p>

<h4>Business logic application</h4>

<p>This is the one nobody covers properly. Raw data does not know your business rules. Concretely:</p>

<ul>
  <li>An order with status <code>cancelled_before_accept</code> should not count toward GMV. Raw data doesn't know that: your business decided it.</li>
  <li>Users who signed up in the last 7 days should be excluded from retention metrics. Raw data doesn't know that: your team decided it.</li>
  <li>Your fiscal year starts in April, not January. Raw data has dates; your business has fiscal periods.</li>
  <li>"Revenue" excludes platform-side promotional discounts but includes customer-paid taxes. Raw data has line items; your finance team's definition is in someone's head until you encode it.</li>
</ul>

<p>Business logic is the encoding of how your company <em>defines its metrics</em>. It lives in transformation code. And it must be <strong>consistent across every place a metric is used.</strong> If finance computes revenue one way and product computes it another way, and both numbers appear in the same board deck, the board deck loses credibility. Trust is the entire product of a data team. Inconsistent metrics destroy trust.</p>

<p>This is why transformation code is not a script someone writes once and forgets. It is documented, version-controlled, tested, peer-reviewed: the same discipline as application code.</p>

<h3>Batch vs Streaming, with actual numbers</h3>

<p>Every processing pipeline you ever build will be a choice between two patterns. The choice is not aesthetic. It is not "what tool is trendy." It is driven by exactly one question.</p>

<p class="pull">How fresh does this data need to be for the consumer who depends on it?</p>

<p>Let me give you actual numbers, because abstract "batch is high-throughput, streaming is low-latency" doesn't help you make the decision.</p>

<h4>Batch processing: typical performance characteristics</h4>

<ul>
  <li><strong>Latency:</strong> bounded by batch interval. Nightly batch = up to 24 hours stale. Hourly batch = up to 60 minutes stale.</li>
  <li><strong>Throughput:</strong> high. A well-tuned Spark batch job can process 10-100GB of data in 15-30 minutes on a moderately-sized cluster.</li>
  <li><strong>Cost:</strong> compute runs only during the batch window. A 30-minute nightly job at, say, $0.50/minute of cluster time = $15/day = $5,500/year.</li>
  <li><strong>Operational complexity:</strong> moderate. The job has a clear start and end, you can re-run failures, you can inspect outputs.</li>
</ul>

<h4>Streaming processing: typical performance characteristics</h4>

<ul>
  <li><strong>Latency:</strong> seconds to sub-second. Each event handled within seconds of arrival.</li>
  <li><strong>Throughput:</strong> depends on the framework. A well-tuned Flink or Spark Structured Streaming job can handle 100K-1M events/second on a moderate cluster.</li>
  <li><strong>Cost:</strong> compute runs 24/7. Same cluster size, $0.50/minute × 60 × 24 × 365 = $263,000/year. Roughly 50x the cost of an equivalent nightly batch.</li>
  <li><strong>Operational complexity:</strong> high. Handling late-arriving events, out-of-order data, exactly-once guarantees, state management, restarts: all genuinely hard.</li>
</ul>

<h4>When does the math favor streaming?</h4>

<p>Streaming costs 50x batch in compute. It costs more in engineering effort. It's harder to debug.</p>

<p>So when is it worth it? Only when a consumer's freshness requirement <em>forces</em> it. Specifically:</p>

<ul>
  <li><strong>Fraud detection in payment flows</strong>: the decision must happen before the transaction completes. Hundreds of milliseconds. Streaming is the only option.</li>
  <li><strong>Operational dashboards for time-sensitive workflows</strong>: the ops manager watching deliveries during dinner rush. Tens of seconds. Streaming required.</li>
  <li><strong>Real-time alerting on business anomalies</strong>: cancellation spike detection, payment failure spikes. Minutes. Streaming pays off.</li>
  <li><strong>Online ML feature computation</strong>: features that need fresh user state for inference. Seconds. Streaming required.</li>
</ul>

<p>Where it's almost never worth it:</p>

<ul>
  <li>Executive dashboards (they're read once a day)</li>
  <li>Financial reporting (it's daily or weekly anyway)</li>
  <li>Marketing analytics (campaigns run over days)</li>
  <li>Historical analysis (definitionally, the past doesn't change in real time)</li>
</ul>

<p>The default for any new consumer should be batch, until the consumer demonstrates a real-time requirement that batch cannot meet. Engineers who default to streaming because it sounds modern produce expensive, fragile platforms that don't deliver any more value than a well-built batch system.</p>

<h3>The Lambda architecture sidebar</h3>

<p>You may hear the term <strong>Lambda architecture</strong>. This refers to a pattern where you run <em>both</em> batch and streaming pipelines on the same data: the streaming pipeline gives you low-latency approximate results, and the batch pipeline gives you accurate results that overwrite the approximate ones once they're ready.</p>

<p>This pattern was popular ~2015. It's less common now because maintaining two pipelines for the same data is operationally painful: you have to keep their business logic in sync, which is a constant source of bugs.</p>

<p>Modern alternatives:</p>

<ul>
  <li><strong>Kappa architecture</strong>, only run streaming; batch is just a slow stream that re-processes from the start.</li>
  <li><strong>Unified frameworks</strong>: tools like Apache Beam, Spark Structured Streaming let you write logic once and run it in batch or streaming mode.</li>
</ul>

<p>For Day 3 you don't need to choose. Just recognize that "should we run both?" is a question some architectures answer yes to, and the tradeoffs are real.</p>

<h3>Operational events vs analytical streaming: the distinction</h3>

<p>This trips up students constantly. Let me draw a clean line.</p>

<p>The Zomato app's restaurant-notification system, the rider-assignment service, the live order queue in the restaurant tablet: those are <strong>operational systems</strong>. They are the backend team's responsibility. They use events because that's how modern backends work, but they are <em>operating the business</em>, not measuring it.</p>

<p>When the backend emits an <code>order_placed</code> event:</p>

<ul>
  <li>The restaurant service consumes it to display the new order on the tablet → operational</li>
  <li>The rider service consumes it to start finding a rider → operational</li>
  <li>The payment service consumes it to process the payment → operational</li>
  <li>Our data team consumes it to update Lakshmi's live dashboard → <strong>analytical streaming</strong></li>
  <li>Our data team consumes it to write to the raw layer for tomorrow's analytics → <strong>analytical streaming</strong></li>
</ul>

<p>Same event. Multiple consumers. The operational consumers are not your concern as a DE. The analytical consumers are.</p>

<p>This distinction matters because the operational systems are often misattributed to the data team. Stakeholders see "Kafka" and assume "data team owns it." No. Kafka is infrastructure. The backend team uses it to run the business. We are a subscriber to it for our analytical purposes.</p>

<h3>Back to Zomato: an honest qualifier</h3>

<p>Our order event may feed two analytical pipelines, with different freshness requirements:</p>

<p><strong>Track 1: batch (nightly).</strong> The raw event sits in S3. At 2am, the batch pipeline reads all of yesterday's orders, enriches them, applies business logic, loads to Snowflake. By 8am, the VP's revenue dashboard shows complete data.</p>

<p><strong>Track 2: streaming (real-time), where justified.</strong> The same event also flows through a streaming processor that updates the ops team's live city dashboard. Latency target: driven by the ops team's needs, probably tens of seconds.</p>

<p>Honest qualifier: <strong>most events feed only the batch pipeline.</strong> Real-time analytical pipelines exist where a specific consumer requirement justifies them (operational dashboards, fraud, anomaly detection, online ML features). Streaming everything "just in case" is over-engineering. Build streaming where the consumer requirement demands it, batch everywhere else.</p>

<h2><span class="num">Part Six</span>Stage 4: Serving, four consumer questions</h2>

<p>You've ingested. You've stored across layers. You've processed. The data is now sitting in the warehouse (and in some cases, in a real-time store) clean and trustworthy. But sitting there isn't the goal. The goal is being <em>consumed</em>.</p>

<p>This is serving. And the first thing to unlearn is the idea that serving is one thing.</p>

<p class="pull">The output of a data platform is not a dashboard. It is a portfolio of consumers, each with its own freshness, shape, and latency requirements.</p>

<p>Some serving paths go through the warehouse. Some bypass it entirely. I'm going to walk you through the <em>four questions consumers ask</em>. The tool falls out of the question. Always.</p>

<h3>Question 1: "What happened?"</h3>

<p>The most common consumer question. Asked by analysts, executives, product managers. Historical, aggregated, descriptive.</p>

<p><em>What was revenue by city last week? How did cancellation rate trend over the last 90 days? Which restaurants generated the most GMV in Bangalore in Q4?</em></p>

<p>Answered by querying the warehouse: either through a BI tool that turns SQL into charts (Looker, Tableau, Metabase, Power BI) or through an analyst writing ad-hoc SQL.</p>

<p><strong>Freshness requirement: usually daily or hourly.</strong> Nobody making strategic decisions needs revenue updated every 30 seconds. Batch processing into a well-modeled warehouse serves this consumer well.</p>

<p><strong>Serving infrastructure:</strong> warehouse + BI tool. Standard pattern.</p>

<p><strong>Failure modes:</strong></p>
<ul>
  <li>The warehouse isn't well modeled: analysts forced to write 200-line queries with eight joins. This is a <em>modeling</em> problem, addressed in Phase 1.</li>
  <li>Two analysts compute the same metric two different ways. This is a <em>governance</em> problem: addressed by centralizing metric definitions in dbt or a semantic layer.</li>
  <li>The dashboard loads slowly because the warehouse is under-provisioned. This is a <em>cost</em> decision: you can throw money at it.</li>
</ul>

<h3>Question 2: "What is happening right now?"</h3>

<p>Fundamentally different question, fundamentally different answer.</p>

<p><em>How many orders are in flight in Bangalore at this moment? Is any zone showing a cancellation spike? Are payment failures elevated this minute?</em></p>

<p>These cannot wait for nightly batch. They require streaming pipelines feeding low-latency stores. <strong>This serving path bypasses the warehouse entirely.</strong> The data goes streaming-processor → real-time store → dashboard. The warehouse is nowhere in this flow.</p>

<p><strong>Freshness requirement: seconds.</strong> Different infrastructure entirely from Question 1.</p>

<p><strong>Serving infrastructure:</strong> streaming pipeline + real-time store (Redis, ClickHouse, Pinot) + custom dashboard or specialized BI tool that supports real-time queries.</p>

<p><strong>Failure modes:</strong></p>
<ul>
  <li>Consumer lag grows: your "real-time" data is actually 10 minutes old. Mitigation: consumer-lag alerting.</li>
  <li>The real-time store falls over under load. Mitigation: load testing, capacity planning, fallback to stale data with explicit "data may be stale" warnings on the dashboard.</li>
  <li>Teams try to retrofit streaming requirements onto batch systems ("just run the batch every 5 minutes"). This sounds clever until you realize batch jobs have fixed startup costs and you're spending more time spinning up than processing.</li>
</ul>

<h3>Question 3: "What will happen?"</h3>

<p>The data scientist's question. Predictive, not descriptive.</p>

<p><em>Which users are likely to stop ordering in the next 30 days? Which restaurants are likely to be flagged for quality issues? What will demand look like in this zone next Saturday at 8pm?</em></p>

<p>Answered by ML models trained on historical warehouse data and served through specialized infrastructure.</p>

<p><strong>Serving infrastructure:</strong> training pipelines (read from warehouse) + feature pipelines (read from warehouse and real-time sources) + model serving (an API endpoint, or batch predictions written to a table) + monitoring.</p>

<p><strong>The training-serving skew problem, revisited</strong></p>

<p>From Day 2, you remember: a model trained on features computed one way, served with features computed a different way, produces wrong predictions.</p>

<p>The solution pattern is to ensure features are computed by <strong>one canonical pipeline</strong> that serves both training and production inference. The DE who owns the feature pipelines owns the integrity of the model.</p>

<p>Mature teams formalize this in a dedicated <strong>feature store</strong> product: Feast, Tecton, AWS SageMaker Feature Store. Smaller teams implement the <em>pattern</em> without buying the <em>product</em>: a shared feature computation library, a single dbt project that produces features, strict contracts between teams.</p>

<p>The product is optional. The discipline is not.</p>

<h3>Question 4: "What should we do about it?"</h3>

<p>The newest serving pattern, growing fast: pushing warehouse data <em>back</em> into operational tools.</p>

<p>Marketing doesn't live in the warehouse. They live in Salesforce, HubSpot, Braze, MoEngage. If you want them to act on "high-value customers who haven't ordered in 30 days," it's not enough for that segment to exist as a table in Snowflake. It must <em>appear in Salesforce</em> as a campaign audience someone can target.</p>

<p>This pattern is called <strong>reverse ETL</strong>: Hightouch and Census are the dominant tools. The path: warehouse → reverse ETL tool → operational system → human user.</p>

<p><strong>Why it matters:</strong> the analyses we produce only create business value if humans (or systems) act on them. Reverse ETL closes the loop.</p>

<p><strong>Failure modes:</strong> the same business-logic-consistency problem we've seen everywhere. If the segment definition drifts between the warehouse and the destination tool, marketing acts on wrong audiences.</p>

<p>We won't go deep on reverse ETL: it's its own subject. Recognize the category when you encounter it.</p>

<h3>The full consumer picture</h3>

<p>Your one Zomato order at 8:47pm is, by morning, serving:</p>

<ul>
  <li><strong>VP's morning revenue dashboard.</strong> Warehouse → Looker. Daily freshness. "What happened."</li>
  <li><strong>Ops team's live city map.</strong> Streaming → Redis → dashboard. Seconds-fresh. "What is happening now." <em>Bypasses warehouse entirely.</em></li>
  <li><strong>Churn prediction model deciding whether to send you a discount push notification tomorrow.</strong> Warehouse → feature pipeline → ML model. "What will happen."</li>
  <li><strong>Salesforce campaign audience for customer success.</strong> Warehouse → reverse ETL → Salesforce. "What should we do."</li>
</ul>

<p>One order. Four consumers. Four different serving paths, four different latency requirements, four different shapes of the same underlying data, and not all of them go through the warehouse.</p>

<p>That is what serving looks like in a real platform. Not one endpoint. A portfolio.</p>

<h2><span class="num">Part Seven</span>Two properties that run through every stage</h2>

<p>Stepping back from individual stages, two properties cut across the whole pipeline. Understanding them lets you reason about architectures you haven't seen before.</p>

<h3>Latency vs throughput: the math</h3>

<div class="board">────────────────────────────────────────────────
LATENCY - time from event happening to event being
          available to a consumer

THROUGHPUT - events processed per unit time

These are in tension. You can optimize one or the
other at any given point on the pipeline; you cannot
fully optimize both simultaneously.

The fundamental reason: optimizing latency means
processing events individually as they arrive, which
has higher per-event overhead. Optimizing throughput
means accumulating and processing in bulk, which adds
wait time proportional to the batch size.

This is not a technology limitation. It is a property
of computation.
────────────────────────────────────────────────</div>

<p>Every architectural choice (pull vs push, batch vs streaming, warehouse vs warehouse-plus-real-time-store) is a point on the latency-throughput spectrum.</p>

<p>Every time a stakeholder says "make it faster," your first question is: <strong>faster at what? For whom? At what infrastructure cost? At what engineering complexity cost?</strong></p>

<p>That's not pushback. That's the conversation that produces correct design. Your job is to make the requirement explicit, not to default to streaming because it sounds modern.</p>

<h3>Schema-on-read vs schema-on-write: the architectural property</h3>

<p>We covered this deeply in Part Four. Stepping back: it's a property of the table format and how it's configured, not of where data physically lives.</p>

<p>Raw layers tend toward schema-on-read (flexible, forgiving, captures everything, trusts nothing). Warehouse tables tend toward schema-on-write (strict, enforcing, trusts what's inside). The transition is where validation lives.</p>

<p>And validation, configured explicitly and deliberately, is what makes data trustworthy. <strong>A pipeline that does not enforce schema at the trust boundary is not a pipeline. It is a lottery.</strong></p>

<hr>

<h2><span class="num">Part Eight</span>The full lifecycle, assembled</h2>

<div class="board">User tap (8:47pm)
        │
        ↓
Backend writes to MySQL (operational world - not ours)
        │
        ↓
Backend emits event to Kafka (push + streaming ingestion)
        │
        ↓
S3 Raw Storage  ← schema-on-read, append-only, retention-policy-bound
        │
        ├──────────────────────────┐
        ↓                          ↓
Batch pipeline (2am)          Streaming pipeline (where consumer demands)
clean / enrich / validate     real-time enrichment
        │                          │
        ↓                          ↓
Snowflake warehouse           Redis / real-time store
schema-on-write (configured)  seconds-fresh
        │                          │
        ├──→ BI dashboards          └──→ Ops live map
        ├──→ Ad-hoc analyst SQL

        └──→ Reverse ETL → Salesforce, HubSpot, etc.</div>

<p>That is the machine. Every arrow is a place failure can hide. Every stage has an owner, and for almost all of it, that owner is <em>us</em>.</p>

<p>Memorize this diagram. Draw it from memory. When you encounter an architecture in the wild, map it onto this skeleton. The specific tools will vary. The shape will not.</p>

<h2><span class="num">Part Nine</span>Monitoring your own pipelines</h2>

<p>I want to spend time here because most curricula treat monitoring as an afterthought: something you bolt on later, in Phase 11. That's how you end up with the fintech story.</p>

<p>Monitoring is part of engineering. It belongs in the pipeline from day one. Let me show you what a DE actually builds to watch their own systems.</p>

<h3>The four-pillar pattern</h3>

<p>For every pipeline, you build monitoring across four pillars:</p>

<p><strong>1. Job-level monitoring.</strong> Did the job run? Did it complete? How long did it take? This is the most basic. Every orchestrator (Airflow, Dagster, Prefect) gives you this for free.</p>

<p><strong>2. Data-level monitoring.</strong> What did the job produce? Row counts. Null rates. Value distributions. This requires you to build it. The catches:</p>

<ul>
  <li>Daily row count compared to historical norms</li>
  <li>Null rate on critical columns (this would have caught the fintech failure)</li>
  <li>Value distribution checks (e.g., negative prices, ages over 150, dates in the future)</li>
  <li>Uniqueness checks on identifier columns</li>
</ul>

<p><strong>3. Output-level monitoring.</strong> What do consumers see? Did the dashboard load successfully? Did the model's flag rate change? Did the report generate? This is the highest-value layer because it monitors what actually matters.</p>

<p><strong>4. Cost monitoring.</strong> What is this pipeline costing you? Warehouse query costs, storage costs, cluster runtime costs. Pipelines that work but cost 10x what they should are still failures, eventually.</p>

<h3>What this looks like in a real team</h3>

<p>A DE team that takes monitoring seriously typically maintains:</p>

<ul>
  <li>A <strong>pipeline health dashboard</strong> showing every job's last-run status, duration, and key metrics</li>
  <li>An <strong>alerting policy</strong> defining which conditions page someone immediately vs send a daily digest</li>
  <li>A <strong>data quality dashboard</strong> showing row counts, null rates, freshness per table, updated continuously</li>
  <li>A <strong>cost dashboard</strong> showing daily/weekly spend trends per pipeline and table</li>
</ul>

<p>These are not optional. A team without them is firefighting permanently.</p>

<p>The single most important question to ask when you join a team: <em>"What do you currently monitor on your pipelines, and how do you find out when something breaks?"</em></p>

<p>If the answer is "an analyst usually notices the dashboard is broken": that's a team where you'll be the on-call DE answering panicked Slack messages because the monitoring layer doesn't exist.</p>

<h3>The principle, stated simply</h3>

<p class="pull">Observability is not what you do after engineering. Observability is engineering.</p>

<p>Every pipeline you build in this bootcamp will have monitoring designed in from the start. Not added on. Not deferred. Designed in. When you write your first Python pipeline in Week 11, it will have logs, metrics, and quality checks before it has business logic.</p>

<h2><span class="num">Part Ten</span>The fintech story, revisited</h2>

<p>Back to the scar I opened with. Three days of unflagged fraud because of a silent field rename.</p>

<p>You should now be able to point at the lifecycle diagram and name the four mechanical catches that should have happened, and didn't.</p>

<p><strong>Catch 1: Schema validation at ingestion.</strong></p>

<p>The Kafka consumer should have validated each incoming event against an expected schema. Tooling: pydantic, JSON Schema validator, or a custom validator. When the first event arrived with <code>mcc_v2</code> instead of <code>merchant_category_code</code>, validation would have failed. The event would have been routed to a quarantine area. An alert would have fired within minutes of the schema change.</p>

<p><strong>Catch 2: Schema enforcement at the trust boundary.</strong></p>

<p>The COPY INTO that loaded raw events into the warehouse should have been configured with <code>ON_ERROR = ABORT_STATEMENT</code> and strict type definitions on the destination table. NULL values in a NOT NULL column would have aborted the load. The on-call DE would have investigated and found the rename within hours.</p>

<p><strong>Catch 3: Data quality monitoring.</strong></p>

<p>A daily quality job should have computed: <em>"What percentage of <code>merchant_category</code> values are null today?"</em> Historical baseline: 0.1%. Day of rename: 100%. A 1000x change in null rate is an anomaly worth paging someone over. This monitor would have caught the failure on day one.</p>

<p><strong>Catch 4: Output monitoring on the fraud system.</strong></p>

<p>The fraud-flag rate dropped from ~2,800/day to 312/day overnight. That's a 90% drop in the system's own output. Monitoring the model's flag rate would have caught this within 24 hours of the failure.</p>

<p>Four chances. Four mechanical patterns. None of them implemented. The team had built the pipeline to <em>run</em>, not to <em>know what it didn't know</em>.</p>

<p>You are going to build pipelines that know what they don't know. That is the entire promise of this curriculum.</p>

<h2><span class="num">Part One</span>The scenario: complete, precise, no guesswork</h2>

<p>You work for a food delivery company called <strong>Tahini</strong>. They've been operating in 12 cities for four years. Next month they're launching in a new city (Coimbatore) as a pilot. If Coimbatore works, they'll roll out to more cities. If it doesn't, they'll pull out.</p>
