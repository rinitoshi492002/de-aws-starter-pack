<h2><span class="num">Part Three</span>Ingestion: getting data into your control</h2>

<p>Now the category that bridges sources to storage. This is one of the largest and most diverse categories in the stack.</p>

<h3>Sub-category A: Managed ingestion tools</h3>

<p>The "pre-built connector" tools. You don't write extraction code; you configure a connector (source + destination + schedule) and the tool handles extraction, schema inference, incremental sync, and loading.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: Managed Connector / Managed Ingestion Tool

A SaaS product that handles the extract-and-load portion
of ELT for hundreds of common sources.

You provide:
  - Source credentials
  - Destination credentials (your warehouse)
  - Sync schedule (every X minutes/hours/days)

The tool handles:
  - Connecting to the source's API or database
  - Discovering the schema
  - Extracting records (with incremental cursor logic)
  - Handling rate limits and retries
  - Mapping data types to your destination's types
  - Loading the data into your warehouse
  - Detecting and propagating schema changes

Pricing is typically per row synced or per source enabled
per month. Can range from $0/month (free tier) to
hundreds of thousands per year for enterprise volumes.
────────────────────────────────────────────────</div>

<p><strong>The dominant tools in this sub-category:</strong></p>

<ul>
  <li><strong>Fivetran</strong>: The market leader. Expensive but extremely reliable. Used by mid-to-large companies that prefer to buy reliability over building it.</li>
  <li><strong>Airbyte</strong>: Open-source alternative to Fivetran. You can self-host (free) or use their managed cloud. More customizable but more operational overhead.</li>
  <li><strong>Stitch</strong>: Owned by Talend (now Qlik). Cheaper than Fivetran, older codebase. Used by cost-conscious teams.</li>
  <li><strong>Hevo Data</strong>: Indian-origin tool. Competitive pricing in Asian markets.</li>
  <li><strong>Meltano</strong>: Open-source meta-tool that wraps the Singer protocol. More technical but very flexible.</li>
</ul>

<p><strong>When you use a managed tool:</strong> when the source is common enough that someone built a connector. When your team's time is better spent on transformation than extraction. When you need reliability (Fivetran's connectors have years of edge-case handling baked in that you'd take months to build).</p>

<p><strong>When you don't use a managed tool:</strong> when the source is unusual (no connector exists). When pricing is prohibitive (Fivetran can cost more than your warehouse). When you need custom extraction logic the connector doesn't support.</p>

<h3>Sub-category B: Custom Python ingestion</h3>

<p>For sources that don't have managed connectors, or when you need control, you write Python.</p>

<p>The typical structure of a custom ingestion script:</p>

<pre><code># Pseudo-code:

def extract(start_time, end_time):
    """Pull records from source between time window."""
    records = []
    cursor = None
    while True:
        page = source_api.get_records(
            after=start_time, before=end_time,
            cursor=cursor, limit=500
        )
        records.extend(page.data)
        if not page.has_more:
            break
        cursor = page.next_cursor
    return records

def transform_minimal(records):
    """Light validation and typing, no business logic."""
    valid = []
    quarantine = []
    for r in records:
        try:
            validated = SourceSchema.parse_obj(r)
            valid.append(validated)
        except ValidationError as e:
            quarantine.append((r, str(e)))
    return valid, quarantine

def load(records, dest_table):
    """Write to warehouse or staging area."""
    write_to_s3_parquet(records, path=f's3://raw/{dest_table}/...')
    snowflake.copy_into(dest_table, from_s3='...')</code></pre>

<p>Tools you'll encounter or use:</p>

<ul>
  <li><strong>requests, httpx</strong>: Python HTTP clients</li>
  <li><strong>pydantic, pandera</strong>: schema validation</li>
  <li><strong>boto3, snowflake-connector-python, psycopg</strong>: destination drivers</li>
  <li><strong>tenacity</strong>: retry logic</li>
</ul>

<p>Phase 6 covers Python for DE in depth. Phase 12 covers streaming ingestion.</p>

<h3>Sub-category C: Streaming platforms</h3>

<p>For event-by-event delivery, dedicated streaming platforms.</p>

<ul>
  <li><strong>Apache Kafka</strong>: The dominant open-source platform. Originally built at LinkedIn. Powers most large-scale event streaming.</li>
  <li><strong>AWS Kinesis</strong>: AWS-managed alternative to Kafka. Tightly integrated with AWS services. Simpler to operate but less feature-rich than Kafka.</li>
  <li><strong>AWS MSK (Managed Streaming for Kafka)</strong>: Actual Kafka, managed by AWS. The middle ground.</li>
  <li><strong>Google Pub/Sub</strong>: GCP's equivalent. Simpler model than Kafka.</li>
  <li><strong>Azure Event Hubs</strong>: Azure's offering.</li>
  <li><strong>Confluent Cloud</strong>: Managed Kafka by Confluent (founded by Kafka's creators).</li>
</ul>

<p>Phase 12 goes deep on Kafka and the streaming ecosystem.</p>

<h3>Sub-category D: CDC tools (Change Data Capture)</h3>

<p>CDC is a special pattern: capture every change made to an operational database, as a stream, in near-real-time.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: CDC (Change Data Capture)

A pattern where every INSERT, UPDATE, and DELETE in a
source database is captured as an event and streamed
to a destination.

The advantage over batch pulls: you see every change
immediately, including DELETEs (which batch pulls
often miss). Your downstream systems can stay in
near-real-time sync with the source.

The mechanism: most relational databases have a
"write-ahead log" or "binary log" - an append-only
record of every change made. CDC tools read that log
and convert each entry into an event.

For Postgres: logical replication
For MySQL: binary log (binlog)
For Oracle: LogMiner or proprietary tools
For SQL Server: native CDC feature
────────────────────────────────────────────────</div>

<p>Tools:</p>

<ul>
  <li><strong>Debezium</strong>: Open-source, runs as Kafka Connect plugins. The most popular CDC tool. Supports Postgres, MySQL, MongoDB, Oracle, SQL Server.</li>
  <li><strong>AWS DMS (Database Migration Service)</strong>: AWS's managed CDC. Can stream to S3, Kinesis, or another database.</li>
  <li><strong>Striim, Qlik Replicate (formerly Attunity)</strong>: Enterprise CDC tools.</li>
  <li><strong>Fivetran's CDC mode</strong>: Fivetran also offers CDC for supported sources.</li>
</ul>

<p>CDC is the gold-standard ingestion pattern for keeping a warehouse in near-real-time sync with operational databases. It's increasingly common at modern teams.</p>

<hr>

<h2><span class="num">Part Four</span>Storage, where data lives</h2>

<p>The most architecturally important category. Multiple layers, each doing a different job.</p>

<h3>Sub-category A: Object storage (the substrate)</h3>

<p>Beneath everything else in the modern stack: cheap, durable, infinitely-scalable object storage. This is the surface that makes the rest of the stack economically viable.</p>

<ul>
  <li><strong>Amazon S3</strong>: The original and dominant object store. Most modern stacks assume S3. We'll cover S3 deeply in Phase 8.</li>
  <li><strong>Google Cloud Storage (GCS)</strong>: Google's equivalent. Same API model, different ecosystem.</li>
  <li><strong>Azure Blob Storage</strong>: Microsoft's equivalent.</li>
  <li><strong>MinIO</strong>: Open-source, S3-compatible. Used for on-premise or hybrid deployments.</li>
</ul>

<p>You don't query object storage directly. You store files in it, organize them by date partitions and source, and let other tools (warehouses, query engines, processing frameworks) read them.</p>

<h3>Sub-category B: Open table formats, the lakehouse</h3>

<p>This is one of the most important developments of the last five years. <strong>Open table formats</strong> add database-like properties to data sitting in object storage.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: Open Table Format (Lakehouse)

A specification for organizing data files in object
storage so that the collection of files behaves like a
proper database table - with schema, ACID transactions,
time travel, and efficient updates.

The "open" part: the specification is published, and
multiple compute engines can read and write the same
tables. Not vendor-locked.

The "table format" part: it's not just files anymore.
The format adds metadata that turns a directory of
files into something queryable as a table.

The "lakehouse" name: data lake + warehouse properties.
Cheap storage of a lake; structure and governance of
a warehouse.
────────────────────────────────────────────────</div>

<p>Three major formats:</p>

<ul>
  <li><strong>Apache Iceberg</strong>: Originated at Netflix. Now the most popular open format. Backed by Snowflake (native support), AWS (Athena, EMR), Dremio, Trino. Vendor-neutral.</li>
  <li><strong>Delta Lake</strong>: Created by Databricks. The default in the Databricks ecosystem. Now technically open-source but the gravity is around Databricks.</li>
  <li><strong>Apache Hudi</strong>: Originated at Uber. Strong for streaming-heavy workloads (upserts, deletes). Less mainstream than Iceberg or Delta.</li>
</ul>

<p>Why does this matter? Because it changes the economics of where data lives:</p>

<p><strong>Without lakehouse:</strong> raw data sits in S3 as Parquet files (cheap), but to query it efficiently you must load it into a warehouse (expensive storage). Every byte gets duplicated: once in S3 raw, once in warehouse storage.</p>

<p><strong>With lakehouse:</strong> raw data sits in S3 as Iceberg/Delta tables. The warehouse queries those tables directly without loading them. You pay warehouse compute, not warehouse storage. For large datasets this is dramatically cheaper.</p>

<p>Snowflake's recent support for Iceberg, AWS's Athena+Iceberg integration, and Databricks' Delta Lake have made lakehouses the emerging default for new builds in 2025+. Expect to see "Iceberg" in many job postings going forward.</p>

<p>Phase 12 goes deep on lakehouses.</p>

<h3>Sub-category C: Cloud data warehouses</h3>

<p>The heart of the modern stack. Where curated, queryable, trusted data lives.</p>

<ul>
  <li><strong>Snowflake</strong>: The market leader. Cloud-agnostic (runs on AWS, GCP, Azure). Pioneered the storage-compute-cloud-services architecture. Strongest in mid-to-large companies.</li>
  <li><strong>Google BigQuery</strong>: GCP-native. Pricing model based on bytes scanned (no provisioned compute). Strong for analytical workloads, especially when paired with GA4 or other Google services.</li>
  <li><strong>Amazon Redshift</strong>: AWS-native. The oldest of the cloud warehouses (2012). Cluster-based pricing. Still very common but losing ground to Snowflake and Databricks.</li>
  <li><strong>Databricks SQL</strong>: The warehouse layer of Databricks. Based on Spark + Delta Lake. Increasingly competitive with Snowflake, especially for ML-heavy use cases.</li>
  <li><strong>Microsoft Fabric / Synapse</strong>: Microsoft's cloud warehouse offering. Strong in Microsoft-centric enterprises.</li>
  <li><strong>Firebolt, ClickHouse Cloud, StarRocks</strong>: Newer entrants positioning on speed and lower cost.</li>
</ul>

<p>For Indian product companies, Snowflake is dominant. Databricks is growing fast (especially ML-heavy companies). BigQuery is common where Google services are central. For service company work, expect Snowflake, BigQuery, and Redshift to all appear.</p>

<p>Phase 9 covers Snowflake. The architectural concepts transfer to the others.</p>

<h3>Sub-category D: Real-time stores</h3>

<p>For the consumer questions warehouses can't answer fast enough.</p>

<ul>
  <li><strong>Redis</strong>: In-memory key-value store. Sub-millisecond reads. Used for caches, session state, real-time counters.</li>
  <li><strong>ClickHouse</strong>: Columnar database optimized for low-latency analytical queries on fresh data. Growing rapidly. Open-source plus managed cloud offerings.</li>
  <li><strong>Apache Pinot</strong>: Real-time OLAP system. Used at LinkedIn, Uber, others. Strong for user-facing analytics dashboards that need sub-second response times.</li>
  <li><strong>Apache Druid</strong>: Similar category to Pinot. Slightly older.</li>
  <li><strong>Apache Kafka (as a queryable store via ksqlDB)</strong>: Kafka itself isn't a database, but with stream-processing engines you can query topics as if they were tables.</li>
  <li><strong>DynamoDB</strong>: AWS's managed NoSQL. Used for high-throughput key-value workloads. Common as a feature store for ML inference.</li>
</ul>

<p>The pattern from Day 3: data flows from Kafka → stream processor → real-time store, bypassing the warehouse. Real-time stores are smaller, more expensive per GB, and serve specific live-query workloads.</p>

<hr>

<h2><span class="num">Part Five</span>Transformation: making data useful</h2>

<p>The category that consumes the most DE engineering time, by far.</p>

<h3>Sub-category A: dbt (the dominant transformation framework)</h3>

<p>We've mentioned dbt repeatedly. It is, by some measures, the most-cited tool in DE job postings after Python and SQL. Phase 10 covers it in depth.</p>

<p>Key things to understand at orientation level:</p>

<ul>
  <li><strong>dbt is a SQL framework, not a compute engine.</strong> It generates SQL and sends it to your warehouse. The warehouse does the work.</li>
  <li><strong>dbt's value is software-engineering discipline applied to SQL.</strong> Version control, testing, documentation, dependency management, modular code.</li>
  <li><strong>Two flavors:</strong> dbt Core (open-source, you run it) and dbt Cloud (managed SaaS by dbt Labs). Most learners start with dbt Core.</li>
  <li><strong>dbt is opinionated.</strong> It enforces patterns (sources, staging, marts) that work well at scale. Following the patterns is recommended.</li>
</ul>

<p>If you're going to learn one transformation tool deeply, learn dbt. It's the most transferable skill in this category.</p>

<h3>Sub-category B: Spark / PySpark</h3>

<p>For transformations that don't fit well in SQL: large-scale batch processing, ML feature engineering, complex Python logic operating on distributed datasets.</p>

<ul>
  <li><strong>Apache Spark</strong>: Distributed compute framework. Originally Scala-first, now PySpark (Python API) dominates.</li>
  <li><strong>Databricks</strong>: Managed Spark platform plus the Databricks SQL warehouse. Often used for both transformation and warehouse.</li>
  <li><strong>AWS EMR</strong>: AWS-managed Hadoop/Spark clusters. Cost-effective for long-running batch jobs.</li>
  <li><strong>AWS Glue</strong>: Serverless Spark. Cheap for moderate workloads, more expensive per hour but no idle time billed.</li>
  <li><strong>Google Dataproc</strong>: GCP's managed Spark/Hadoop.</li>
</ul>

<p>Phase 7 covers PySpark.</p>

<h3>Sub-category C: Stream processing</h3>

<p>For transformations on streaming data: windowed aggregations, stateful processing, real-time joins.</p>

<ul>
  <li><strong>Apache Flink</strong>: The dominant stream processor. True streaming semantics. Used heavily at companies with serious real-time needs (Uber, Netflix, large fintech). Phase 12 covers it.</li>
  <li><strong>Apache Spark Structured Streaming</strong>: Streaming via micro-batches. Easier mental model for teams already using Spark. Less performant than Flink for true streaming workloads.</li>
  <li><strong>Apache Beam</strong>: A unified API for batch and stream. Implementations run on Flink, Spark, Google Dataflow. Most common in Google ecosystem.</li>
  <li><strong>Kafka Streams</strong>: A Kafka-native stream processing library. Java/Scala primarily. Tightly coupled to Kafka.</li>
  <li><strong>ksqlDB</strong>: SQL on top of Kafka Streams. Less popular but exists.</li>
</ul>

<hr>

<h2><span class="num">Part Six</span>Orchestration: coordinating the chaos</h2>

<p>None of the above runs by itself. Someone has to schedule jobs, manage dependencies, retry failures, alert humans. That's orchestration.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: Orchestration

The category of tools that schedule and coordinate
data pipeline tasks. An orchestrator handles:

  - WHEN tasks run (schedules, triggers)
  - WHAT ORDER tasks run in (dependencies)
  - WHAT HAPPENS WHEN A TASK FAILS (retries, alerting,
    backfills)
  - VISIBILITY into pipeline state (UI, logs, metrics)

The unit of work in most orchestrators is a "DAG"
(Directed Acyclic Graph) - a graph of tasks where
each task depends on others, and dependencies have a
direction (no cycles).

Without orchestration, you'd have a thousand cron
jobs that nobody can reason about. Orchestration
makes the whole pipeline a coherent system.
────────────────────────────────────────────────</div>

<p><strong>The dominant tools:</strong></p>

<ul>
  <li><strong>Apache Airflow</strong>: The market leader by a huge margin. Originally built at Airbnb. Open-source. Has issues (scheduling reliability, UI quirks), but ecosystem dominance keeps it on top. Most companies you'll work at use Airflow. Phase 11 covers it.</li>
  <li><strong>Dagster</strong>: Modern alternative to Airflow. Better software-engineering ergonomics, type-checked assets model. Growing fast. Common at companies that started fresh in 2021+.</li>
  <li><strong>Prefect</strong>: Another modern alternative. "Workflows as Python code, with cloud-managed scheduling." More opinionated than Airflow.</li>
  <li><strong>Mage</strong>: Notebook-style orchestration. Lower learning curve. Common at smaller teams.</li>
  <li><strong>Argo Workflows</strong>: Kubernetes-native. Used at companies running heavy K8s infrastructure.</li>
  <li><strong>Temporal</strong>: Workflow orchestration framework, more general-purpose than data-specific. Used for both data and application workflows.</li>
  <li><strong>AWS Step Functions</strong>: AWS's managed workflow service. Used when teams want AWS-managed everything.</li>
  <li><strong>Cloud Composer</strong>: Google's managed Airflow.</li>
  <li><strong>MWAA</strong>: AWS's managed Airflow.</li>
</ul>

<p>For job-search purposes, learn Airflow first. The concepts transfer to the others, and Airflow's market share means you'll encounter it everywhere.</p>

<hr>

<h2><span class="num">Part Seven</span>Serving: getting data to humans and systems</h2>

<p>The last stage of the lifecycle. Multiple sub-categories because consumers come in many shapes.</p>

<h3>Sub-category A: BI tools (the "what happened" consumers)</h3>

<ul>
  <li><strong>Looker</strong>: Now part of Google Cloud. Strong semantic layer (LookML) for centralizing metric definitions. Used heavily in mid-to-large companies.</li>
  <li><strong>Tableau</strong>: The longest-running BI tool. Strong visualization capabilities, weaker on engineering discipline. Common at enterprises.</li>
  <li><strong>Power BI</strong>: Microsoft's BI tool. Dominant in Microsoft-centric organizations. Increasingly competitive with Tableau.</li>
  <li><strong>Metabase</strong>: Open-source BI tool. Free tier widely used at startups. Simpler than Looker, easier setup.</li>
  <li><strong>Apache Superset</strong>: Open-source BI tool, originally from Airbnb. Used by teams wanting full control without licensing costs.</li>
  <li><strong>Hex</strong>: Notebook-meets-BI. Strong for exploration and shared analysis.</li>
  <li><strong>Mode</strong>: Analyst-focused BI tool. Strong SQL editor plus visualization.</li>
  <li><strong>Sigma Computing</strong>: Spreadsheet-style BI on top of warehouses. Growing rapidly.</li>
  <li><strong>Preset</strong>: Managed Superset.</li>
  <li><strong>Lightdash</strong>: Open-source BI tool tightly integrated with dbt.</li>
</ul>

<p>In the Indian market, Tableau and Power BI dominate at enterprises. Looker is common at product companies. Metabase is everywhere at startups.</p>

<h3>Sub-category B: Reverse ETL ("what should we do" consumers)</h3>

<p>Push warehouse data back into operational tools so business users can act on it.</p>

<ul>
  <li><strong>Hightouch</strong>: Market leader. Pushes warehouse data to Salesforce, Marketo, HubSpot, Braze, etc.</li>
  <li><strong>Census</strong>: Direct competitor to Hightouch. Similar feature set.</li>
  <li><strong>Polytomic</strong>: Smaller player.</li>
  <li><strong>RudderStack</strong>: Originally a customer data platform; now offers reverse ETL too.</li>
</ul>

<p>Reverse ETL is a smaller market than ingestion but growing fast. Worth recognizing.</p>

<h3>Sub-category C: Feature stores ("what will happen" consumers)</h3>

<p>Storage and serving infrastructure for ML features. Phase 12 touches on this.</p>

<ul>
  <li><strong>Feast</strong>: Open-source feature store. Used by many teams as a baseline.</li>
  <li><strong>Tecton</strong>: Managed feature store. Co-founded by Feast's creators. Used at companies with serious online ML.</li>
  <li><strong>AWS SageMaker Feature Store</strong>: AWS's offering.</li>
  <li><strong>Databricks Feature Store</strong>: Tightly integrated with Databricks.</li>
  <li><strong>Hopsworks</strong>: Open-source feature store with strong ML platform integration.</li>
</ul>

<h3>Sub-category D: Direct APIs (custom-built data services)</h3>

<p>Sometimes the right answer is to build a custom HTTP service that exposes specific data to specific consumers. Used when no off-the-shelf tool fits.</p>

<p>Tools: FastAPI (Python), gRPC services, GraphQL APIs over Hasura or similar. You build these in Phase 6 (Python).</p>

<hr>

<h2><span class="num">Part Eight</span>Cross-cutting categories</h2>

<p>Tools that don't belong to one stage of the lifecycle but support the whole stack.</p>

<h3>Quality & observability</h3>

<p>Tools for catching bad data and monitoring pipeline health.</p>

<ul>
  <li><strong>dbt tests</strong>: Built into dbt. Most teams' first line of data quality testing.</li>
  <li><strong>Great Expectations</strong>: Standalone data validation framework. More expressive than dbt tests for complex assertions.</li>
  <li><strong>Soda</strong>: Data quality platform with both open-source library (Soda Core) and managed cloud.</li>
  <li><strong>Monte Carlo</strong>: Data observability platform. Anomaly detection, lineage, alerting. Used at larger companies with mature data practices.</li>
  <li><strong>Datafold</strong>: Data diff tools and CI for dbt projects.</li>
  <li><strong>Bigeye</strong>: Data quality monitoring platform.</li>
  <li><strong>Anomalo</strong>: Automated data anomaly detection.</li>
</ul>

<p>Phase 13 covers data quality and observability deeply.</p>

<h3>Cataloging & governance</h3>

<p>Tools that catalog all your data assets and manage who can use what.</p>

<ul>
  <li><strong>DataHub</strong>: Open-source data catalog, originally from LinkedIn. Growing community.</li>
  <li><strong>Apache Atlas</strong>: Hadoop-era catalog, still used at some enterprises.</li>
  <li><strong>Atlan</strong>: Modern data catalog SaaS. Strong UI.</li>
  <li><strong>Collibra</strong>: Enterprise governance platform. Used at large regulated companies.</li>
  <li><strong>Alation</strong>: Another enterprise catalog player.</li>
  <li><strong>Unity Catalog</strong>: Databricks's native catalog.</li>
  <li><strong>dbt docs</strong>: Auto-generated documentation from dbt projects. The poor team's catalog. Often sufficient.</li>
</ul>

<h3>Notebooks and experimentation</h3>

<p>Where analysts and DSes do exploration.</p>

<ul>
  <li><strong>Jupyter</strong>: The original. Still everywhere, especially for individual exploration.</li>
  <li><strong>Hex</strong>: Cloud notebooks with strong collaboration features.</li>
  <li><strong>Deepnote</strong>: Similar to Hex.</li>
  <li><strong>Mode</strong>: Analyst-focused notebook plus BI.</li>
  <li><strong>Databricks Notebooks</strong>: In the Databricks ecosystem.</li>
</ul>

<h3>Infrastructure foundations (under everything)</h3>

<p>The platform layer the modern stack runs on.</p>

<ul>
  <li><strong>AWS, GCP, Azure</strong>: Cloud providers. Most of the stack runs on one of these.</li>
  <li><strong>Docker</strong>: Containers. We cover this in Phase 5. Almost every modern data tool runs in containers.</li>
  <li><strong>Kubernetes</strong>: Container orchestration platform. Increasingly the substrate for everything else. Phase 13 covers literacy-level K8s for DEs.</li>
  <li><strong>Terraform</strong>: Infrastructure as code. We provision AWS resources with it in Phase 8.</li>
  <li><strong>GitHub Actions / GitLab CI / Jenkins</strong>: CI/CD systems. Phase 13.</li>
  <li><strong>Git / GitHub / GitLab / Bitbucket</strong>: Version control. Phase 1.</li>
</ul>

<hr>

<h2><span class="num">Part Nine</span>Three concrete stacks you'll encounter</h2>

<p>Tools in the abstract are confusing. Let me show you three complete real-world stacks. Memorize the shape; the names you can look up.</p>

<h3>Stack 1: The "Snowflake + dbt" canonical modern stack</h3>

<p>Common at well-funded product companies and mid-to-large enterprises.</p>

<div class="board">SOURCES:
  - Postgres (operational app)
  - Salesforce, Stripe, Google Ads (SaaS)
  - Mobile/web events via Segment → Kafka

INGESTION:
  - Fivetran for SaaS sources (Salesforce, Stripe, Ads)
  - Custom Python for niche APIs
  - Debezium → Kafka → Snowflake for Postgres CDC
  - Kafka → S3 → Snowflake for event streams

STORAGE:
  - S3 for raw landing zone
  - Snowflake as warehouse
  - Redis for real-time dashboard cache

TRANSFORMATION:
  - dbt Cloud (or dbt Core in GitHub Actions)
  - Snowflake compute does the actual SQL execution

ORCHESTRATION:
  - Airflow on MWAA (managed AWS)
  - dbt Cloud orchestrates dbt model runs

SERVING:
  - Looker for executives & analysts
  - Hightouch for reverse ETL to Salesforce/Marketo
  - Custom FastAPI services for product-facing data

OBSERVABILITY:
  - dbt tests + Monte Carlo
  - Datadog for infrastructure
  - DataHub for cataloging

INFRASTRUCTURE:
  - AWS as cloud
  - Terraform for IaC
  - Docker + ECS for custom services
  - GitHub Actions for CI/CD</div>

<p>This is what most "modern data stack" articles describe. Snowflake + dbt is the most-deployed combination for new builds in 2024-2025.</p>

<h3>Stack 2: The "Databricks lakehouse" stack</h3>

<p>Common at ML-heavy companies and companies coming from a Spark/Hadoop heritage.</p>

<div class="board">SOURCES:
  Same as Stack 1

INGESTION:
  - Fivetran or Airbyte for SaaS
  - Auto Loader (Databricks-native) for files in S3
  - Debezium → Kafka → Auto Loader for CDC
  - Kafka → Spark Structured Streaming for events

STORAGE:
  - S3 with Delta Lake tables (lakehouse)
  - Databricks SQL as warehouse layer (queries Delta)
  - Redis for real-time

TRANSFORMATION:
  - dbt-databricks for SQL transformations
  - PySpark notebooks for ML feature engineering
  - Spark Structured Streaming for stream processing

ORCHESTRATION:
  - Databricks Workflows (native)
  - or Airflow calling Databricks jobs

SERVING:
  - Databricks SQL dashboards
  - PowerBI (Microsoft ecosystem common here)
  - Databricks Feature Store for ML
  - Custom services for product-facing

OBSERVABILITY:
  - Databricks built-in monitoring
  - Lakehouse Monitoring
  - Unity Catalog for governance

INFRASTRUCTURE:
  - AWS or Azure
  - Terraform with databricks-provider
  - Databricks-managed compute</div>

<p>Databricks is especially strong at companies where ML and data engineering teams overlap.</p>

<h3>Stack 3: The "GCP-native + BigQuery" stack</h3>

<p>Common at companies that built primarily on Google Cloud, or that started with Google Analytics and Firebase.</p>

<div class="board">SOURCES:
  - Cloud SQL (managed Postgres on GCP)
  - SaaS sources
  - Firebase events (Firebase → BigQuery direct export)
  - GA4 (direct export to BigQuery)

INGESTION:
  - Fivetran or Airbyte for SaaS
  - Datastream (GCP-managed CDC) for databases
  - Pub/Sub → Dataflow → BigQuery for events

STORAGE:
  - GCS for raw landing

<ul>

<p>I'm not exaggerating. Days 1 through 8 built the mental model: what data engineering is, who does what, how data moves, what tools exist. Today we put that model to work on something practical: <em>reading job postings</em>.</p>

<h2><span class="num">Part One</span>Why job postings are written the way they are</h2>

<p>Before we decode our first posting, you need to understand something about how job postings get written. This will save you a lot of needless panic.</p>

<p>Job postings are written by a chain of three or four people, none of whom are the hiring manager whose vision is most important:</p>

<ol>
  <li><strong>The hiring manager</strong> writes a rough description of what they want.</li>
  <li><strong>A recruiter or HR person</strong> formats it, adds boilerplate, adds keywords for search-engine optimization.</li>
  <li><strong>Someone in TA (Talent Acquisition)</strong> adds more keywords because "we need filters to narrow the applicant pool."</li>
  <li><strong>Legal or compliance</strong> adds standard disclaimers.</li>
</ol>

<p>By the time you read it, the description has <em>everything the team might possibly want</em>, in vague proportions, with no signal about what actually matters. The "5+ years of Snowflake experience" line might mean the hiring manager really needs Snowflake, or it might mean someone copy-pasted from another posting and never edited.</p>

<p>The fundamental dynamic to understand:</p>

<p class="pull">Job postings list everything the team might want. Job interviews test what the team actually needs. The skill is reading the posting and inferring what's signal vs noise.</p>

<h3>The 60% rule</h3>

<p>There's a well-known pattern in tech hiring (especially for engineering roles): <strong>candidates who meet ~60% of the listed requirements often get the job.</strong> Companies list aspirational requirements, hire on potential.</p>

<p>For DE roles in India specifically:</p>

<ul>
  <li>If the posting lists 10 technical skills, you probably need to be <em>strong</em> in 4 of them and <em>familiar</em> with the rest.</li>
  <li>Years of experience requirements are negotiable. "3-5 years" often means "we'd accept 2 years if the candidate is impressive."</li>
  <li>Specific tool requirements are softer than they look. A posting requiring Snowflake will often hire someone strong in BigQuery if they're otherwise excellent.</li>
</ul>

<p>The risk is not "applying when underqualified." The risk is <em>not applying when you're actually a reasonable fit</em>. Today's lab teaches you to recognize the difference.</p>

<hr>

<h2><span class="num">Part Two</span>The decoding method</h2>

<p>I'm going to give you a five-step method for decoding any DE posting. We'll apply it to three real postings in the next sections.</p>

<h3>Step 1: Identify the company archetype</h3>

<p>From Day 8 you know the four main archetypes in the Indian market: service companies, Indian product companies, GCCs of global product companies, and startups. The kind of company tells you a lot:</p>

<ul>
  <li><strong>Service company:</strong> work depends on client engagement. Stack is whatever the client uses. Often mixed legacy + modern. Compensation ₹4-15 LPA junior, ₹15-30 LPA mid.</li>
  <li><strong>Indian product company:</strong> single team, single modern stack. Compensation ₹10-25 LPA junior, ₹25-60 LPA mid.</li>
  <li><strong>GCC:</strong> parent company's stack (often US-based). Higher compensation. ₹15-40 LPA junior, ₹40-80+ LPA mid.</li>
  <li><strong>Startup:</strong> small team, broader scope per person, often modern but with rougher edges. Compensation ₹6-20 LPA junior, equity component varies wildly.</li>
</ul>

<p>Signals in the posting that tell you the archetype:</p>

<ul>
  <li>Company name (obvious, but recognize it)</li>
  <li>Office locations (Mumbai/Bangalore/Pune-only often = product company or GCC; "PAN India" = service company)</li>
  <li>Client mentions ("you'll work with our client's data infrastructure" = service company)</li>
  <li>Team size mentioned ("you'll be our 3rd data engineer" = startup)</li>
  <li>Specific products mentioned ("our payments platform processes 10M transactions/day" = product company)</li>
</ul>

<h3>Step 2: Categorize every listed tool</h3>

<p>Take the list of technical requirements and place each item into a category from Day 8's map. You should be able to do this in under 30 seconds per posting after enough practice.</p>

<p>Categories:</p>

<ul>
  <li>Language/foundation: Python, SQL, Bash, Java, Scala</li>
  <li>Cloud: AWS, GCP, Azure</li>
  <li>Warehouse: Snowflake, BigQuery, Redshift, Databricks SQL</li>
  <li>Transformation: dbt, Spark, PySpark</li>
  <li>Orchestration: Airflow, Dagster, Prefect</li>
  <li>Streaming: Kafka, Kinesis, Flink, Spark Streaming</li>
  <li>Ingestion: Fivetran, Airbyte, Debezium</li>
  <li>Real-time stores: Redis, ClickHouse, Pinot</li>
  <li>BI: Looker, Tableau, Power BI, Metabase</li>
  <li>Infrastructure: Docker, Kubernetes, Terraform, GitHub Actions</li>
  <li>Legacy: Informatica, DataStage, Talend, Hadoop, Hive</li>
  <li>Data quality: Great Expectations, Soda, Monte Carlo</li>
  <li>Cataloging: DataHub, Atlan, Collibra</li>
</ul>

<h3>Step 3: Classify importance, must-have vs nice-to-have</h3>

<p>Postings rarely label requirements properly. You have to infer importance from the structure:</p>

<ul>
  <li><strong>Listed first / repeated multiple times</strong> = probably important</li>
  <li><strong>Listed in "Must Have" or "Required" section</strong> = important (but check if "Must Have" is actually 15 items long, then less reliable)</li>
  <li><strong>Listed in "Good to Have," "Preferred," "Bonus"</strong> = nice-to-have</li>
  <li><strong>Mentioned in the role description (not the bullets)</strong> = important: these are the things the hiring manager actually wrote</li>
  <li><strong>Generic tools (Python, SQL, AWS)</strong> = baseline, you need them even if they're not emphasized</li>
  <li><strong>Buried in a long list with no detail</strong> = recruiter padding, often noise</li>
</ul>

<h3>Step 4: Recognize the stack archetype</h3>

<p>From Day 8 you know the three common stack archetypes. Most postings fit one of them:</p>

<ul>
  <li><strong>Snowflake + dbt canonical</strong>: Snowflake, dbt, Airflow, AWS, Python, Fivetran</li>
  <li><strong>Databricks lakehouse</strong>: Databricks, Delta Lake, Spark, MLflow, dbt, AWS or Azure</li>
  <li><strong>GCP-native</strong>: BigQuery, dbt, Dataflow, Pub/Sub, Looker, GCP services</li>
  <li><strong>Legacy enterprise</strong>: Informatica, Teradata, Oracle, plus some new tools being introduced</li>
  <li><strong>Hybrid / migration</strong>: listing both legacy and modern, suggesting active migration</li>
</ul>

<p>The archetype tells you what kind of work you'll actually do day-to-day.</p>

<h3>Step 5: Assess your fit honestly</h3>

<p>Now the hardest step: looking at the posting against your current skill state, and deciding whether to apply.</p>

<p>The honest framework:</p>

<ul>
  <li><strong>If you're strong in the must-haves and familiar with the nice-to-haves:</strong> apply.</li>
  <li><strong>If you're strong in the must-haves but weak on a few nice-to-haves:</strong> apply, address gaps in cover letter.</li>
  <li><strong>If you're familiar with the must-haves but not strong:</strong> apply if the role is junior-level; learn before applying if it's senior.</li>
  <li><strong>If you're missing key must-haves entirely:</strong> learn first, then apply.</li>
</ul>

<p>The most common mistake: <em>thinking you need 100% match.</em> You don't. The second most common mistake: <em>applying to senior roles when you're junior</em>. Job titles matter: match them.</p>

<h2><span class="num">Part One</span>What you can now do</h2>

<p>Take a breath and look back at Day 1. You started not knowing what OLTP and OLAP were. You started without vocabulary for the four stages of a data lifecycle. You started not knowing what a trust boundary was or why it mattered. You started reading job descriptions as confusing walls of tool names.</p>

<p>Two weeks later, you can do all of the following: concretely, not vaguely.</p>

<p><strong>You can sketch a data architecture from memory.</strong> Sources on the left, ingestion, raw storage, trust boundary, warehouse, transformation, multiple consumer paths on the right. The shape from Day 4's lab. You don't need a textbook open.</p>

<p><strong>You can identify, in any architecture you encounter, the trust boundary.</strong> The place where data goes from "we accept whatever came" to "we've verified this is what we expected." You know that schema enforcement happens because someone configured it to, not because the warehouse magically protects you.</p>

<p><strong>You can name the four roles on a data team and explain what each one owns.</strong> DE owns infrastructure and reliability. DA owns interpretation and reporting. DS owns models. MLE owns serving the models. You can describe what breaks when the boundaries blur.</p>

<p><strong>You can explain why a company can't just use one Postgres database for everything.</strong> Two sentences. To a non-technical friend. Without using the words OLTP or OLAP.</p>

<p><strong>You can trace one event through a complete data lifecycle.</strong> Mobile app tap → Kafka event → consumer writes to S3 → batch pipeline loads to Snowflake → dbt transforms → analyst's dashboard reads from warehouse. You know which steps happen in real-time, which in batch, and why.</p>

<p><strong>You can argue the difference between ETL and ELT, and explain why ELT won.</strong> Two infrastructure shifts. Cheap object storage. Elastic warehouse compute. You can name what changed and why the shift was economic, not aesthetic. You can also explain where ETL still lives and why it's not dead.</p>

<p><strong>You can use the three vocabulary items every interview tests.</strong> Idempotency, not just as a definition but as a property you'd engineer into a pipeline. SLAs, with the four required components and the SLI/SLO/SLA distinction. CAP, with concrete CP vs AP examples and a clean answer to a system-design interview question.</p>

<p><strong>You can read any job description and decode it systematically.</strong> Company archetype, tool categorization, must-have vs nice-to-have, stack archetype, your honest fit. The five-step method from yesterday.</p>

<p><strong>You can recognize 40+ tools in the modern data stack by category.</strong> Not deep mastery of any single one yet: that's what the next 32 weeks are for. But you can place every tool you encounter into a category and understand what role it plays.</p>

<p><strong>You can identify the stack archetype of any company by reading their job posting or engineering blog.</strong> Snowflake + dbt canonical. Databricks lakehouse. GCP-native. Legacy migration. Each archetype tells you what the work actually involves, not just what tool names appear.</p>

<p><strong>You can hold a conversation about tradeoffs with a senior engineer.</strong> "We chose Redis over the warehouse for the live dashboard because the 60-second freshness requirement is incompatible with warehouse query latency." That's not a beginner sentence. You can say it now and mean it.</p>

<p><strong>You can read a vendor's SLA and identify the loopholes.</strong> Scheduled maintenance exclusions. Measurement scope. Burden of proof on the customer. What looks like a strong commitment often isn't.</p>

<p>None of these are senior-engineer capabilities. All of them are more than 80% of people on the internet who claim to be learning data engineering can actually do. You're past the starting line. Most people never cross it.</p>

<h2><span class="num">Part Two</span>The Phase 0 self-test</h2>

<p>Five questions. Harder than the Day 5 self-test because each one requires you to use multiple days of material together. Same instructions as before: write your answers down on paper, not for me, for yourself. Read what you wrote and judge honestly whether a senior engineer reading your answer would conclude "this person understands" or "this person memorized vocabulary."</p>

<p><strong>1. A startup CEO tells you: "We have everything we need in Postgres. Why do we need to build a separate data warehouse? Just give analysts read access to production."</strong> Walk through your response. You should be using Day 1 (OLTP vs OLAP), Day 3 (storage layers), Day 6 (ETL vs ELT), and Day 8 (modern stack categories).</p>

<p><em>What separates surface understanding from real understanding:</em> a surface answer says "OLTP and OLAP are different" and stops. A real answer explains the operational pain (production performance), the engineering reasons (different query patterns optimized differently), and the architectural reasons (separation enables ELT, raw retention, and multiple consumer types). You should be able to land the response in about 90 seconds without rushing.</p>

<p><strong>2. You're given a Tahini-style data architecture diagram with a "Snowflake warehouse" box. Someone has not drawn a trust boundary anywhere. What questions do you ask, and what do you change about the design?</strong></p>

<p><em>What you should hit:</em> Where does schema validation happen? What happens to malformed records (crash, drop, quarantine)? Who owns the validation step? What monitoring exists on validation failures? This is integrating Day 3 (trust boundary mechanics) with Day 2 (ownership) and Day 7 (SLA implications).</p>

<p><strong>3. A team proposes ingesting customer events from a third-party SaaS by polling their REST API every 30 seconds. The volume is 50,000 events per minute. Walk through what's wrong with this design and what you'd propose instead.</strong></p>

<p><em>What you should hit:</em> Polling at 30-second intervals against an API is wasteful and will hit rate limits. 50K events/minute is firmly in streaming territory. You'd ask whether the source supports webhooks (push instead of pull), or whether you can subscribe to their event stream (Kafka, Kinesis) if they offer one. You'd discuss the ingestion quadrants from Day 3: this is being framed as Pull+Streaming but should be Push+Streaming. You'd consider what consumer needs this freshness (and whether 30 seconds is actually fresh enough or 5 minutes would do, in which case batch becomes acceptable).</p>

<p><strong>4. Your team is debating between Snowflake and Databricks for a new build. The company does heavy ML on data. Walk through the considerations.</strong></p>

<p><em>What you should hit:</em> Stack archetype thinking from Day 8. Databricks pairs better with serious ML workflows because the Spark engine, notebook environment, and feature store are tightly integrated. Snowflake is stronger at pure analytical SQL workloads and has a more mature ecosystem for dbt + BI. The decision is partly about what kind of work dominates, if 70% of the team's output is SQL-based analytics for business users, Snowflake. If 70% is ML feature engineering and model training, Databricks. The other 30% can be served either way with some friction. You'd also factor in: existing team skills, cloud preference (Databricks runs anywhere; Snowflake is multi-cloud but historically AWS-strongest), and pricing model differences.</p>

<p><strong>5. The hardest one. Pick any consumer from Lab 4: the CEO email or Lakshmi's live dashboard. Walk through how an SLA for that consumer connects to the CAP choice of the underlying storage, and how idempotency in the pipeline enables that SLA to be met.</strong></p>

<p><em>What you should hit:</em> This is the question that ties Day 7 together. For the CEO email: daily SLA, served from Snowflake (CP system), idempotency enables safe re-runs when batch jobs fail and need to be retried before 8am. For Lakshmi's dashboard: 60-second freshness SLA, served from Redis (AP system) bypassing the warehouse, idempotency in the Kafka consumer means consumer crashes and restarts don't produce wrong counts. Both SLAs are achievable because the underlying storage choices match the latency requirement, and idempotency makes the pipelines safely re-runnable.</p>

<p>If you answered fewer than 2 cleanly: this is information, not a failure. Spend the weekend re-reading Days 1-4 carefully, with the Lab 4 diagram in front of you. The Phase 0 material is the foundation of everything that follows. Entering Phase 1 without it makes Phase 1 harder, not easier.</p>

<h2><span class="num">Part Three</span>Where most learners actually are right now</h2>

<p>I want to give you the honest calibration about where you stand, because curricula often skip this and learners are left guessing.</p>

<p>Most people who start a 39-44 week DE curriculum do not finish Week 2. The dropoff in self-study programs is brutal: by some estimates, 70-80% of learners stop within the first two weeks. Not because they're not capable. Because the material feels overwhelming, life intervenes, and there's no external accountability to keep them going.</p>

<p>If you finished Phase 0 (read all 10 days, did Lab 4, did the Day 9 lab) you are statistically in the minority who continue. <em>That's the only meaningful checkpoint at this stage.</em> Not how confidently you can answer the self-test. Not how clean your Lab 4 diagram was. Just: you kept going.</p>

<p>The next checkpoint is roughly Phase 4 (Linux). The third major dropoff happens around Phase 6 (Python deep dive), when learners realize that real Python for DE is harder than the Python they used for a college project. Past Phase 6, learners who continue mostly finish.</p>

<p>I'm not saying this to threaten you with dropoff statistics. I'm saying it because <strong>the feeling of being overwhelmed is uncorrelated with actually being behind</strong>. Almost every learner feels behind after Phase 0. Almost every one of them is right on schedule. The ones who quit feel exactly the same way as the ones who finish. The difference is what they do with the feeling.</p>

<p>You're going to feel overwhelmed multiple times in this program. Week 8. Week 16. Week 24. The capstone. Each time, you'll be on track, and you'll feel like you're not. <em>Keep going anyway.</em></p>

<h3>What "on track" actually looks like at this point</h3>

<p>For specificity, here's what an honest assessment of an on-track Phase 0 graduate looks like:</p>

<ul>
  <li><strong>Can explain core concepts:</strong> yes, in your own words, without a textbook</li>
  <li><strong>Can use the vocabulary:</strong> yes, in correct contexts, comfortable saying it out loud</li>
  <li><strong>Can apply concepts to new problems:</strong> with some struggle and re-reading, yes</li>
  <li><strong>Can write code:</strong> not yet (Phase 6 starts that, you have basic Python at best)</li>
  <li><strong>Can build production systems:</strong> obviously not yet (months away)</li>
  <li><strong>Can pass an interview:</strong> not yet, but you understand what they're asking now</li>
</ul>

<p>That's a real Phase 0 graduate. Not someone who knows everything. Someone who has the conceptual foundation and the vocabulary, with the practical skills coming over the next 8 months. If that matches roughly how you feel: you're exactly where you should be.</p>

<p>The trap to avoid: comparing yourself to people online who claim deeper knowledge after less time. Most of those claims are either inflated, or built on shallow understanding the speaker doesn't realize is shallow. Your test isn't "do I know as much as this YouTube person claims?" Your test is "can I explain what I know to someone who doesn't know it, without falling back on vocabulary I haven't internalized?" That's the only test that matters.</p>

<h2><span class="num">Part Four</span>Why Phase 1 is Git, and not modeling</h2>

<p>You already heard this from Day 5, but I want to deepen it now that you've seen the modern stack map and decoded job postings.</p>

<p>Yesterday, in every job posting you read, Git was mentioned or assumed. Often it appeared as "Comfort with version control (Git)" or "Familiarity with Git workflows" or "Experience with CI/CD practices." That second-class billing is misleading. Git is not a secondary skill. <strong>It is the work environment.</strong></p>

<p>Here's what I mean. As a DE, almost every piece of code you produce (Python pipelines, dbt models, Airflow DAGs, Terraform configs, SQL transformations) lives in a Git repository. Every change goes through a pull request. Every PR gets reviewed. Every merge triggers CI checks. Every deploy is a Git operation.</p>

<p>If you don't know Git, you cannot:</p>

<ul>
  <li>Make a code change at any company larger than 3 people</li>
  <li>Collaborate with another engineer without overwriting their work</li>
  <li>Review someone else's pull request meaningfully</li>
  <li>Recover from a mistake without losing work</li>
  <li>Understand what changed in production yesterday</li>
  <li>Show your portfolio to a recruiter (GitHub is where DEs are evaluated)</li>
  <li>Participate in CI/CD, which means you can't ship safely</li>
</ul>

<p>None of these are advanced workflows. All of them are baseline. Without Git, you cannot perform the basic motions of the job.</p>

<p>The other reason Git comes first: <strong>you'll use it for every subsequent phase</strong>. Phase 2's modeling work goes in a Git repo. Phase 3's SQL queries go in a Git repo. Phase 6's Python scripts go in a Git repo. By the capstone, you'll have 30+ weeks of work accumulated in your personal repo: branches, commits, tags, releases. That repo becomes a portfolio. It's the artifact you point a recruiter to.</p>

<p>Without Git, your portfolio is a folder of files on your laptop. With Git, your portfolio is a GitHub profile that recruiters can find.</p>

<p>This is why Git comes before modeling. Modeling is a deeper topic. But you can't <em>do</em> modeling work without Git underneath it. The foundation goes first.</p>

<h2><span class="num">Part Five</span>What Phase 1 gives you</h2>

<p>Five days. Concrete capabilities at the end.</p>

<p>By the end of Day 15 (end of Phase 1), you will be able to:</p>

<p><strong>Have your own GitHub repo for the bootcamp.</strong> Public or private: your choice. With a meaningful README. With your work from Days 1-10 already committed in a structured way (Lab 4 diagram, Day 9 decoding notes, your self-test answers). The repo grows with every subsequent phase.</p>

<p><strong>Use branches deliberately.</strong> Not just "main": feature branches for new work, with the discipline to create a branch before touching code. You'll know when to branch, what to name branches, and how to merge them back cleanly.</p>

<p><strong>Open pull requests properly.</strong> The PR is how engineers communicate "I made this change, please review." You'll learn what makes a PR easy to review: small scope, clear description, focused commits, screenshots when relevant. You'll also learn the etiquette of code review: both giving and receiving feedback.</p>

<p><strong>Handle merge conflicts without panicking.</strong> Every engineer who has worked on a team has stared at a conflict marker and felt frozen. You'll learn the mental model (your changes vs incoming changes vs the common ancestor) and the muscle memory to resolve them.</p>

<p><strong>Read a Git history.</strong> When something is broken in production, you'll be able to look at <code>git log</code>, identify what changed recently, and <code>git blame</code> your way to the relevant commit. This is one of the most useful debugging skills in the profession.</p>

<h2><span class="num">10</span>Before you close the laptop</h2>

<p class="stage">*Wipes everything except the $0.00 in the corner. Writes a short list under it, and boxes it.*</p>

<p class="board">BEFORE YOU CLOSE THE LAPTOP
 1. am I looking at the place I launched things in?
 2. any machines still running?           get rid of them
 3. any networking gateways?              delete them
 4. billing page: did anything cost
    money today that I did not expect?</p>

<p>That is your teardown checklist. It is short now. It will grow as you learn new ways to leave things running. Every line is there because of a specific way people get caught.</p>

<p><strong>Line one is the forgotten region.</strong> Almost everything you create lives in one place. Look at a different one and the list is empty, with no warning that you are only seeing one place out of thirty. A tutorial that quietly used Virginia leaves you staring at an empty Mumbai list, convinced you cleaned up, while the machine in Virginia runs. An empty list looks exactly like a clean account. The billing page is the one view that sees everywhere at once, which is why it is line four.</p>

<p><strong>Line three is the one that has no off switch.</strong> In a few days you will build a piece of networking kit that lets private machines reach the internet. It is genuinely useful. It also costs upwards of thirty dollars a month just for existing, it has no "stopped" state, and it does not appear in your list of machines. It is the single most common way people learning AWS lose money. I will show you exactly what it is on the day we build it. Today, just remember that it exists, and that it is on the list.</p>

<p class="stage">*"Almost nothing about controlling cloud cost is clever. It is that list, done every single time."*</p>

<hr>

<p class="stage">*Checks the clock. Goes back to the corner and puts a hand next to the $0.00, which has been there all session.*</p>

<p>A laptop lid closed and a report did not arrive. Everything today came out of that. A computer that is always on, somewhere else. Renting it by the second, because owning one to use one percent of it is waste. Asking for it in code, because you are asleep at two. A file that has to outlive every machine, so storage lives on its own. Fifty machines for twenty minutes costing the same as one for seventeen hours, which only works because of that. The same meter running all night when you forget. How much of the work you hand over, and what it costs you in money and in attention. And a front door that is changing under our feet, with an alarm on one side and an off switch on the other.</p>

<p class="stage">*picks up the chalk and adds one line under the zero: "and it stays there."*</p>

<p class="stage">*at the door.*</p>

<p>One more thing.</p>

<p>The last thing I asked you to do was pick a place name and not think about it. Some of you will have assumed that means it does not matter much.</p>

<p class="stage">*half turns back.*</p>

<p>It is the opposite. I refused to explain it at the end of a long session because it deserves better than being the last item on a tired afternoon. So think about it overnight instead. You chose a place. Something is physically somewhere now.</p>

<p class="stage">*"What do you actually think you picked?"*</p>

<p class="stage">*"Guardrails first, then infrastructure. That order is not negotiable. Go and open your account."*</p>
