<h2><span class="num">Part Four</span>Why ELT won: the real reasons</h2>

<p>I want to be specific about why ELT replaced ETL, because "it's better" is not a reason. It's a slogan. Let me list the actual reasons, with the economics and engineering specifics behind each.</p>

<h3>Reason 1: cheaper storage means raw data is no longer a liability</h3>

<p>In ETL, raw data was a problem. It cost money to store and you didn't have permanent space for it, so you transformed it down to summaries and discarded the rest. Six months later, when the business asked "can we look at this differently?": the answer was often "no, we don't have the underlying data anymore."</p>

<p>In ELT, raw data is just a file in S3 costing ₹0.10-2 per GB per month. You keep everything. When the business asks for a new view, you can recompute from raw. The cost of "what if we need it later" went from "expensive enough to discard" to "expensive enough to think about, not enough to lose sleep over."</p>

<p>This single change unlocked enormous flexibility downstream.</p>

<h3>Reason 2: elastic compute makes warehouse-side transformation cheap</h3>

<p>In ETL, the warehouse was a fixed resource. Adding transformation load to it would have hurt query performance and required buying bigger hardware. So transformation happened on a separate machine.</p>

<p>In ELT, the warehouse is rented by the second. You spin up a dedicated transformation cluster, run dbt, shut it down. Total cost for an hour of transformation: ₹100-500 depending on cluster size. No upfront hardware purchase. No idle time billed. <em>Pay only when transformation is actually happening.</em></p>

<p>For comparison: in 2010 ETL economics, equivalent transformation work might consume ₹500,000+ of dedicated hardware that you owned 24/7 even when idle.</p>

<h3>Reason 3: SQL as the transformation language</h3>

<p>This one is bigger than people realize.</p>

<p>ETL transformations were written in: Informatica's visual designer (PowerCenter Designer), DataStage's parallel job designer, custom Python or Java, scripting languages specific to each tool. Each tool had its own paradigm. An Informatica developer wasn't necessarily good at DataStage. A custom-Python team had no tool support for visualizing dependencies.</p>

<p>ELT transformations are written in SQL. <em>Just SQL.</em></p>

<p>Why does that matter?</p>

<ul>
  <li><strong>Bigger talent pool.</strong> Every analyst already knows SQL. They can contribute to transformations without learning a new tool. The work redistributes naturally.</li>
  <li><strong>Better tooling.</strong> SQL has 50 years of tools: formatters, linters, syntax highlighting, IDEs. ETL tools had vendor-specific toolchains that were often poor.</li>
  <li><strong>Better governance.</strong> SQL files are text. They go in Git. You can diff them, review them in pull requests, track who changed what. ETL tool configurations were often binary or XML blobs that resisted standard engineering workflows.</li>
  <li><strong>Better testing.</strong> dbt has a test framework. ETL tools had primitive or no testing.</li>
</ul>

<p>SQL as the transformation language is the lever that lets analysts, analytics engineers, and DEs collaborate on the same codebase. That collaboration didn't exist in the ETL world; the ETL tool was its own walled garden.</p>

<h3>Reason 4: time-to-change collapsed</h3>

<p>I mentioned this in the opening. In ETL, a new metric took 2-3 weeks. In ELT, a new metric takes 2-3 days. Why?</p>

<ul>
  <li>The change is one SQL file. Not a GUI workflow modification.</li>
  <li>The change is a Git commit. Reviewed in a pull request. Standard developer workflow.</li>
  <li>The change is deployed by <code>dbt run</code> rather than a deploy-and-test cycle on dedicated hardware.</li>
  <li>The change costs nothing to run: you're already paying for warehouse compute per query.</li>
</ul>

<p>Time-to-change is one of the most underrated metrics in data engineering. A 10x reduction in time-to-change means the data team can answer 10x as many business questions in the same time. Which means analysts ask more questions. Which means the business gets more value from data. Which means the data team becomes more important to the business. <em>The economics of the entire role shifted.</em></p>

<h3>Reason 5: operational simplicity</h3>

<p>An ETL stack required maintaining: an ETL tool (license, upgrades, version migrations), the ETL server hardware, the connections from ETL server to sources and destination, the schedule of jobs, the error handling. When something broke, you had multiple layers to investigate.</p>

<p>An ELT stack requires maintaining: a Git repo of SQL files, an orchestrator (Airflow or similar), the warehouse credentials. When something breaks, the failure is almost always in one of two places: the orchestrator or the SQL itself. Both are easy to inspect.</p>

<p>Fewer moving parts. Fewer failure modes. Less operational burden. <em>Smaller teams can run larger pipelines.</em></p>

<h3>Reason 6: ML and analytics workflows benefit</h3>

<p>Modern data teams don't just produce reports. They train models, build feature pipelines, serve recommendations, run experiments. All of those benefit from having raw, queryable data in the warehouse.</p>

<p>In ETL, the warehouse only had summary tables. A data scientist who wanted to train a model on raw transactions had to go ask the data team for a one-off extract. That request took days.</p>

<p>In ELT, the warehouse has both raw and curated tables. A data scientist can write a SELECT against raw transactions whenever they need. The friction is gone. Which means data scientists ship more, faster.</p>

<hr>

<h2><span class="num">Part Five</span>Where ETL still lives, and why</h2>

<p>If ELT is so much better, why does ETL still exist? It does, in real volume. Let me give you the honest picture.</p>

<h3>1. Regulated industries with strict data minimization</h3>

<p>Some industries (finance, healthcare, government) have legal requirements that <em>raw data not be persisted</em> beyond what's necessary. PII (personally identifiable information) must be masked, tokenized, or aggregated before it lands in any analytical store.</p>

<p>In these cases, ETL is the right answer. The "transform before load" property is what protects you from accidentally storing data you're not allowed to keep. ELT's "load first, transform later" exposes raw data to the warehouse, which may violate compliance requirements.</p>

<p>Banks doing fraud analytics on cardholder data. Hospitals analyzing patient records. Insurance companies processing claims. These often use ETL or hybrid patterns that transform sensitive data upstream.</p>

<h3>2. High-frequency real-time pipelines</h3>

<p>The warehouse-based ELT model assumes you can wait for the warehouse to load and transform. For most analytics, you can. But for some real-time use cases (fraud scoring, dynamic pricing, recommendation refresh) you can't.</p>

<p>In these cases, you transform data <em>in the streaming pipeline</em>, before it ever reaches the warehouse. The transformation happens in Flink or Spark Streaming. The result lands in a real-time store (Redis, ClickHouse) or in the warehouse for later analytics.</p>

<p>This is technically ETL (transform happens before load), but it's a very different kind of ETL from the 2010 Informatica era. It's stream-native, code-driven, and lives alongside the ELT warehouse rather than replacing it.</p>

<h3>3. Legacy enterprise systems</h3>

<p>Many large Indian enterprises (banks, insurers, government departments, large manufacturers) have decades of Informatica, DataStage, or custom Java ETL pipelines. These pipelines work. They produce reports the business depends on. Migrating them to ELT is a multi-year project costing crores of rupees.</p>

<p>Most of these companies are migrating: slowly. They build new pipelines in ELT (typically Snowflake + dbt or Databricks). They maintain old pipelines in ETL. Over a decade or two, the legacy systems get retired.</p>

<p>This is why ETL jobs still appear in TCS/Infosys/Wipro postings: their clients (those large enterprises) still have ETL systems that need maintenance and gradual migration. The work is real and well-paid. It's also declining in market share.</p>

<h3>4. Specific transformation-heavy workloads</h3>

<p>For some pipelines (particularly those with very complex transformation logic that doesn't translate well to SQL) Python-based ETL on a dedicated cluster (Spark on EMR, for example) can still be the better answer. The transformations happen outside the warehouse because expressing them in SQL would be torturous.</p>

<p>This is more rare than people think (most transformations <em>can</em> be expressed in SQL with sufficient creativity), but it does exist for things like:</p>

<ul>
  <li>Complex natural language processing</li>
  <li>Image or audio processing</li>
  <li>Graph computations</li>
  <li>Statistical or scientific computing with non-relational data</li>
</ul>

<p>For these cases, you might extract from sources, transform in Spark or a custom Python pipeline, and load the results into the warehouse for downstream analytics. The warehouse is the final destination, but the transformation happens outside.</p>

<h3>5. Batch ML feature pipelines</h3>

<p>This one matters and is often missed. Modern ML systems require <em>features</em>: derived attributes computed from raw data, fed into models for training and inference. Examples: "user's average order value over the last 30 days," "user's most-ordered cuisine," "time since user's last order."</p>

<p>Many of these features <em>can</em> be computed in SQL inside the warehouse with dbt. Some can't, or shouldn't:</p>

<ul>
  <li><strong>Features used by online ML models (inference at request time).</strong> The model needs the feature in &lt;100ms when scoring a transaction. The warehouse can't deliver that. You compute the feature in a streaming pipeline (Spark, Flink) and write it to a feature store (Redis, DynamoDB, or a managed feature store).</li>
  <li><strong>Features requiring iterative computation</strong>: graph-based features, recursive lookups, embedding generation. These often run as Python or Spark jobs on dedicated compute, with results landing in either a feature store or the warehouse.</li>
  <li><strong>Features computed alongside model training.</strong> The training pipeline itself often produces transformed features as a side-effect, in a separate ML platform (SageMaker, Databricks, Vertex AI). The "transform" happens during model training, not in the data warehouse.</li>
</ul>

<p>From a learner's perspective: most analytical features will be SQL-in-warehouse (ELT). ML serving features are often pre-computed in batch ETL pipelines outside the warehouse, or in streaming pipelines. The distinction matters when you're designing for a team with serious ML in production.</p>

<h3>What this means in practice</h3>

<p>You will encounter ETL in your career. Probably you'll work on systems that use both ETL and ELT, depending on the team and the use case. The skills carry: extraction is extraction, loading is loading, transformation is transformation. What changes is <em>where</em> the transformation happens and <em>what tools</em> orchestrate it.</p>

<p>Treating ETL as "dead" is incorrect. Treating ETL as "the default for new builds" is also incorrect. The honest picture: <strong>ELT is the default for new modern stacks; ETL persists in regulated environments, real-time streams, and legacy systems</strong>. Both will be in the market for at least another decade.</p>

<hr>

<h2><span class="num">Part Six</span>The hybrid reality: EtLT</h2>

<p>If you read modern data engineering blogs carefully, you'll start to notice a third acronym: <strong>EtLT</strong>. Lowercase t in the middle. It's not a typo.</p>

<p>The idea: in practice, you often want <em>some</em> transformation to happen during the load step, but not the heavy business-logic transformation. You want the heavy transformation to happen in the warehouse, ELT-style. But you also want certain things to happen before data lands.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: EtLT (Extract, transform, Load, Transform)

A hybrid pattern combining ETL and ELT:

  1. Extract from source
  2. small-t: light, mechanical transformations at
     ingest time (type coercion, PII masking, format
     normalization, dropping obviously bad records)
  3. Load into the warehouse
  4. big-T: heavy business-logic transformations
     inside the warehouse (joins, aggregations,
     metrics calculations)

The lowercase t emphasizes that the ingest-time
transformations are small and mechanical. The
uppercase T emphasizes that the bulk of business
logic still happens in-warehouse.

EtLT is what most "ELT" pipelines actually do in
practice. Pure ELT is rare; some small-t at ingest
is almost always present.
────────────────────────────────────────────────</div>

<h3>What goes in the small-t</h3>

<p>The principle: <em>mechanical, non-business-logic transformations that are cheap and safe to do at ingest</em>. Examples:</p>

<ul>
  <li><strong>Type coercion.</strong> Source sends a number as a string. You parse it to a number before loading. Mechanical, no business judgment required.</li>
  <li><strong>Format normalization.</strong> Timestamps in three different formats become one canonical UTC ISO 8601 format. Phone numbers normalized to a standard format.</li>
  <li><strong>PII masking or tokenization.</strong> Replace email addresses with hashed values, or mask credit card numbers, before they touch the warehouse. This is often required by compliance.</li>
  <li><strong>Dropping malformed records.</strong> Events that fail schema validation get routed to quarantine (Day 3, Part Four). They never reach the warehouse's raw tables.</li>
  <li><strong>Field renaming.</strong> Source uses <code>cust_id</code>, your warehouse standard is <code>customer_id</code>. Rename at load.</li>
  <li><strong>Schema validation.</strong> Confirm the record has the expected fields and types before loading. The trust boundary from Day 3.</li>
</ul>

<p>What does NOT go in the small-t:</p>

<ul>
  <li>Joining to other tables</li>
  <li>Aggregating</li>
  <li>Applying business rules ("VIP if lifetime_value &gt; 50000")</li>
  <li>Computing metrics</li>
  <li>Any logic that requires looking at multiple records or tables together</li>
</ul>

<p>The line: <strong>if it requires reading another table or applying business judgment, it belongs in the warehouse, in big-T. If it's mechanical record-level cleanup, it can live in small-t.</strong></p>

<h3>Why this distinction matters</h3>

<p>Three reasons EtLT is the honest model of what modern stacks do:</p>

<p><strong>One: PII has to be masked before landing.</strong> A pure ELT pipeline would land raw credit card numbers in the warehouse, then mask them in transformation. That's a compliance violation in most jurisdictions. Masking must happen before the warehouse sees the data: small-t.</p>

<p><strong>Two: type coercion saves enormous warehouse compute.</strong> If you load JSON strings as VARIANT columns and parse them at query time, every query pays the parsing cost. If you parse once at ingest and store typed columns, queries are 5-50x faster. Worth the small-t.</p>

<p><strong>Three: dropping garbage early reduces noise downstream.</strong> A record that fails validation at ingest never gets to the warehouse. The warehouse only sees data that passed the gate. This is the quarantine pattern from Day 3, expressed in EtLT terms.</p>

<p>In practice, every production "ELT" pipeline has small-t doing the work above. Calling it "ELT" is a useful shorthand; calling it "EtLT" is more precise.</p>

<h3>Where the small-t actually runs</h3>

<p>The small-t typically lives in the ingestion code itself. Examples:</p>

<ul>
  <li>A Kafka consumer in Python validates and masks each event before writing to S3</li>
  <li>A Fivetran or Airbyte connector applies type coercion and column renames per its configuration</li>
  <li>A Glue job (small PySpark script) reads JSON from S3, validates, type-coerces, writes Parquet</li>
  <li>An AWS Lambda function triggered by S3 events does light cleanup before the warehouse COPY</li>
</ul>

<p>All of these are operating <em>between</em> the source and the warehouse, doing mechanical cleanup. None of them are doing business-logic transformation. The business logic still happens inside the warehouse with dbt or similar tools.</p>

<hr>

<h2><span class="num">Part Seven</span>What this shift means for tools and skills</h2>

<p>The shift from ETL to ELT didn't just change pipelines. It changed the entire ecosystem of tools and the skills the market values. Let me lay out the new landscape.</p>

<h3>Tools that grew because of the shift</h3>

<p><strong>Cloud data warehouses.</strong> Snowflake, BigQuery, Redshift, Databricks SQL. These didn't exist (or were nascent) in the ETL era. ELT made them necessary because transformation moved into them. Snowflake hit $1B+ ARR partly because of this shift.</p>

<p><strong>dbt.</strong> Did not exist before 2016. Created specifically for the ELT pattern: SQL transformations as code. Now the de facto standard for warehouse-side transformation. Used at thousands of companies.</p>

<p><strong>Managed ingestion tools.</strong> Fivetran, Airbyte, Stitch. These exist because ELT separated extraction from transformation. A managed connector that just does extract+load is valuable when transformation happens elsewhere.</p>

<p><strong>Reverse ETL.</strong> Hightouch, Census. These exist because once data is in the warehouse, you sometimes want to send curated segments <em>back</em> to operational tools (Salesforce, HubSpot). Reverse ETL is a category created by ELT.</p>

<p><strong>Modern orchestrators.</strong> Airflow grew, Dagster and Prefect emerged. These coordinate ELT pipelines in a way Informatica's built-in scheduler never had to.</p>

<p><strong>Cloud object storage.</strong> S3, GCS, Azure Blob. The substrate of modern data lakes. Without these, ELT economics don't work.</p>

<h3>Tools that contracted because of the shift</h3>

<p><strong>Traditional ETL platforms.</strong> Informatica, DataStage, SSIS, Talend. Still huge in legacy environments, declining in new builds. Informatica has pivoted toward "IDMC" (a cloud platform), but the brand still carries the ETL legacy.</p>

<p><strong>On-prem data warehouses.</strong> Teradata, Oracle Exadata, IBM Netezza. These were the giants of the ETL era. They still exist but are losing ground to cloud-native warehouses.</p>

<p><strong>Enterprise BI tools tied to ETL stacks.</strong> Some traditional BI tools were optimized for querying ETL-produced summary tables. Modern BI tools (Looker, Metabase, Hex, Power BI) are increasingly designed to work directly against warehouse raw and curated layers.</p>

<h3>Skills the market values now</h3>

<p>Compare what Indian DE job postings asked for in 2015 vs 2025:</p>

<p><strong>2015 typical posting:</strong> Informatica or DataStage, Oracle/Teradata, Unix shell scripting, SQL, maybe Java for custom jobs.</p>

<p><strong>2025 typical posting:</strong> SQL (deep), Python (for ingestion and orchestration), Snowflake or BigQuery, dbt, Airflow, AWS (S3, IAM, Glue, EMR), Docker, Git, sometimes Kafka or Flink for streaming, sometimes Kubernetes for production.</p>

<p>The overlap: SQL. The new requirements: Python, cloud platforms, modern orchestration, modern transformation tools.</p>

<p>If you invest the next 10 months in this curriculum (SQL, Python, AWS, Snowflake, dbt, Airflow) you are aligning your skills with the 2025 market, not the 2015 market.</p>

<h3>The Indian market specifically</h3>

<p>I want to be precise about what this means for Indian DE job seekers, because the picture differs by employer type.</p>

<p><strong>Service companies (TCS, Infosys, Wipro, Cognizant, LTIMindtree, Mphasis, Tech Mahindra, Capgemini, Accenture's India operations):</strong></p>

<ul>
  <li>These companies' large enterprise clients have huge legacy ETL footprints (often Informatica or DataStage).</li>
  <li>Service companies hire DEs to maintain and gradually migrate those systems.</li>
  <li>Postings often list Informatica, Talend, or DataStage alongside Snowflake and dbt: they're staffing for both old and new work.</li>
  <li>A learner targeting these companies should have ELT skills (modern) plus awareness of ETL tools (so they can decode job descriptions and not be lost in their first project).</li>
  <li>Compensation: typically ₹4-12 LPA for juniors, ₹15-30 LPA for mid-level, depending on tier of service company and client engagement.</li>
</ul>

<p><strong>Product companies (Indian-origin product companies like Razorpay, Swiggy, Zomato, Flipkart, Paytm, PhonePe, plus the GCCs (Global Capability Centres) of US/EU product companies like Walmart, Microsoft, Google, Meta, Adobe, Salesforce):</strong></p>

<ul>
  <li>These companies built their data stacks more recently. Almost entirely ELT.</li>
  <li>Postings focus on the modern stack: Snowflake/Databricks, dbt, Airflow, AWS/GCP, Python, sometimes Flink/Spark for streaming.</li>
  <li>Compensation: ₹10-25 LPA for juniors, ₹25-60 LPA for mid-level, ₹60-120+ LPA for senior, depending on company tier.</li>
  <li>Hiring bar is higher: they test system design, expect deeper understanding of <em>why</em> tools work the way they do.</li>
</ul>

<p>Both paths are real. Both employ thousands of DEs. The skills you're learning in this curriculum work for both, but the framing matters: at a service company, you'll be staffed onto a project that may use any mix of tools the client has; at a product company, you'll work inside one team's chosen stack.</p>

<p>You don't need to decide today. The skills compound regardless. Just know that when you read job postings later, you'll be reading them with this context in mind.</p>

<hr>

<h2><span class="num">Part Eight</span>How to think about ETL vs ELT in real architectures</h2>

<p>I want to give you a mental model you can use forever, beyond this lecture.</p>

<p>Don't ask "is this team doing ETL or ELT?" That question's too binary. Real teams blend both. Ask instead:</p>

<p class="pull">For each transformation in this pipeline, where does it happen, and why does it happen there?</p>

<p>Walk through any data pipeline you encounter and answer this question for every transformation in it.</p>

<h3>The decision framework</h3>

<p>For each transformation, there are roughly four places it can happen:</p>

<p><strong>At the source.</strong> The source system applies the transformation before exposing data. Examples: a database VIEW that filters rows, an API endpoint that aggregates before returning. <em>Rare in DE; the source team usually doesn't do your work for you.</em></p>

<p><strong>In the ingestion layer (small-t).</strong> Light mechanical transformations as data moves from source to landing zone. Examples: type coercion, PII masking, schema validation. <em>Use when: required for compliance, cheap and safe, would benefit downstream queries.</em></p>

<p><strong>In the warehouse (big-T).</strong> Heavy transformations inside the warehouse, using its compute and SQL. Examples: joining facts to dimensions, aggregating metrics, applying business logic. <em>Use when: it's most transformations.</em></p>

<p><strong>At query time.</strong> The transformation happens when a user runs a query. The warehouse computes it on demand each time. Examples: ad-hoc analyst queries, computed columns in a BI tool. <em>Use when: rarely repeated, exploratory, or specific to one user's question.</em></p>

<h3>Where you put each transformation matters</h3>

<p>Putting a transformation in the wrong place has costs:</p>

<ul>
  <li>Business logic in small-t means changes require redeploying ingestion code (slow). Better in big-T.</li>
  <li>Repeated calculations at query time waste compute. Better materialized in big-T.</li>
  <li>PII transformations in big-T mean raw PII reached the warehouse (compliance risk). Better in small-t.</li>
  <li>Aggregations at source mean you can't drill down later (lost detail). Better in big-T or kept raw.</li>
</ul>

<p>The senior DE skill is recognizing which transformation belongs where, and being able to justify the choice. Every architecture review asks this question implicitly.</p>

<h2><span class="num">Part One</span>Idempotency: properly this time</h2>

<p>We touched on idempotency in Day 3. I told you "a pipeline is idempotent if running it twice produces the same result as running it once" and showed you three mechanisms. That was an introduction. Today we go deeper, because idempotency is one of those concepts where the word is easy but the engineering is hard.</p>

<h3>The mathematical origin</h3>

<p>The word comes from mathematics. An operation <em>f</em> is idempotent if applying it twice produces the same result as applying it once: <code>f(f(x)) = f(x)</code>.</p>

<p>Examples from elementary math:</p>
<ul>
  <li>Multiplying by 1 is idempotent: <code>x × 1 × 1 = x × 1</code>. Doing it twice doesn't change anything.</li>
  <li>Taking the absolute value is idempotent: <code>|||x||| = ||x|| = |x|</code>.</li>
  <li>Multiplying by 2 is <em>not</em> idempotent: <code>x × 2 × 2 ≠ x × 2</code>. Doing it twice gives a different answer.</li>
</ul>

<p>That's the abstract idea. Now let's see what it means in real systems.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: Idempotency (working definition for DE)

An operation is idempotent if performing it any number
of times produces the same final state as performing
it exactly once.

In DE specifically, this applies to:
  - Pipeline runs (re-running the same input produces
    the same output)
  - Write operations (writing the same record twice
    produces the same destination state as writing
    it once)
  - API calls (calling the same endpoint twice has
    the same effect as calling it once)

The DE definition we actually care about: a re-run on
the same input window produces the same destination
state regardless of whether previous runs succeeded,
failed partway, or never ran.

This is a property you ENGINEER IN. Operations are
NOT idempotent by default.
────────────────────────────────────────────────</div>

<h3>Why idempotency matters: three real failure modes it prevents</h3>

<p>I want to tell you three real shapes of failure that idempotency prevents. These are the failures you will personally encounter in your career, repeatedly.</p>

<p><strong>Failure shape 1: the partial-run-then-retry duplicate.</strong></p>

<p>A pipeline pulls 10,000 orders from a source database and inserts them into a warehouse table. The pipeline successfully inserts 7,000 orders, then loses its database connection and crashes. The orchestrator (Airflow) catches the failure and retries the task.</p>

<p>The retry pulls the same 10,000 orders again. It inserts all of them. Now the warehouse has 17,000 rows instead of 10,000: the first 7,000 are duplicated.</p>

<p>What happens downstream? Revenue is reported 70% too high. The CEO's dashboard is wrong. Somebody notices on Tuesday morning. The team spends a day reconciling. The damage to trust is harder to undo than the duplicates.</p>

<p>How idempotency would have prevented this: instead of <code>INSERT</code>, use <code>MERGE</code> keyed on <code>order_id</code>. The first 7,000 rows already exist; the merge updates them (no change). The other 3,000 get inserted. Final state: exactly 10,000 rows. <em>The retry produces the correct result.</em></p>

<p><strong>Failure shape 2: the silent gap.</strong></p>

<p>A pipeline pulls events from Kafka and writes them to S3. The watermark says "last processed offset = 500,000." The pipeline reads offsets 500,001 through 510,000, writes them to S3, advances the watermark to 510,000. Then crashes on the write of the watermark.</p>

<p>The retry reads from offset 510,001 (because that's what the orchestrator thinks the watermark should be: except the watermark didn't actually persist). But wait, if the watermark didn't update because the crash happened DURING that update, the watermark is still at 500,000, so the retry re-reads 500,001-510,000.</p>

<p>Two possible designs:</p>

<ul>
  <li><strong>Design A:</strong> watermark is updated <em>before</em> writing data. Crash → next run starts from new watermark → 500,001-510,000 are never processed. <strong>Silent data loss.</strong></li>
  <li><strong>Design B:</strong> watermark is updated <em>after</em> writing data is durably committed. Crash → next run starts from old watermark → 500,001-510,000 get reprocessed. <strong>Safe, if the destination is idempotent.</strong></li>
</ul>

<p>Design A is non-idempotent and unsafe. Design B is the idempotent pattern. <em>Idempotency forces you to design B by making "reprocess" the safe default.</em></p>

<p><strong>Failure shape 3: the eventually-consistent source.</strong></p>

<p>You're pulling orders from a Postgres read replica. The replica typically lags 60 seconds behind the primary, but during heavy write periods that lag can stretch to 5 minutes. Your pipeline runs hourly and uses the wall clock as the watermark boundary.</p>

<p>At 1:58:00am, an order is committed on the primary. The replica is running 5 minutes behind right now, so the order doesn't appear on the replica until 2:03:00am.</p>

<p>Your 2:00:00am pipeline runs. It queries: <code>SELECT * FROM orders WHERE updated_at > '1:00:00am' AND updated_at &lt;= '2:00:00am'</code>. The 1:58:00am order is not visible on the replica yet (replica is showing data as of 1:55:00am). The query returns 499 orders instead of 500. The pipeline writes those 499 rows and advances the watermark to 2:00:00am.</p>

<p>At 3:00:00am, the next run starts. It queries: <code>SELECT * FROM orders WHERE updated_at > '2:00:00am' AND updated_at &lt;= '3:00:00am'</code>. The 1:58:00am order is now visible on the replica (has been since 2:03:00am). But its <code>updated_at</code> is 1:58:00am, which is below the new floor of 2:00:00am. The query does not return it.</p>

<p>The record is now permanently orphaned. It exists on the source. It will never be picked up by any future run, because every future run reads above the advancing watermark. <strong>Silent data loss.</strong></p>

<p>The fix is to <strong>cap the upper bound at a safety-lag below the current time</strong>, not at the current time itself. If you know replica lag can reach 5 minutes, you read up to <code>now() - 10 minutes</code> instead of <code>now()</code>. At 2:00:00am, you would have queried for records up to 1:50:00am. The 1:58:00am record would have been outside that window, but the next run at 3:00:00am would query up to 2:50:00am, and the 1:58:00am record (now visible on the replica) falls inside that window. It gets picked up.</p>

<p>The pattern: <em>never use wall-clock time as your upper bound when pulling from an eventually-consistent source. Always use wall-clock minus a safety lag that exceeds your worst-case replication delay.</em></p>

<p>This is the kind of bug that is invisible during testing (your test source has zero replication lag) and shows up in production three months in, when one record per week starts going missing and nobody can figure out why.</p>

<p>The rule: <strong>at-least-once delivery + idempotent processing = correct.</strong> Exactly-once delivery is a much harder guarantee that few systems actually provide. At-least-once is easy; idempotent processing makes it safe.</p>

<h3>The three mechanisms: deeper this time</h3>

<p>Day 3 listed three mechanisms. Let me give you each one with the specific patterns you'll write.</p>

<h4>Mechanism 1: Deterministic destination keys</h4>

<p>Every record going into a destination has a key that comes from the source data, not from the time of the write, not from a sequence generator, not from "whatever's next." From the source data, meaning two runs of the pipeline with the same input produce records with the same keys.</p>

<p>For a SQL destination (warehouse table), this looks like:</p>

<pre><code>-- NON-IDEMPOTENT: blind insert, creates duplicates on re-run
INSERT INTO orders_warehouse
SELECT * FROM staging_orders;

-- IDEMPOTENT: MERGE keyed on the natural key
MERGE INTO orders_warehouse t
USING staging_orders s
  ON t.order_id = s.order_id
WHEN MATCHED THEN UPDATE SET
    user_id      = s.user_id,
    placed_at    = s.placed_at,
    total_amount = s.total_amount,
    status       = s.status
WHEN NOT MATCHED THEN INSERT (order_id, user_id, placed_at, total_amount, status)
                       VALUES (s.order_id, s.user_id, s.placed_at, s.total_amount, s.status);</code></pre>

<p>Run that MERGE once, you get the right rows. Run it ten times in a row, you get exactly the same right rows. That's idempotency.</p>

<p>The cost: MERGE is slightly more expensive than INSERT (the warehouse has to check existence per row). For 99% of pipelines, the cost is irrelevant. For very high-throughput pipelines, you might use specialized techniques (partition-level overwrites, append-only with downstream dedup): we'll cover those in later phases.</p>

<h4>Mechanism 2: Deterministic file paths</h4>

<p>For object-storage writes (S3, GCS), use file paths that come from the source data's date or identifier, not from the run's timestamp.</p>

<pre><code># NON-IDEMPOTENT: timestamp in filename
s3://raw/orders/orders_20250115T020034_run123.parquet
# Re-run creates a NEW file: orders_20250115T031245_run124.parquet
# Now you have two files for the same logical batch.
# Downstream sees duplicates.

# IDEMPOTENT: deterministic path from source data
s3://raw/orders/year=2025/month=01/day=15/orders.parquet
# Re-run overwrites THE SAME FILE.
# No duplicates downstream.</code></pre>

<p>The principle: the destination address should be derivable from the input data, not from when the write happened.</p>

<h4>Mechanism 3: Watermark advancement only on commit</h4>

<p>From the failure shape 2 above. The watermark advances <em>after</em> the destination write is durably committed, never before. Crash before watermark advances → next run repeats the work → idempotency in the destination handles the duplicate.</p>

<pre><code># PSEUDO-CODE for the safe pattern:

def run_batch():
    start = read_watermark()           # e.g., 2025-01-15 01:00:00
    end   = now() - INTERVAL '5 min'   # safety lag
    records = source.query(
        f"SELECT * WHERE updated_at > '{start}' AND updated_at <= '{end}'"
    )
    destination.merge(records)          # idempotent write
    write_watermark(end)                # only after merge succeeds</code></pre>

<p>The order of those three steps matters. Merge before watermark write. If we crash between "merge succeeds" and "watermark write," the next run repeats the merge, which is idempotent, so it's safe.</p>

<h3>The non-obvious idempotency cases</h3>

<p>Some operations are obviously not idempotent. Some are sneakily not idempotent. Let me show you the ones that catch people.</p>

<p><strong>Generating new IDs in the pipeline is not idempotent.</strong></p>

<pre><code># NOT IDEMPOTENT - uuid is generated at insert time
INSERT INTO orders_enriched (enriched_id, order_id, ...)
SELECT uuid_generate_v4(), order_id, ...
FROM orders;

# Each run produces different enriched_ids for the same orders.
# Downstream tables that referenced previous enriched_ids are now broken.</code></pre>

<p>The fix: derive IDs deterministically from source data (a hash of order_id, for instance).</p>

<p><strong>Calling external APIs that have side effects is not idempotent.</strong></p>

<p>If your pipeline sends an email or charges a credit card, retrying that operation is not safe. You need an "idempotency key": a unique identifier per logical operation that the external service uses to deduplicate. Stripe, for example, has this built in: every Stripe API call accepts an idempotency-key header, and Stripe guarantees that calls with the same key produce the same result.</p>

<p><strong>Appending logs is not the same as appending data.</strong></p>

<p>Writing to a log file is often acceptable to do twice (a duplicate log line is annoying, not fatal). Writing financial transactions twice is not. The bar for idempotency varies by what the data represents.</p>

<h3>What "exactly-once" actually means</h3>

<p>You will hear claims like "Kafka offers exactly-once semantics." Be careful.</p>

<p>Exactly-once is hard in distributed systems: generally regarded as impossible in the strict mathematical sense. What systems actually offer is "effectively-once": at-least-once delivery combined with idempotent processing in the destination.</p>

<p>When a vendor says "exactly-once," they usually mean: "we will retry until success, and our retries are idempotent in our system, so from your perspective each message is processed exactly once."</p>

<p>The senior interpretation: <em>treat all message delivery as at-least-once. Make your processing idempotent. Don't trust "exactly-once" claims.</em></p>

<h2><span class="num">Part Two</span>SLAs: what they actually promise</h2>

<p>Now the second vocabulary item. SLA stands for <strong>Service Level Agreement</strong>. Everyone uses the word. Few people use it correctly.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: SLA (Service Level Agreement)

A formal commitment from a service provider to a
service consumer about how the service will perform.

The commitment typically covers:
  - AVAILABILITY (uptime) - "service is up 99.9% of
    the time"
  - LATENCY - "95% of requests respond in <200ms"
  - THROUGHPUT - "service handles 10,000 requests/sec"
  - FRESHNESS (for data services) - "data is no more
    than 1 hour old"

An SLA includes:
  1. The metric being measured
  2. The threshold (the promised level)
  3. The measurement window (over what period)
  4. The consequences if missed (credits? penalties?
     just an explanation?)

Without all four, it's not an SLA. It's a hope.
────────────────────────────────────────────────</div>

<h3>Three related terms that get confused</h3>

<p>Three terms get used interchangeably. They're not the same.</p>

<p><strong>SLI: Service Level Indicator.</strong> The actual measurement. "Yesterday, 99.94% of requests succeeded." It's a number, measured.</p>

<p><strong>SLO: Service Level Objective.</strong> Your internal target. "We want to keep success rate above 99.95%." It's a goal, set internally, no contractual force.</p>

<p><strong>SLA: Service Level Agreement.</strong> The contractual promise. "If success rate drops below 99.9% in any month, we credit 10% of fees." It's a contract with consequences.</p>

<p>The relationship: <em>SLI &lt; SLO &lt; SLA</em>. You measure SLIs. You manage to SLOs. You contract on SLAs. Your internal SLO is always tighter than your external SLA, because you want headroom before you breach.</p>

<p>Examples:</p>

<ul>
  <li><strong>SLA:</strong> "Daily revenue report is available by 8am IST. Penalty for missing: a written explanation to the CEO."</li>
  <li><strong>SLO:</strong> "Internal target, report is available by 7:30am IST." (Half-hour buffer.)</li>
  <li><strong>SLI:</strong> "Today report was available at 7:18am. Yesterday at 7:31am. Day before at 7:09am." (Actual measurements.)</li>
</ul>

<h3>The four pieces every SLA must have</h3>

<p>I said an SLA needs four things. Let me show you what each one looks like in real life.</p>

<p><strong>1. The metric being measured.</strong> Specific. Unambiguous.</p>

<p>Bad: "the service will be reliable."</p>

<p>Good: "the percentage of API requests returning HTTP 2xx within 200ms, measured over a rolling 5-minute window."</p>

<p>Bad: "the data will be fresh."</p>

<p>Good: "the maximum delay between event creation in the source system and event availability in the orders_clean table, measured by the difference between event_timestamp and ingestion_timestamp at the 99th percentile over a 24-hour rolling window."</p>

<p>Vague SLAs are worse than no SLA: they create the illusion of accountability while providing none.</p>

<p><strong>2. The threshold.</strong> A specific number.</p>

<p>"Three nines" = 99.9% available. "Four nines" = 99.99%. "Five nines" = 99.999%.</p>

<div class="board">────────────────────────────────────────────────
WHAT NINES OF AVAILABILITY ACTUALLY MEAN

Per year:
  90%       = 36.5 days of downtime allowed
  95%       = 18.25 days
  99%       = 3.65 days
  99.5%     = 1.83 days
  99.9%     = 8.76 hours        (three nines)
  99.95%    = 4.38 hours
  99.99%    = 52.6 minutes      (four nines)
  99.999%   = 5.26 minutes      (five nines)
  99.9999%  = 31.5 seconds      (six nines)

Most managed cloud services advertise three or four
nines. Five nines is rare and expensive. Six nines is
typically reserved for telecom or critical financial
systems with enormous engineering investment.

For a data pipeline, "99.9% on-time" - three nines -
means you can miss roughly one daily run per year and
still be in compliance.
────────────────────────────────────────────────</div>

<p><strong>3. The measurement window.</strong> Critically important.</p>

<p>"99.9% uptime measured monthly" is very different from "99.9% uptime measured annually."</p>

<p>If measured monthly: any month you have 8.7 hours of downtime breaks the SLA. You only get ~43 minutes per month.</p>

<p>If measured annually: 8.76 total hours of downtime spread anywhere in the year. One bad week followed by a perfect quarter still meets the SLA.</p>

<p>Vendors negotiate measurement windows aggressively because they shape what counts as a breach.</p>

<p><strong>4. The consequences.</strong> The "agreement" part.</p>

<p>"We will credit X% of the monthly fee if we miss the SLA." Specific. Measurable. Enforceable.</p>

<p>"We will use commercially reasonable efforts to...": that's not a commitment. That's marketing copy. Real SLAs have real teeth.</p>

<h3>How to read a vendor's SLA: the senior skill</h3>

<p>When a vendor advertises an SLA, read it like a contract lawyer. The headline number is bait. The fine print is the actual deal.</p>

<p>Things to look for:</p>

<p><strong>What counts as "downtime"?</strong> Many SLAs exclude scheduled maintenance from downtime calculations. "We give 48 hours notice and take the service down for 6 hours every Sunday" doesn't count against the SLA. Read carefully.</p>

<p><strong>What's the measurement scope?</strong> Some SLAs measure availability of the <em>service overall</em>, not of <em>your specific account</em>. If 1% of customers experience outages but the platform on average is 99.99% up, the SLA is met even if you're in that 1%.</p>

<p><strong>What's the burden of proof?</strong> "Customer must report downtime via a specific support channel within 48 hours": miss that window, no credit. Some vendors make claiming SLA credits administratively painful on purpose.</p>

<p><strong>What's the maximum penalty?</strong> "Credits capped at 30% of monthly fees" means even a catastrophic outage gives you back at most 30% of one month's spend. The SLA doesn't compensate you for downstream losses.</p>

<p>The cynical (and accurate) view: <strong>SLAs are mostly about reputation, not compensation.</strong> The credit amounts rarely make you whole. The real value of an SLA is that the vendor publicly committed to a number, so they're motivated to hit it for their reputation, not for the credits.</p>

<h3>SLAs in DE: the ones you'll set and measure</h3>

<p>As a DE, you'll be on both sides. You'll set SLAs for the data services your team provides to internal consumers. You'll measure against SLAs you're held to.</p>

<p>Common DE SLAs:</p>

<p><strong>Freshness SLAs.</strong> "The orders fact table will reflect data no older than 1 hour, measured at the 95th percentile, between 6am-10pm IST."</p>

<p><strong>Completeness SLAs.</strong> "On any given day, the orders fact table will contain at least 99% of orders placed in the source system that day."</p>

<p><strong>Availability SLAs.</strong> "The CEO morning email will be delivered by 8am IST on at least 99% of weekdays."</p>

<p><strong>Latency SLAs (for real-time pipelines).</strong> "Events placed in Kafka will be available in the live dashboard within 60 seconds at the 99th percentile."</p>

<h3>Designing for SLAs: the engineering implications</h3>

<p>An SLA is a target. To hit a target, you have to design for it. A pipeline with no monitoring can't have an SLA: you can't promise what you can't measure.</p>

<p>Concretely, an SLA forces these engineering decisions:</p>

<ul>
  <li>You must measure the SLI (the actual performance). This requires logging, metrics, dashboards.</li>
  <li>You must alert when the SLI approaches the SLO threshold. This requires alerting infrastructure.</li>
  <li>You must have a runbook for SLA breaches. What happens when you miss? Who gets called? How do you recover?</li>
  <li>You must engineer for the SLA. Daily SLAs need batch reliability; sub-second SLAs need streaming infrastructure.</li>
</ul>

<p>The single biggest mistake: agreeing to an SLA before you have the measurement infrastructure to track it. You'll miss without knowing. You'll get caught out when the consumer notices before you do.</p>

<p>The senior pattern: <em>measure first, set SLO internally, get comfortable, then commit to an SLA.</em></p>

<hr>

<h2><span class="num">Part Three</span>CAP: the theorem that shapes every distributed system</h2>

<p>Now the third vocabulary item. CAP is harder than the other two because it's a theorem, not just a definition. But understanding it is what separates engineers who reason about distributed systems from engineers who follow tool recipes.</p>

<h3>The setup</h3>

<p>Before the theorem itself, let's be clear about what kind of system we're talking about.</p>

<p>A <strong>distributed system</strong> is one where data is stored on (and processed by) more than one machine. Examples:</p>

<ul>
  <li>A database with read replicas (one primary, multiple secondaries)</li>
  <li>A NoSQL database like Cassandra (data spread across many nodes)</li>
  <li>Kafka (events spread across multiple broker servers)</li>
  <li>Snowflake (compute and storage spread across many nodes, but with strong consistency mechanisms)</li>
  <li>Any cloud database, basically</li>
</ul>

<p>The reason distributed systems exist: <em>one machine is never enough for serious scale or reliability</em>. If your data is on one machine and that machine dies, your data is gone (or temporarily inaccessible). If your data is on five machines, you can lose one and still serve users.</p>

<p>But distributed systems have a fundamental constraint that single-machine systems don't: <em>the machines have to talk to each other over a network, and networks fail</em>. Not "sometimes." Not "rarely." Constantly. Packet loss, latency spikes, momentary disconnections: these happen every day in any large network.</p>

<h3>The CAP theorem itself</h3>

<div class="board">────────────────────────────────────────────────
VOCABULARY: The CAP Theorem

In a distributed system, you can guarantee at most TWO
of these three properties at any moment when a network
partition occurs:

  C - CONSISTENCY
      Every read receives the most recent write, or
      an error. All nodes see the same data at the
      same time.

  A - AVAILABILITY
      Every request receives a (non-error) response,
      even if some nodes are down.

  P - PARTITION TOLERANCE
      The system continues operating despite network
      partitions (some nodes can't talk to others).

Stated by Eric Brewer in 2000, formally proved in 2002.
You see it written as "CAP" - pick 2 of 3.

The honest restatement: in a real distributed system,
partitions WILL happen (networks are unreliable). So
you must choose P. The real choice is between C and A
DURING a partition.

  - CP systems prioritize consistency, refuse to serve
    requests during partitions, return errors
  - AP systems prioritize availability, serve requests
    during partitions, accept that data might be stale
────────────────────────────────────────────────</div>

<h3>What "partition" means concretely</h3>

<p>A network partition is when some nodes in your cluster can't talk to other nodes, but the disconnected nodes themselves are still up and running. From outside, the cluster looks split into two halves that don't know about each other.</p>

<p>Concrete example: imagine a database cluster with 5 nodes spread across two data centers. There's a fiber cut in the line between data centers. Suddenly:</p>

<ul>
  <li>Data Center A (3 nodes) can talk to each other but not to Data Center B</li>
  <li>Data Center B (2 nodes) can talk to each other but not to Data Center A</li>
  <li>Customers connecting to either DC can still reach the local nodes</li>
</ul>

<p>The cluster is partitioned. Both halves are alive. Neither knows the state of the other. Writes are coming in to both sides. <em>What do you do?</em></p>

<p>Two reasonable answers:</p>

<p><strong>CP answer:</strong> "We don't accept writes unless we can confirm with a majority of nodes. The minority partition (2 nodes) refuses writes: returns errors to clients. The majority partition (3 nodes) keeps working. When the network heals, no conflicts because only one side was writing."</p>

<p><strong>AP answer:</strong> "Both sides accept writes. We tell clients 'your write is accepted.' When the network heals, we have conflicts to resolve: two versions of the same data. We pick a winner (last-write-wins, or vector-clock-based reconciliation, or app-level merge logic)."</p>

<p>Both are defensible. Different applications choose differently. The choice is not about "correctness": both choices are correct, given their respective definitions of correct.</p>

<h3>Real-world examples of each choice</h3>

<p><strong>CP systems (prioritize consistency):</strong></p>

<ul>
  <li><strong>Traditional SQL databases (Postgres, MySQL) in single-leader mode.</strong> Writes go to one leader. If the leader is unreachable, no writes happen. Consistency is preserved; availability suffers during failures.</li>
  <li><strong>Etcd, ZooKeeper, Consul.</strong> Consensus-based systems used for configuration management. They refuse to operate without a quorum.</li>
  <li><strong>Banking core systems.</strong> A bank cannot afford "your balance was ₹10,000 on this node and ₹3,000 on that node." Better to refuse the transaction than to allow inconsistency.</li>
  <li><strong>Snowflake.</strong> Strong consistency for SQL operations. Refuses to operate if storage layer is unreachable.</li>
</ul>

<p><strong>AP systems (prioritize availability):</strong></p>

<ul>
  <li><strong>DynamoDB (default mode).</strong> Reads and writes always succeed. Recently-written data may not yet be visible on all nodes (eventual consistency). The classic AP design.</li>
  <li><strong>Cassandra.</strong> Tunable per query, but default mode is AP. Most teams use it for high-write workloads where availability matters more than strict consistency.</li>
  <li><strong>S3.</strong> Reads after writes may briefly show old data (recently improved, but historically eventually-consistent). Always available; consistency catches up.</li>
  <li><strong>Most caching layers (Redis in cluster mode, Memcached).</strong> Designed for availability and speed; stale reads are acceptable.</li>
  <li><strong>Most social media feeds, shopping carts.</strong> Showing slightly stale data is fine; refusing to load the page is not.</li>
</ul>

<h3>The "consistency" word is overloaded</h3>

<p>Important note. The word "consistency" gets used in two different ways in databases, and it confuses students endlessly.</p>

<p><strong>Consistency in CAP</strong> = all nodes agree on the current value. A read after a write sees the write.</p>

<p><strong>Consistency in ACID</strong> = transactions preserve database invariants (foreign keys, constraints, etc.). Nothing to do with distributed systems.</p>

<p>When someone says "we have a consistent database," ask which meaning. Both are valid. They're different properties.</p>

<h3>PACELC: the extension you'll occasionally hear</h3>

<p>CAP applies only during partitions. But distributed systems exist 24/7, and they have to make tradeoffs even when no partition is happening.</p>

<p>PACELC (pronounced "pass-elk") extends CAP:</p>

<ul>
  <li><strong>If Partition (P), choose Availability (A) or Consistency (C)</strong>: the CAP theorem applies</li>
  <li><strong>Else (E), choose Latency (L) or Consistency (C)</strong>, even without partitions, there's a tradeoff between waiting for consistency and responding fast</li>
</ul>

<p>Why does this matter? Because in normal operation (no partition), a CP system might still choose latency over consistency for some reads: returning a slightly stale value from a local node rather than coordinating with all nodes. PACELC names this tradeoff explicitly.</p>

<p>You don't need to use PACELC in casual conversation, but recognizing it tells you the speaker is thinking carefully about distributed systems.</p>

<h3>What this means for you as a DE</h3>

<p>Most DEs don't choose between C and A from scratch: you use tools that have already made the choice. Snowflake is CP. DynamoDB is AP. Postgres-with-replicas is mostly CP with eventually-consistent read replicas.</p>

<p>What you do choose: <em>which tool to use for which job</em>. And CAP gives you the vocabulary to reason about it.</p>

<p>Concrete examples:</p>

<p><strong>Storing analytical data?</strong> You want CP. Snowflake or BigQuery. Consistency matters: analysts should see the same numbers regardless of which warehouse cluster they're querying from.</p>

<p><strong>Real-time dashboard for live operations?</strong> AP can be fine. The user looking at order counts doesn't care if there's a 200ms discrepancy across nodes. Redis or DynamoDB works.</p>

<p><strong>Storing user authentication state?</strong> CP. You don't want a user to be "logged in" on one node and "logged out" on another. Postgres with consistent reads.</p>

<p><strong>Storing event logs for later analytics?</strong> AP. You can tolerate eventual consistency. S3 works.</p>

<p>The DE skill: recognize the choice your tools have made, and use them for the workloads where their choice fits.</p>

<h3>The interview question you'll be asked</h3>

<p>Some version of this comes up in many DE system-design interviews:</p>

<p><em>"You're designing a real-time feature store for an ML model. The model needs to read features in &lt;10ms. The features are updated whenever user events happen. Walk me through the CAP tradeoffs you'd consider."</em></p>

<p>Good answer skeleton: "The 10ms read latency forces an AP system (we can't wait for cross-node consistency on every read). We accept eventual consistency. We pick something like Redis or DynamoDB. We need to be careful about the gap between when an event arrives and when the feature reflects it: typically tens of milliseconds in a well-designed system. We monitor that lag. For the small fraction of cases where slightly stale features would produce wrong predictions, we accept the tradeoff because the alternative (&gt;10ms latency) would make the model unusable in production. If we wanted strict consistency, we'd be looking at a CP system with much higher latency, which violates the requirement."</p>

<p>That's not a perfect answer. But it shows you understand the tradeoffs and can navigate them out loud. That's what the interviewer is looking for.</p>

<hr>

<h2><span class="num">Part Four</span>How these three connect</h2>

<p>One more thing before we close. These three concepts are taught separately but they're related in subtle ways. Connecting them is the senior move.</p>

<h3>Idempotency enables AP designs</h3>

<p>Why does an AP system work in practice? Because the consumers are designed to handle eventual consistency. They tolerate stale reads. They tolerate occasional duplicates. They tolerate the system being "almost right."</p>

<p>Idempotency is what makes "almost right" safe. If your processing is idempotent, an AP system's duplicate delivery doesn't hurt you. If your processing is not idempotent, an AP system's duplicates produce wrong answers.</p>

<p>So the chain is: distributed systems are usually AP → AP means at-least-once → at-least-once is safe if your processing is idempotent → therefore idempotency is non-negotiable for working with distributed systems.</p>

<p>This is why every DE curriculum drills idempotency into you. It's not a nice-to-have. It's the bridge between "this system claims to deliver messages" and "this system actually produces correct outputs."</p>

<h3>SLAs translate CAP choices into business commitments</h3>

<p>When you set an availability SLA ("99.9% uptime") you're implicitly committing to an A-leaning system, or to engineering your CP system to minimize partition exposure.</p>

<p>When you set a consistency SLA ("all reads reflect writes within 100ms") you're implicitly committing to a C-leaning system.</p>

<p>The SLA you can promise is constrained by the CAP choices of your underlying systems. A team promising "five nines of availability" on a CP system is going to disappoint somebody.</p>

<p>The skill is matching your SLAs to your CAP choices. Promise what your architecture can deliver.</p>

<h3>The three together form the senior-engineer toolkit</h3>

<p>When you walk into an architecture discussion and someone proposes a system design, three questions to ask:</p>

<ol>
  <li><strong>Where does idempotency live?</strong> Which destinations are safe to write to twice? What handles the duplicates?</li>
  <li><strong>What's the SLA?</strong> What are we promising to consumers? What measurement infrastructure supports the promise?</li>
  <li><strong>What CAP tradeoff have we made?</strong> Are we CP or AP? What happens during a partition?</li>
</ol>

<p>Three questions. Most architecture discussions skip them all and dive into tool selection. The discussions where someone asks these are the discussions that produce systems that actually work.</p>

<p>You're now equipped to be the person who asks them.</p>

<h2><span class="num">Opening</span>What does "modern data stack" even mean?</h2>

<p>The phrase "modern data stack" gets thrown around like everyone agrees on what it means. They don't. Let me give you the working definition.</p>

<p>The <strong>modern data stack</strong> (sometimes abbreviated MDS) refers to the cloud-native, modular, ELT-centric tooling that became dominant for new data builds starting roughly 2018. It contrasts with the older <em>traditional data stack</em>: on-premise, monolithic, ETL-centric platforms from vendors like Informatica, IBM, Oracle, Teradata.</p>

<p>The defining properties of the modern stack:</p>

<ul>
  <li><strong>Cloud-native.</strong> Built for elastic compute and cheap object storage. Wouldn't exist without AWS, GCP, Azure.</li>
  <li><strong>Modular.</strong> Each layer is a separate tool from a different vendor. You assemble your stack from components rather than buying one monolithic platform.</li>
  <li><strong>ELT-centric.</strong> Transformation happens in the warehouse, in SQL. Yesterday's lecture covered why.</li>
  <li><strong>Open standards.</strong> Most tools speak common protocols (S3 API, Iceberg/Parquet formats, SQL). You can swap tools without rebuilding everything.</li>
  <li><strong>Pay-per-use.</strong> Tools charge by consumption, not perpetual licenses. Smaller teams can afford enterprise-grade infrastructure.</li>
</ul>

<p>The phrase is partly marketing. Fivetran coined it around 2018 to position themselves alongside other "modern" tools (Snowflake, dbt) as a coherent alternative to the legacy stack. But underneath the marketing, the description is accurate: a real architectural shift happened, and the tools that won have these properties in common.</p>

<p>What we're going to do today: walk through every category in this stack, name the dominant tools, explain what each one does, and show how they fit together. You won't be expert in any one tool after today. You will be <em>oriented</em>: able to see the whole landscape and place any new tool you encounter into its category.</p>

<h2><span class="num">Part Two</span>Source systems, where data comes from</h2>

<p>You don't choose your sources; you receive them. But you need to know what shapes data arrives in, because the shape determines what ingestion strategy you'll use.</p>

<h3>Category 1: Operational databases</h3>

<p>The OLTP systems from Day 1. The transactional store that powers the application itself.</p>

<p><strong>Dominant ones you'll encounter:</strong></p>

<ul>
  <li><strong>Postgres</strong>: Open source, widely used in modern startups. Excellent feature set, good performance for most workloads. Most product companies in India use Postgres.</li>
  <li><strong>MySQL</strong>: Open source, older than Postgres in mainstream use. Common at companies that started in the 2000s. Still dominant at some scale-out shops.</li>
  <li><strong>MongoDB</strong>: Document-oriented NoSQL. Stores JSON-like documents instead of relational rows. Common at startups that prioritized fast iteration over schema discipline.</li>
  <li><strong>Oracle, MS SQL Server, IBM DB2</strong>: Enterprise SQL databases, dominant at older enterprises (banks, insurers, large manufacturers, government). You'll see these heavily at service company clients.</li>
  <li><strong>DynamoDB, Cassandra</strong>: Distributed NoSQL. Used at scale for specific access patterns. Common at large product companies.</li>
</ul>

<p>From a DE perspective, the operational database has these properties: it's optimized for the app, not for you. You can't run heavy queries against it (you'll slow the app down). You pull from a read replica or use CDC to capture changes.</p>

<h3>Category 2: SaaS APIs</h3>

<p>Every company runs on dozens of SaaS tools. Each one has data the company wants in their warehouse.</p>

<p><strong>The common categories you'll integrate:</strong></p>

<ul>
  <li><strong>CRM:</strong> Salesforce, HubSpot, Zoho. Customer accounts, deals, interactions.</li>
  <li><strong>Marketing automation:</strong> Marketo, Mailchimp, Klaviyo, MoEngage. Email campaigns, automations, subscriber lists.</li>
  <li><strong>Payment processing:</strong> Stripe, Razorpay, PayU. Transactions, refunds, chargebacks.</li>
  <li><strong>Ads platforms:</strong> Google Ads, Facebook Ads, LinkedIn Ads. Campaign spend, impressions, conversions.</li>
  <li><strong>Support tools:</strong> Zendesk, Intercom, Freshdesk. Tickets, conversations, satisfaction scores.</li>
  <li><strong>Analytics tools:</strong> Google Analytics, Mixpanel, Amplitude. User behavior, funnels.</li>
  <li><strong>Internal tools:</strong> Jira, GitHub, Slack. Engineering activity, codebase metadata, communication metrics.</li>
</ul>

<p>Each one has a REST API (sometimes GraphQL or webhook-based). Each one has authentication. Each one has rate limits. Each one has its own schema quirks. Pulling data from these is a major category of DE work, which is why managed connector tools exist (we'll cover them in ingestion).</p>

<h3>Category 3: Event streams</h3>

<p>Mobile apps, web pixels, IoT devices, and internal services emit events as users interact with them. These events flow through streaming platforms (we'll cover those soon).</p>

<p>Common event sources:</p>

<ul>
  <li>Mobile app SDKs: Firebase, Mixpanel, Segment</li>
  <li>Web pixels: Google Tag Manager, Segment, custom JavaScript</li>
  <li>Backend service events: internal Kafka topics emitted by application services</li>
  <li>IoT device telemetry: for companies with physical products</li>
  <li>CDC streams: changes from operational databases captured as events</li>
</ul>

<h3>Category 4: Files</h3>

<p>The old-school but still very common pattern. Files dropped on FTP servers, into S3 buckets, or as email attachments.</p>

<ul>
  <li>Vendor data drops (think: marketing data partners, credit bureaus, market data providers)</li>
  <li>CSV/Excel exports from systems that don't have APIs</li>
  <li>Compliance reports from regulators that must be ingested</li>
  <li>Partner data feeds (think: airline reservation systems, supply chain data)</li>
</ul>

<p>Files seem primitive but they're still everywhere. Even in 2026, many B2B data exchanges happen via file drops.</p>
