<p>That's it. That's the whole ask. Vague, right? That's how real business asks arrive. Half your job as a data engineer is turning <em>"build me visibility"</em> into concrete, defensible decisions about what data flows where, how often, in what shape, for whom. That's what we're going to practice today.</p>

<p>Before any design decision, you need to know exactly what data you have access to and exactly what the consumers need. <strong>I'm going to spell every detail out below.</strong> Read it carefully. The whole lab depends on you having this picture clearly in your head.</p>

<h3>What data exists, Source A: Tahini backend database (Postgres)</h3>

<p>The backend team runs a Postgres database that powers the Tahini app. They've set up a <strong>read replica</strong> for you: a copy of the database that you can query without affecting the live production app.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: Read replica

A read replica is a separate copy of a production
database that is kept in sync with the original.
You can run SELECT queries against it freely without
affecting the speed or stability of the production
database that the app uses.

Trade-off: replicas lag slightly behind the primary.
The replica is updated by copying changes from the
primary, and that copying takes time.

Tahini's replica lags by approximately 60 seconds.
Meaning: when a user places an order at 8:47:00 PM,
that order is visible in the replica at roughly
8:48:00 PM. For most analytical purposes this is
totally fine. For a "live operations" dashboard
needing sub-60-second freshness, it's borderline.
────────────────────────────────────────────────</div>

<p><strong>Here are the tables you can query in the replica.</strong> These are the complete schemas: every column you have available is listed here.</p>

<p><strong>Table: <code>users</code></strong></p>

<pre><code>user_id        VARCHAR     -- primary key, e.g. "usr_9921"
name           VARCHAR
phone          VARCHAR     -- format: "+91XXXXXXXXXX"
email          VARCHAR
city           VARCHAR     -- e.g. "Coimbatore", "Bangalore"
signup_date    DATE
signup_source  VARCHAR     -- "organic", "referral", "ad_campaign"</code></pre>

<p><strong>Table: <code>restaurants</code></strong></p>

<pre><code>restaurant_id  VARCHAR     -- primary key, e.g. "rst_441"
name           VARCHAR
city           VARCHAR
cuisine_type   VARCHAR     -- e.g. "South Indian", "North Indian", "Chinese"
is_active      BOOLEAN     -- true if currently accepting orders</code></pre>

<p><strong>Table: <code>orders</code></strong> (this is the central table, read it carefully)</p>

<pre><code>order_id       VARCHAR     -- primary key, e.g. "ord_55431"
user_id        VARCHAR     -- foreign key → users.user_id
restaurant_id  VARCHAR     -- foreign key → restaurants.restaurant_id
placed_at      TIMESTAMP   -- when the user tapped "Place Order"
accepted_at    TIMESTAMP   -- when restaurant accepted (NULL if not yet)
picked_up_at   TIMESTAMP   -- when rider picked up (NULL if not yet)
delivered_at   TIMESTAMP   -- when rider delivered (NULL if not delivered)
cancelled_at   TIMESTAMP   -- when order was cancelled (NULL if not cancelled)
status         VARCHAR     -- see allowed values below
total_amount   DECIMAL(10,2)  -- in INR, what the customer paid
                              -- includes delivery fee and tax
                              -- excludes platform-side promo discount</code></pre>

<div class="board">────────────────────────────────────────────────
VOCABULARY: Foreign key

A column in one table that points to a row in another
table. Above, orders.user_id is a foreign key because
it contains a user_id that should also exist in the
users table.

This means: every order belongs to a user, and you
can JOIN orders to users via user_id to get the
user's details for that order.

Foreign keys are how relational databases connect
data across tables without storing it all in one
giant flat table.
────────────────────────────────────────────────</div>

<p><strong>The status column can only have these values</strong> (this is enforced in the database):</p>

<pre><code>'placed'                    -- user placed, restaurant hasn't accepted yet
'accepted'                  -- restaurant accepted, food being prepared
'picked_up'                 -- rider has the food
'delivered'                 -- order completed successfully
'cancelled_before_accept'   -- cancelled before restaurant accepted
'cancelled_after_accept'    -- cancelled after restaurant accepted</code></pre>

<p><strong>An order is "in flight"</strong> if its status is <code>placed</code>, <code>accepted</code>, or <code>picked_up</code>: meaning food is in motion through the system but not yet delivered or cancelled.</p>

<p><strong>Two things to remember about this source:</strong></p>

<ol>
  <li>You're <strong>not allowed to read from the live production database directly.</strong> The backend team will not let you. Always go through the replica.</li>
  <li>The backend team controls the schema. If they rename a column tomorrow, they don't have to tell you first. <em>(Yes, this is annoying. Yes, it's also reality. Day 3 talked about why this is dangerous: schema drift.)</em></li>

<h3>What data exists, Source B: Mobile app event stream (Kafka)</h3>

<p>Every time a user does something in the Tahini app, the app sends an event to a system called Kafka. (Kafka is a tool for moving streams of events between systems. We'll learn it properly in Phase 10. For today, just think of it as "a pipe that constantly carries event messages.")</p>

<p>You can subscribe to this stream and receive events as they happen, in real time: typically within a few hundred milliseconds.</p>

<p><strong>Event types that exist on the stream</strong> (these are the only ones, the mobile team has documented them):</p>

<pre><code>app_opened           -- user opened the app
search_performed     -- user searched for something
restaurant_viewed    -- user viewed a restaurant's page
item_added_to_cart   -- user added an item to cart
order_placed         -- user completed checkout
order_accepted       -- restaurant accepted the order
order_picked_up      -- rider picked up the order
order_delivered      -- rider delivered the order
order_cancelled      -- order was cancelled (by user, restaurant, or system)</code></pre>

<p>The events you care about for this lab are the order lifecycle events. Here's what each one looks like:</p>

<pre><code>// order_placed event:

  "restaurant_id": "rst_441",
  "total_amount": 487.00,
  "city": "Coimbatore",
  "timestamp": "2025-01-15T20:47:33+05:30"

  "event_type": "order_accepted",

<p><strong>Important relationship:</strong> the Postgres orders table and the Kafka events both describe the same orders; the Kafka events are emitted in real time as things happen, and the Postgres orders table reflects the latest state (which is what the events are updating). They are two views of the same underlying reality, with different freshness and shape.</p>

<h3>Who needs the data, Consumer 1: The CEO's morning email</h3>

<p>Every morning at 8:30am IST, the CEO opens his email and reads a one-page summary of yesterday's Coimbatore pilot. <strong>"Yesterday" means: the previous calendar day in IST, midnight to midnight.</strong></p>

<p>The email contains four numbers:</p>

<p><strong>Number 1: Total orders placed yesterday.</strong></p>

<p>Plain count of orders that were placed yesterday, regardless of whether they were eventually delivered or cancelled.</p>

<div class="board">────────────────────────────────────────────────
The SQL would look roughly like:

SELECT COUNT(*) AS total_orders
FROM orders
WHERE DATE(placed_at AT TIME ZONE 'Asia/Kolkata') = '2025-01-15'
  AND restaurant_id IN (SELECT restaurant_id
                        FROM restaurants
                        WHERE city = 'Coimbatore');

Note: this counts orders that were PLACED yesterday,
not delivered yesterday. Orders placed at 11:55 PM that
deliver at 12:30 AM today still count as yesterday's orders
in this metric. Match your business's definition.
────────────────────────────────────────────────</div>

<p><strong>Number 2: GMV (Gross Merchandise Value) yesterday.</strong></p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: GMV (Gross Merchandise Value)

The total rupee value of all NON-CANCELLED orders
placed on the platform during a time period.

For Tahini, the calculation is:

SELECT SUM(total_amount) AS gmv_inr
FROM orders
WHERE DATE(placed_at AT TIME ZONE 'Asia/Kolkata') = '2025-01-15'
  AND status != 'cancelled_before_accept'
  AND status != 'cancelled_after_accept'
  AND restaurant_id IN (SELECT restaurant_id
                        FROM restaurants
                        WHERE city = 'Coimbatore');

So if 200 orders were placed yesterday at an average
of ₹350 each, and 12 of them got cancelled, your GMV
is roughly 188 × ₹350 = ₹65,800.

The word "gross" matters - it means before subtracting
the platform's commission, refunds, or discounts.
It's the total flow of money on the platform, not
the platform's revenue.

People often confuse the two. GMV is the bigger number.
Revenue (what Tahini actually earns) is GMV times the
commission rate, minus costs.

You'll use this number a lot. Memorize it.
────────────────────────────────────────────────</div>

<p><strong>Number 3: Average delivery time for orders delivered yesterday.</strong></p>

<p>This is the time between when a user placed an order and when it was delivered. It uses two columns from the orders table: <code>placed_at</code> and <code>delivered_at</code>.</p>

<div class="board">────────────────────────────────────────────────
The SQL would look roughly like:

SELECT AVG(EXTRACT(EPOCH FROM (delivered_at - placed_at)) / 60)
       AS avg_delivery_minutes
FROM orders
WHERE status = 'delivered'
  AND DATE(delivered_at AT TIME ZONE 'Asia/Kolkata') = '2025-01-15'
  AND restaurant_id IN (SELECT restaurant_id
                        FROM restaurants
                        WHERE city = 'Coimbatore');

Note: this filters by delivered_at (when delivery
happened), not placed_at. We want yesterday's
COMPLETED deliveries, not yesterday's PLACED orders
that may have delivered today.

These are different cuts of the data. Choose explicitly.
────────────────────────────────────────────────</div>

<p><strong>Number 4: Cancellation rate yesterday.</strong></p>

<p>The percentage of yesterday's placed orders that ended up cancelled.</p>

<div class="board">────────────────────────────────────────────────
The SQL would look roughly like:

SELECT
  100.0 * COUNT(CASE WHEN status LIKE 'cancelled%' THEN 1 END)
        / COUNT(*) AS cancellation_rate_pct
FROM orders
WHERE DATE(placed_at AT TIME ZONE 'Asia/Kolkata') = '2025-01-15'
  AND restaurant_id IN (SELECT restaurant_id
                        FROM restaurants
                        WHERE city = 'Coimbatore');

So if 200 orders were placed and 12 cancelled,
cancellation rate = 12/200 × 100 = 6%.
────────────────────────────────────────────────</div>

<p><strong>Latency requirement for the CEO email:</strong> yesterday's complete data must be ready by 8am IST. He reads it at 8:30. If the email shows up at 9, he's already in his first meeting and missed it.</p>

<p><strong>Why I'm showing you SQL even though we haven't covered SQL yet:</strong> You don't need to write this SQL. You won't be tested on it. I'm showing it because it makes the metric definitions <em>concrete</em>: "GMV" stops being a vocabulary word and becomes a specific calculation against specific columns. Skim the SQL. The shape of the calculation is what matters. You'll learn SQL deeply in Phase 2.</p>

<p><strong>Display 1: Orders currently in flight.</strong></p>

<p>A live count of Coimbatore orders with status in (<code>placed</code>, <code>accepted</code>, <code>picked_up</code>). Updates as events arrive, when an <code>order_placed</code> event fires, the count goes up; when <code>order_delivered</code> or <code>order_cancelled</code> fires, the count goes down.</p>

<p><strong>Display 2: Orders placed in the last 10 minutes.</strong></p>

<p>A live count of <code>order_placed</code> events received from Coimbatore in the last 10 minutes (rolling window).</p>

<p><strong>Latency requirement for Lakshmi's dashboard:</strong> 60 seconds. If something happened 30 seconds ago, she needs to see it. If the dashboard is showing data from 5 minutes ago, it's useless to her: by the time she reacts, the rush is over.</p>

<p><strong>Important constraint for Lakshmi's dashboard:</strong> Remember the Postgres replica lags by ~60 seconds. Even if you wanted to query the replica every second, you'd be reading stale data. That's a strong hint about which source you should use for this consumer. (You'll think about this in Decision 1.)</p>

<h3>That's the whole scenario</h3>

<p>Two sources. Two consumers. That's it.</p>

<p>I deliberately stripped this down from what a real Tahini would have. Real Tahini would have payment systems, a separate rider tracking system, customer support, a logistics partner, multiple cities running in parallel, and more. We'll add those in later labs. For today, two sources and two consumers is enough to make every important decision you need to make.</p>

<ul>

  <li><strong>Source B:</strong> Kafka event stream with the 9 event types listed above. Events arrive in real time. You subscribe.</li>
  <li><strong>Consumer 1:</strong> CEO email with 4 metrics, ready by 8am IST.</li>
  <li><strong>Consumer 2:</strong> Lakshmi's dashboard, 2 displays, 60-second freshness.</li>
</ul>

<h2><span class="num">Part Two</span>Decision 1: How do you get the data in?</h2>

<p>This is your first design decision. It's an <strong>ingestion</strong> decision: Stage 1 of the lifecycle from Day 3.</p>

<p>You have two sources. For each one, you need to decide <em>how</em> the data moves from the source into your control.</p>

<p>Remember the 2×2 from Day 3:</p>

<div class="board">                         INITIATION
                  Pull ←──────────────→ Push
                   │                     │
       Batch  ─────┼──── (1) ────── (2) ─┼──── Batch
   GRANULARITY     │                     │
   Streaming ─────┼──── (3) ────── (4) ─┼──── Streaming
                   │                     │

(1) Pull + Batch       - you ask, in chunks ("give me yesterday's rows")
(2) Push + Batch       - they send, in chunks ("here's a daily file")
(3) Pull + Streaming   - you poll, continuously ("any new events?")
(4) Push + Streaming   - they send, event-by-event ("order placed!")</div>

<h3>The question</h3>

<p>For each of your two sources, which quadrant does ingestion belong in?</p>

<ul>
  <li>Source A (Postgres replica with users, restaurants, orders tables): <em>pull or push? batch or streaming?</em></li>
  <li>Source B (Kafka event stream): <em>pull or push? batch or streaming?</em></li>
</ul>

<h3>How to think about it</h3>

<p>Start with the easy question: <strong>who initiates the transfer?</strong></p>

<p>For Source A, the backend team has given you a read replica and said "go query it." They are not going to push anything to you. So <strong>you</strong> have to initiate, that means <strong>pull</strong>.</p>

<p>For Source B, Kafka <em>is</em> a push system by design. Events arrive at the Kafka topic as users do things in the app. You subscribe and receive them. That means <strong>push</strong>.</p>

<p>Now the harder question: <strong>batch or streaming?</strong></p>

<p>This is where you have to think about the <em>consumers</em>, not the source. Day 3's most important sentence:</p>

<p class="pull">How fresh does this data need to be for the consumer who depends on it?</p>

<p>So ask yourself: <em>what's the freshest data we need from each source?</em></p>

<p>From Source A (Postgres): the CEO needs yesterday's complete picture by 8am. That's a daily requirement. You don't need to query Postgres every second. You can query it once a day, maybe a few times a day, and have plenty of headroom. <em>Also remember: the replica lags by 60 seconds, so it's not even capable of giving you truly live data even if you queried it every second.</em></p>

<p>From Source B (Kafka): Lakshmi needs to see orders that just happened, with a latency budget of 60 seconds. You need to consume those events as they arrive. You cannot wait for nightly batch.</p>

<h3>Checkpoint, before reading my answer</h3>

<p>Write down your answer for each source:</p>

<ul>
  <li>Source A: ____ + ____, because ____</li>
  <li>Source B: ____ + ____, because ____</li>
</ul>

<p>If your "because" is one sentence, good. If it's just "because that's what the source supports," go back: that's not a reason, that's a constraint. The reason is always grounded in the consumer.</p>

<h3>How I would have answered</h3>

<p><strong>Source A: Pull + Batch (Quadrant 1).</strong> We initiate (the backend gave us a replica, said go query it). We pull in chunks: once a night, or maybe once an hour to give ourselves backup if a single run fails. The reason is the consumer: the CEO needs yesterday's data by 8am, and the growth team eventually wants nightly snapshots. No consumer needs sub-hour freshness from these tables, so we choose batch.</p>

<p>If I want to be careful, I'd run it hourly instead of nightly. Why? Because if the 2am run fails, I have until 7am to retry before the CEO email needs to go out. With hourly runs, I have multiple chances to catch up. With one nightly run, one failure means a missed email. <em>Engineering for failure is a free upgrade: same data, more reliability.</em></p>

<p><strong>Source B: Push + Streaming (Quadrant 4).</strong> The Kafka stream pushes events to us as they happen. We need them as they happen because Lakshmi's dashboard requires 60-second latency. No way to meet that with batch. Streaming is the only valid answer.</p>

<p>One thing to engineer for: the mobile team controls the event schema. Day 3 told us that schema drift is a silent killer. So our streaming consumer needs to <em>validate</em> events as they arrive, if an event shows up with an unexpected shape, we don't crash, but we also don't pretend it didn't happen. We log it, route it somewhere safe (a "quarantine" area), and alert. We'll come back to this in Decision 3.</p>

<h3>Checkpoint: common traps</h3>

<p>If your answer was different, that's okay, but check whether you fell into one of these:</p>

<p><strong>Trap 1: "Streaming sounds modern, let's stream everything."</strong> If you picked streaming for both sources, ask yourself: why? Does the CEO really need second-by-second data for his morning email? No. Streaming is more expensive to build and operate. Use it only where the consumer forces you to.</p>

<p><strong>Trap 2: "Batch is simpler, let's batch everything."</strong> If you picked batch for both, you've accepted that Lakshmi's dashboard will be useless. You can't meet 60-second latency with nightly batch jobs.</p>

<p><strong>Trap 3: "I picked pull for Kafka."</strong> Kafka is fundamentally a push system. You <em>subscribe</em>, events <em>arrive</em>. You don't poll Kafka the way you'd poll an HTTP API. If you wrote "pull" for Source B, re-read the Day 3 section on push vs pull.</p>

<p><strong>Trap 4: "I picked Postgres for Lakshmi's dashboard because it has the order status."</strong> Tempting (the Postgres orders table does have status). But the replica lags by 60 seconds, and even queries against it take time. By the time Lakshmi sees the data, it's already 2-3 minutes old. The Kafka stream is faster <em>and</em> gives you the event-by-event reactivity her dashboard needs.</p>

<hr>

<h2><span class="num">Part Three</span>Decision 2, Where do you store it once it arrives?</h2>

<p>You've ingested. Now where does the data go?</p>

<p>This is a <strong>storage</strong> decision: Stage 2 of the lifecycle.</p>

<p>From Day 3: storage is not one thing. It's layered. Different layers serve different purposes. The most common mistake students make on this exact lab is drawing one box and labeling it "the database." That's wrong.</p>

<h3>The question</h3>

<p>How many storage layers do you need, and what lives in each one?</p>

<h3>How to think about it</h3>

<p>Day 3 gave you a default starting point: <strong>raw layer + warehouse layer</strong>, minimum. Let's see if that's enough for Tahini.</p>

<p><strong>Why a raw layer?</strong> Because:</p>

<ol>
  <li>Your transformation code will be wrong. Not might be: <em>will</em> be. You'll find bugs months later. You need the original data to recompute.</li>
  <li>Business definitions change. Finance will redefine GMV at some point (maybe they'll decide to exclude delivery fees from the calculation). You need original data to recompute history.</li>
  <li>You don't want to be re-pulling from the backend's Postgres every time you want to fix something. Pull once, store once, transform many times.</li>
</ol>

<p>The raw layer stores data <em>exactly as it arrived</em>. JSON events as JSON. Postgres rows as Parquet files with the same shape as the source tables. Nothing changed. No business logic applied. Just "we received this thing, here it is."</p>

<p>In practice, the raw layer is files in an object store: S3 on AWS, GCS on Google Cloud, Azure Blob on Azure. We'll learn the AWS specifics in Phase 6. For today: <strong>"raw layer = a bucket of files organized by source and date."</strong></p>

<p><strong>Why a warehouse layer?</strong> Because:</p>

<ol>
  <li>The raw layer is hard to query. Files of JSON in S3 are not where analysts go to write SQL.</li>
  <li>The warehouse is where data becomes <em>queryable, typed, joined, and trusted</em>.</li>
  <li>The warehouse is where the CEO's email pipeline reads from. It's where the growth team will run their A/B tests from in the future.</li>
</ol>

<p>The warehouse is a system like Snowflake or BigQuery: we'll learn Snowflake properly in Phase 7. For today: <strong>"warehouse = a database optimized for analytical queries, where data is clean, typed, and reliable."</strong></p>

<h3>But wait: what about Lakshmi's dashboard?</h3>

<p>Here's where it gets interesting. Lakshmi needs 60-second latency. Can the warehouse give her that?</p>

<p>The honest answer: not really. Warehouses are optimized for big analytical queries over historical data. They're not great at "tell me what's happening right now." A warehouse might take 10-30 seconds just to plan a query, plus the time for your streaming pipeline to load the data into it. By the time her dashboard refreshes, the data is already 2-3 minutes old. That blows her latency budget.</p>

<p>So for Lakshmi, you need a <em>different</em> kind of storage. Something fast. Something that holds "what's happening right now", not historical patterns.</p>

<p>The tool category here is called a <strong>real-time store</strong> or <strong>in-memory database</strong>. The most common one is called Redis. (We'll learn it in Phase 10: for today just know it as "a fast database that holds small amounts of data in memory.")</p>

<p>So our answer is <strong>three storage layers</strong>, not two:</p>

<ol>
  <li><strong>Raw layer</strong> (S3): everything that arrives, untouched.</li>
  <li><strong>Warehouse layer</strong> (Snowflake): clean, typed, joined, ready for analytical queries.</li>
  <li><strong>Real-time layer</strong> (Redis): small, fast, holds "current state" for Lakshmi's dashboard.</li>
</ol>

<h3>Checkpoint, before reading my answer</h3>

  <li>How long do we keep it?</li>
</ul>

<h3>How I would have answered</h3>

<p><strong>Layer 1: Raw (S3).</strong> Every event from Kafka written to S3 as a JSON file, organized as <code>s3://tahini-raw/kafka/year=2025/month=01/day=15/hour=20/event_xxx.json</code>. Every Postgres pull saved as Parquet files, organized as <code>s3://tahini-raw/postgres/orders/year=2025/month=01/day=15/extract.parquet</code>. Schema-on-read. Append-only. Retention: indefinitely (we'll decide when to delete things later: for now, storage is cheap, mistakes are expensive).</p>

<p><strong>Layer 2: Warehouse (Snowflake).</strong> The raw data, after cleaning and validation, lands here as proper tables: <code>orders</code>, <code>users</code>, <code>restaurants</code>, <code>app_events</code>. Schema-on-write: every column has a type, nulls are explicit, bad rows are rejected and routed to a quarantine table. <em>This is the trust boundary.</em> Data in Snowflake is data we'll let the CEO's email read from.</p>

<p><strong>Layer 3: Real-time store (Redis).</strong> A small, fast cache holding "the current state of Coimbatore orders." Specifically:</p>

<ul>
  <li>A set of order_ids currently in flight (updated when order_placed/accepted/picked_up arrives, removed when order_delivered/cancelled arrives)</li>
  <li>A rolling counter of order_placed events in the last 10 minutes</li>
</ul>

<p>The streaming pipeline updates these as events arrive. Lakshmi's dashboard reads from here. Sub-100-millisecond response time.</p>

<p>Critical point: <strong>Layer 3 does not go through Layer 2.</strong> Data goes Kafka → streaming pipeline → Redis, bypassing the warehouse entirely. If you tried to route through the warehouse, you'd blow the latency budget. The warehouse is for "what happened" questions; the real-time store is for "what is happening" questions.</p>

<h3>Checkpoint: common traps</h3>

<p><strong>Trap 1: "One database for everything."</strong> If you drew one storage box, you collapsed three completely different requirements into one system. No single system serves "historical analytics," "raw event archive," and "live operational dashboard" well.</p>

<p><strong>Trap 2: "Route everything through the warehouse."</strong> If you drew Kafka → Snowflake → Redis → dashboard, you've added latency you can't afford. Streaming consumers can write directly to fast stores. They don't have to go through the warehouse first.</p>

<p><strong>Trap 3: "Forgetting the raw layer because we have the warehouse."</strong> Tempting, because the warehouse <em>is</em> queryable. But warehouses change. Tables get dropped, schemas evolve, business logic changes. The raw layer is your insurance policy. Always keep it.</p>

<h2><span class="num">Part Four</span>Decision 3: How do you make the data trustworthy?</h2>

<p>You've ingested. You've stored. Now we get to the most important question of the lab:</p>

<p><strong>How do you make sure the data is correct before the CEO sees it?</strong></p>

<p>This is the <strong>processing</strong> stage and specifically the <strong>schema enforcement</strong> question from Day 3.</p>

<h3>Why this matters</h3>

<p>Day 3 told you a story about a fintech company that lost seven figures because a field rename caused NULLs to flow through their pipeline silently. Let me give you the Tahini-specific version of this risk.</p>

<p>Imagine: tomorrow morning, the mobile team renames the <code>total_amount</code> field in <code>order_placed</code> events to <code>order_total_inr</code>. They don't tell you. They never do.</p>

<p>What happens to your pipeline?</p>

<p>If you didn't build for this: your streaming consumer doesn't crash (JSON is flexible, missing fields are allowed). The event gets written to the raw layer with the new field name. The processing step that loads into the warehouse looks for <code>total_amount</code>, doesn't find it, writes NULL. Tomorrow's CEO email runs. GMV comes out as ₹0 (because SUM of NULL is NULL). The CEO calls the head of data. The head of data calls you. You start investigating at 9am for something that has been broken for 12 hours.</p>

<p>This is not hypothetical. This happens to real data engineers every month.</p>

<h3>The question</h3>

<p>Where in your pipeline do you check that the data has the shape you expect? And what do you do when it doesn't?</p>

<h3>How to think about it</h3>

<p>Day 3 gave you the concept: <strong>schema-on-read becomes schema-on-write somewhere</strong>. That "somewhere" is your trust boundary. Everything before it is "we'll take whatever arrives." Everything after it is "we've verified this is what we expected."</p>

<p>The natural place for that boundary in Tahini is <strong>between the raw layer and the warehouse.</strong></p>

<p>The raw layer accepts whatever comes (schema-on-read: we're flexible, we don't reject anything, we capture everything for insurance). The warehouse demands proper shape (schema-on-write: we have defined tables with defined columns, anything that doesn't match the schema gets rejected).</p>

<p>So your processing step (the code that reads from the raw layer and writes to the warehouse) is where validation lives.</p>

<h3>What validation actually looks like</h3>

<p>For every record you load into the warehouse, your processing code should answer:</p>

<ol>
  <li>Does this record have all the fields the warehouse table expects? (For an order_placed event: order_id, user_id, restaurant_id, total_amount, timestamp, city.)</li>
  <li>Are the field types correct? (Is total_amount a number? Is timestamp a valid timestamp?)</li>
  <li>Are the required fields non-null?</li>
  <li>Do foreign keys resolve? (Does the user_id appear in the users table? Does the restaurant_id appear in the restaurants table?)</li>
  <li>Are the values in expected ranges? (Is total_amount > 0? Is the status a valid enum value?)</li>
</ol>

<p>If any of those checks fail, you have three choices for what to do:</p>

<p><strong>Choice A: Crash the whole pipeline.</strong> If even one record is bad, stop everything. This is too aggressive for most cases: one malformed event shouldn't break the whole evening's data.</p>

<p><strong>Choice B: Silently drop the bad record and continue.</strong> Tempting, because it keeps the pipeline running. But this is exactly how the fintech disaster happened. <em>Silent drops are how you lose seven figures.</em></p>

<p><strong>Choice C: Route the bad record to a "quarantine" table and continue.</strong> The good records flow to the warehouse normally. The bad records get logged with the reason they failed validation. An alert fires when the quarantine count crosses a threshold. This is the right answer.</p>

<h3>Checkpoint, before reading my answer</h3>

<p>Write down:</p>

<ul>
  <li>Where in your pipeline is the trust boundary?</li>
  <li>What does your validation check?</li>
  <li>What happens to a bad record?</li>
  <li>Who finds out that a bad record happened, and how?</li>
</ul>

<h3>How I would have answered</h3>

<p><strong>Trust boundary: between the raw layer and the warehouse.</strong> The streaming consumer that writes to Redis also writes to the raw S3 layer (that's our archive of everything we received). A separate, scheduled processing job reads from the raw layer, validates, and writes to the warehouse.</p>

<p><strong>Validation checks, per record (for order_placed events):</strong></p>

<ul>
  <li>Required fields are present (order_id, user_id, restaurant_id, total_amount, timestamp, city)</li>
  <li>Field types are correct (timestamps parse as timestamps, amounts are numbers, IDs are strings)</li>
  <li>Foreign keys exist (user_id appears in the users table; restaurant_id appears in the restaurants table)</li>
  <li>Numeric fields are in valid ranges (total_amount > 0, not absurdly high like ₹10,00,000)</li>
  <li>Enum fields are valid values (status is one of the six allowed values from our schema)</li>
</ul>

<p><strong>If a record fails:</strong> it's written to a <code>quarantine_orders</code> table in the warehouse with three extra columns: <code>rejection_reason</code> (what failed), <code>rejected_at</code> (when), and <code>raw_payload</code> (the original record so we can debug). Good records continue to the proper <code>orders</code> table.</p>

<p><strong>Who finds out:</strong> a separate monitoring job runs every hour and counts the rejection rate per source. If more than 1% of records are failing, it sends an alert to me (the on-call data engineer): message to Slack, email, and an SMS if it's overnight. <em>The whole point of quarantine is that someone notices. Silent rejection is just a slower version of silent drop.</em></p>

<h3>Checkpoint: common traps</h3>

<p><strong>Trap 1: "We'll add validation later, after we ship v1."</strong> Don't. Validation is not a nice-to-have. The day you ship without validation is the day your seven-figure quote starts ticking.</p>

<p><strong>Trap 2: "We'll just LOG bad records and move on."</strong> Logging means writing to log files. Nobody reads log files unless they already know something is wrong. Alerts are different: alerts get pushed to you. Quarantine + alerts, not just logs.</p>

<p><strong>Trap 3: "We'll validate after loading to the warehouse."</strong> Too late. Once bad data is in the warehouse, the CEO's email pipeline has already read it. Validation must happen <em>before</em> the data crosses into the trusted layer.</p>

<h2><span class="num">Part Six</span>If you got stuck</h2>

<p>If you sat down to do this and got stuck, here's the most common stuck-points and how to unstick yourself.</p>

<p><strong>"I don't know what tools to use."</strong> You don't need to. The decisions in this lab are about <em>patterns</em>, not tools. You said "pull + batch": you didn't say "Python script using SQLAlchemy hitting a Postgres read replica with a hash-based watermark." Specific tools come later. For Day 4, "pull + batch" is the answer.</p>

<p><strong>"I don't understand why we need three storage layers: isn't one enough?"</strong> Re-read Decision 2. The reason is that the three layers serve three different jobs: insurance (raw), trust (warehouse), speed (real-time). One layer cannot do all three. If you're not convinced, ask yourself: how would Lakshmi's dashboard get 60-second latency from S3? How would the CEO's GMV calculation tolerate corrupted data without a trusted warehouse layer?</p>

<p><strong>"I picked streaming for everything because it sounds more impressive."</strong> Go back to Decision 1. Streaming is more expensive to build, more expensive to operate, and more likely to wake you up at 3am. Use it only where the consumer's freshness requirement forces you to. Most consumers don't.</p>

<p><strong>"I picked Postgres for Lakshmi's dashboard because the status column has the info."</strong> The information is there, yes. But the path is wrong. The replica lags 60 seconds, query planning adds more time, and most importantly: Postgres-style "query every few seconds and count" is not how live dashboards are built. Live dashboards are built by maintaining a running count that updates as events flow through: push, not pull.</p>

<p><strong>"I made decisions but I'm not sure I'm right."</strong> Good. That feeling is correct. You won't know for certain whether your design holds up until you've built it, broken it, and rebuilt it. That's why we have 191 more days. Decisions made under uncertainty, then refined through feedback: that's the job.</p>

<p><strong>"The brief said the replica lags 60 seconds: does that matter for the CEO email?"</strong> No. The CEO needs yesterday's data by 8am. The replica is ~60 seconds behind real-time. By 2am, the replica has every order placed before 1:59am. Yesterday ended at midnight. The data is complete with hours to spare.</p>

<p><strong>"How do I know if my answer is right if I'm doing this alone?"</strong> Compare your answer to "How I would have answered." If your reasoning matches, you got it. If your conclusion matches but your reasoning is different, think about whether your reasoning would still work if the scenario changed. If your conclusion is different, read my reasoning and figure out which one of us is wrong (it might be me: I'm a teacher, not infallible).</p>

<p>Day 1 said: operational systems and analytical systems have incompatible requirements, so you separate them.</p>

<p>These are the same idea at different scales. The OLTP/OLAP split is between the <em>operational world</em> (backend's Postgres) and the <em>analytical world</em> (your warehouse). The raw/warehouse/real-time split is <em>within</em> the analytical world: the same principle of "different jobs require different storage" recursing one level deeper.</p>

<p>Once you see this pattern, you start seeing it everywhere. Different consumer needs require different infrastructure. There is no one storage system that serves all needs. Tools that promise to be everything for everyone usually end up being mediocre at all of it.</p>

<h3>Schema-on-read vs schema-on-write and the trust boundary are the same idea</h3>

<p>Day 1 introduced the three types of data: structured, semi-structured, unstructured.</p>

<p>Day 3 introduced schema-on-read and schema-on-write.</p>

<p>These connect: semi-structured data (JSON, events) is naturally schema-on-read. Structured data (warehouse tables) is naturally schema-on-write. The trust boundary is where you <em>force</em> the transition from one to the other. It's the moment you stop being flexible and start being strict.</p>

<p>This connection matters because it tells you <em>where</em> to put the trust boundary. It's always where semi-structured data is becoming structured data. In Tahini, that's S3 → Snowflake. In other architectures it might be Kafka → table format with Iceberg. The location varies; the principle is constant.</p>

<h3>Ownership and on-call and the diagram are the same idea</h3>

<p>Day 2 said: every system needs exactly one named human as its accountable owner.</p>

<p>Your diagram has many boxes. Every box needs an owner.</p>

<p>This is the connection: <em>your diagram is also an org chart</em>. When you design a system, you're also designing the on-call rotation. When you add a real-time store to support a new consumer, you're adding something someone has to wake up at 2am to fix. When you decide whether to build streaming or batch, you're deciding how often that someone gets woken up.</p>

<p>Senior engineers think about systems and humans together. Junior engineers draw boxes and forget who'll be paged. The shift from one to the other is mostly the habit of asking "who owns this?" for every component you add.</p>

<h3>The four roles and the consumer questions are the same idea</h3>

<p>Day 2 said: four roles, DE, DA, DS, MLE, each consuming data in different shapes.</p>

<p>Day 3's Part Six said: four consumer questions, "what happened" / "what is happening" / "what will happen" / "what should we do."</p>

<p>These map onto each other approximately:</p>

<ul>
  <li>Data Analyst → "what happened" (warehouse, BI tool, historical)</li>
  <li>Ops manager / live operator → "what is happening" (real-time store, live dashboard)</li>
  <li>Data Scientist → "what will happen" (warehouse + features, ML model)</li>
  <li>Marketing / sales / operations users → "what should we do" (reverse ETL, operational tools)</li>
</ul>

<p>The connection: each role exists because each question requires different infrastructure. You're not just serving four roles, you're answering four kinds of questions, each with its own freshness, shape, and latency requirements. The roles are downstream of the questions.</p>

<h2><span class="num">Opening</span>Two data teams, sixteen years apart</h2>

<p>Let me describe two data teams. Same kind of problem. Sixteen years between them. Almost nothing else in common.</p>

<h3>2010: a mid-size Indian e-commerce company</h3>

<p>The data team is six people. Their job is to produce reports for the CFO, the marketing director, and the head of operations. Every Monday morning, three reports go out. Revenue by category. Customer acquisition cost by channel. Inventory days-on-hand by warehouse.</p>

<p>How do they produce these reports? Like this:</p>

<p>An ETL job written in <strong>Informatica PowerCenter</strong> runs every night at 1am. (Informatica is an enterprise ETL tool. Big GUI. Drag-and-drop transformations. We won't go deep on it because you probably won't use it, but tens of thousands of Indian DEs still maintain Informatica jobs at TCS, Infosys, Wipro, and their clients. It exists.)</p>

<p>The job connects to the company's <strong>Oracle</strong> database: that's where the operational app's data lives. It runs SQL queries to extract last day's orders, customers, inventory. It pulls those records out, row by row, over the network, into a separate machine the data team owns: call it <strong>"the ETL server."</strong> This is a beefy physical box sitting in a rack in the company's data center. Maybe 32 cores, 128GB of RAM. Cost: around ₹15-20 lakh capital outlay, plus ongoing maintenance.</p>

<p>On that ETL server, Informatica transforms the data. It joins orders to customers. It looks up product categories. It applies business rules: "exclude returns," "tag VIP customers," "convert currencies." It aggregates the transformed records into daily summary tables. All of this happens in memory and intermediate disk on the ETL server.</p>

<p>Then (and only then) does Informatica push the final, transformed, ready-to-query summary tables into the data warehouse. The warehouse is also Oracle, on a separate server. The CFO's reports query this warehouse the next morning.</p>

<p>This whole chain takes 4-6 hours every night. If any step fails (Oracle connection drops, the ETL server runs out of memory, the warehouse load is slow) somebody gets paged. If the chain doesn't finish by 7am, the CFO doesn't get his report. That happens maybe once every two months.</p>

<p>When the marketing director wants to slice revenue a new way next quarter, the data team estimates 3 weeks of work. They have to: modify the Informatica job, deploy it, regression-test the existing reports, schedule a re-load of historical data. Everything takes time because everything happens on dedicated hardware that's expensive to provision and slow to change.</p>

<p>This is ETL. <em>Transform happens before Load.</em></p>

<h3>2026: a 4-year-old Indian fintech</h3>

<p>The data team is three people. Their job is to produce dashboards for the CEO, real-time fraud monitoring, and a daily compliance report.</p>

<p>How do they produce these? Like this:</p>

<p>An <strong>Airflow</strong> DAG runs hourly. (Airflow is a workflow orchestrator. It schedules and monitors data jobs. We'll cover it in Phase 11.) The DAG kicks off a small Python script. The script connects to the company's <strong>Postgres</strong> read replica (the operational app's database), runs a SELECT against the orders table for the last hour's changes, and writes the result as a <strong>Parquet</strong> file to <strong>S3</strong>.</p>

<p>That's it. Extract done. No transformation yet.</p>

<p>A separate DAG, a few minutes later, runs a <strong>Snowflake</strong> <code>COPY INTO</code> command. (Snowflake is a cloud data warehouse. We'll cover it in Phase 9.) The COPY pulls the Parquet file from S3 into a raw Snowflake table. The data lands typed but otherwise unchanged.</p>

<p>Load done.</p>

<p>Now transformation. The data team has a <strong>dbt</strong> project. (dbt is a SQL transformation tool. Phase 10.) The project has 40 SQL files. Each one is a SELECT statement that reads from upstream tables and produces a downstream table. A staging file types and renames columns. An intermediate file joins orders to customers. A mart file aggregates revenue by category by day. When the dbt project runs, it executes all 40 SELECTs in dependency order, materializing the results as tables inside Snowflake itself.</p>

<p>All the transformation happens inside the warehouse, in SQL, computed by Snowflake's own compute. The data team doesn't own any servers. They don't run any transformation engine on their own machines. They write SQL files and let the warehouse do the work.</p>

<p>When the marketing director wants a new slice ("show me revenue by category by channel by week") the data team writes one new dbt file, runs it, the new table appears in the warehouse, the dashboard adds the new chart. Total turnaround: 2 days. The change costs essentially nothing: no new hardware, no capacity planning, just one more SELECT statement and a few extra seconds of warehouse compute time when it runs.</p>

<p>This is ELT. <em>Load happens before Transform.</em></p>

<h3>What's different between these two teams</h3>

<p>Pause. Look at what changed.</p>

<p>Not just "tools modernized." Something deeper. The 2010 team owned hardware, ran transformations on their own machines, paid up front for capacity they might not use, and accepted that change was slow because change required redeploying machines. The 2026 team owns no hardware, runs transformations inside the warehouse (which they rent by the second), pays only for what they use, and changes things in days because changing things requires editing a SQL file.</p>

<p>The 2026 team can do more, with fewer people, for less money, with faster turnaround.</p>

<p class="pull">The order of operations changed: Extract, then Transform, then Load became Extract, then Load, then Transform. And once you understand <em>why</em> that order changed, you understand why everything else about the modern data engineering profession looks the way it does.</p>

<p>That's what today is about.</p>

<h2><span class="num">Part One</span>What ETL actually was, mechanically</h2>

<p>Let me make ETL concrete, because if you've only read about it on Wikipedia you might think it was just "moving data around." It was more specific than that, and the specifics matter.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: ETL

ETL stands for Extract, Transform, Load - in that order.

The defining property is the ORDER:
  1. Extract data from source systems
  2. Transform the data (clean, join, aggregate) on a
     separate machine called the ETL server
  3. Load the finished, transformed data into the data
     warehouse

The transformation happens BEFORE data enters the
warehouse. The warehouse only ever receives clean,
ready-to-query data.

In the 2010s and earlier, ETL was the default. Almost
every enterprise data team did things this way.
────────────────────────────────────────────────</div>

<h3>The three pieces of an ETL job</h3>

<p>An ETL job had three components, often built and maintained as separate code blocks:</p>

<p><strong>1. Extract code.</strong> Connects to a source. Pulls records. Examples:</p>

<ul>
  <li>SQL query against Oracle: <code>SELECT * FROM orders WHERE created_at &gt;= TRUNC(SYSDATE) - 1</code></li>
  <li>FTP download of a daily file from a vendor</li>
  <li>API call to a SaaS tool</li>
</ul>

<p><strong>2. Transform code.</strong> Runs on the ETL server. Takes the extracted data and shapes it. Examples:</p>

<ul>
  <li>Join orders to customers (lookup customer name and segment)</li>
  <li>Filter out cancelled orders</li>
  <li>Convert currencies to a single base (INR)</li>
  <li>Aggregate to a daily grain</li>
  <li>Apply business logic ("VIP if lifetime_value &gt; 50000")</li>
</ul>

<p><strong>3. Load code.</strong> Inserts the transformed data into the warehouse. Examples:</p>

<ul>
  <li><code>INSERT INTO fact_daily_orders SELECT * FROM staging_orders</code></li>
  <li>Truncate-and-reload of summary tables</li>
  <li>SCD-style updates of dimension tables (we'll cover SCDs in Phase 2)</li>
</ul>

<h3>The ETL server: what it was and why it had to exist</h3>

<p>The middle piece is the most important to understand. <strong>The ETL server was a real, separate machine</strong> (or a small cluster of machines) that the data team owned.</p>

<p>Why a separate machine? Because the transformation work was expensive. Joining millions of records, aggregating them, applying business logic: that's CPU and RAM. You couldn't do it on the source database (you'd slow down the production app: exactly the Day 1 OLTP/OLAP problem). You couldn't do it on the destination warehouse (in 2010, warehouses were expensive single-server boxes and storage was so costly you didn't want to load raw data into them only to throw most of it away). So you put it in the middle, on a dedicated transformation server.</p>

<p>The tools that ran on that server had names you'll see in legacy environments:</p>

<ul>
  <li><strong>Informatica PowerCenter</strong>: enterprise standard. GUI-driven. Still running at huge scale at major Indian service companies.</li>
  <li><strong>IBM DataStage</strong>: IBM's equivalent, common in banking and insurance.</li>
  <li><strong>Microsoft SQL Server Integration Services (SSIS)</strong>: common in Microsoft shops.</li>
  <li><strong>Talend</strong>: open-source ETL with an enterprise edition.</li>
  <li><strong>Custom Python or Java jobs</strong>: for teams that didn't want to pay for tools.</li>
</ul>

<p>These tools were built for the ETL workflow. They have visual designers, complex GUI-based transformation editors, scheduling, monitoring, error handling. They're powerful. They're also <em>locked in to the ETL paradigm</em>, which is why they've struggled to adapt to the modern era.</p>

<h3>What ETL cost</h3>

<p>This is the part most courses skip. Let me give you the real costs of running ETL at scale.</p>

<p><strong>Hardware cost.</strong> The ETL server was capital expenditure. ₹15-20 lakh for a moderately-sized box, plus ₹3-5 lakh per year for the warehouse hardware, plus support contracts. For a larger company, multiply by 3-5x. You're talking serious money locked into equipment.</p>

<p><strong>Software license cost.</strong> Informatica licenses ran ₹40-80 lakh per year for enterprise deployments. DataStage similar. SSIS came with SQL Server licenses but limited you to Microsoft stack.</p>

<p><strong>People cost.</strong> ETL tools required specialized skills. An "Informatica developer" was a distinct job title. Companies hired people whose entire career was knowing one ETL tool deeply. That meant tight labor markets and high salaries for narrow skills.</p>

<p><strong>Change cost: the worst one.</strong> When the marketing director wanted a new metric, the data team had to: modify the Informatica job in its GUI, test it locally, deploy it to dev, run regression tests, deploy to staging, get sign-off, deploy to prod, schedule a backfill. Two to three weeks per change wasn't unusual. The business slowly learned to ask the data team for less, because every ask was expensive.</p>

<p><strong>Failure cost.</strong> When the nightly ETL didn't finish by morning, the CFO didn't get his report. The data team came in to find a paged on-call engineer trying to figure out why memory ran out or why the network drop at 3am killed the connection. Reruns were slow because you had to re-extract everything.</p>

<h3>What ETL was good at</h3>

<p>I want to be fair. ETL wasn't a mistake. It was the right answer to the constraints of its era. It was good at:</p>

<ul>
  <li><strong>Clean warehouses.</strong> Because all transformation happened upstream, the warehouse only contained finished, blessed data. Analysts couldn't accidentally query "wrong" raw data because raw data was never there.</li>
  <li><strong>Strong governance.</strong> Every transformation was managed by a single team. Changes required process. PII transformations happened before data reached the warehouse, which simplified compliance.</li>
  <li><strong>Performance isolation.</strong> The warehouse was protected from the cost of transformation. Analysts had predictable query performance because the warehouse only stored summarized data.</li>
  <li><strong>Smaller warehouse footprint.</strong> Storage was expensive: you only kept what you needed. ETL filtered, aggregated, and discarded the rest.</li>
</ul>

<p>These were real advantages. They're worth understanding because some of them still matter for some teams. We'll come back to this.</p>

<hr>

<h2><span class="num">Part Two</span>The two things that changed</h2>

<p>ELT didn't replace ETL because someone wrote a better tool. ELT replaced ETL because two pieces of underlying infrastructure dropped in price by orders of magnitude. Once that happened, ELT became cheaper, faster, and operationally simpler than ETL. The shift was economic, not aesthetic.</p>

<p>Let me walk through the two shifts. They're worth understanding deeply because they explain the entire shape of the modern data stack.</p>

<h3>Shift One: cheap object storage</h3>

<p>In 2010, storage was expensive. A SAN (Storage Area Network) (the kind of enterprise storage attached to your data warehouse) cost roughly ₹15-25 per GB per month for usable, replicated, backed-up storage. Multiply that by a few hundred terabytes and you're paying lakhs per month just to hold data.</p>

<p>Storage being expensive meant: you didn't keep raw data. You couldn't afford to. You transformed it, kept only the summarized version, and discarded the rest.</p>

<p>Then Amazon launched <strong>S3</strong> in 2006. S3 is <em>object storage</em>: a different kind of storage from traditional disks. It's distributed across many servers, designed for huge scale, accessible over HTTP, and (critically) priced per GB consumed rather than per GB provisioned.</p>

<p>S3's price has dropped continuously since launch. Today, S3's standard tier is around ₹2 per GB per month, and cold-tier storage (data you access rarely) is closer to ₹0.10 per GB per month. That's a roughly <strong>100-to-1000x drop in storage cost</strong> compared to enterprise SANs in 2010.</p>

<h4>A worked example of how much this changes things</h4>

<p>Let me make the numbers concrete because they matter. Suppose your company generates 10 TB of raw event data per year. (Realistic for a mid-size product company: a few hundred million events.)</p>

<p><strong>2010 economics on enterprise SAN at ₹20/GB/month:</strong> 10 TB × 1024 GB × ₹20 = ₹2,04,800 per month, or ₹24.6 lakh per year. To keep 5 years of history: ₹1.23 crore total. Nobody could justify this for "raw event data we might query someday." So you transformed it down to summaries and threw the rest away.</p>

<p><strong>2026 economics on S3 standard at ₹2/GB/month:</strong> 10 TB × 1024 GB × ₹2 = ₹20,480 per month, ₹2.46 lakh per year. Five years of history: ₹12.3 lakh total. Move year-old data to S3 Glacier at ₹0.30/GB/month and the same five-year footprint is closer to ₹6 lakh.</p>

<p>The cost dropped by roughly <strong>two orders of magnitude</strong>. What was a million-rupee decision became a tens-of-thousands decision. That's why "keep raw data forever" went from absurd to default.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: Object Storage

A type of storage that organizes data as discrete
"objects" (basically: files with metadata) inside
flat namespaces called "buckets" - instead of the
hierarchical file-systems-on-disks model.

Key properties:
  - Distributed across many servers, automatically
    replicated for durability (S3 advertises 99.999999999%
    durability - "eleven nines")
  - Accessed via HTTP API, not a file system mount
  - Pay only for what you store (no provisioning)
  - No native query capability - it just holds files

You don't run programs on object storage. You read
files from it and write files to it. Other systems
(query engines, compute clusters) read the files
and do work on them.

S3 is the dominant one. GCS (Google) and Azure Blob
are the equivalents on other clouds. The principle is
the same across all three.
────────────────────────────────────────────────</div>

<p>What did cheap object storage enable? <strong>Keeping raw data forever became affordable.</strong> Suddenly you could land every JSON event, every API response, every database snapshot, in S3, and just leave it there. The cost of "what if we need it later" went from prohibitive to negligible.</p>

<p>This single change ("raw data is now cheap to keep") is one of the two pillars of ELT. Because if you can afford to keep raw data, you can <em>load first, transform later</em>. You don't need to decide upstream what's worth keeping. You keep everything and decide what matters at query time.</p>

<h3>Shift Two: elastic warehouse compute</h3>

<p>The second shift was about <em>compute</em>, not storage. And it happened a few years after the storage shift.</p>

<p>In 2010, data warehouses were fixed-size machines. You bought a Teradata appliance or an Oracle Exadata box. It had a fixed number of CPU cores and a fixed amount of RAM. If your queries were too slow, you bought a bigger machine. If your queries were fast enough but the box was idle 80% of the time, you still paid for the whole machine 24/7. There was no concept of "scale up for the next 30 minutes then back down": you had what you had.</p>

<p>This had two consequences for ETL:</p>

<ol>
  <li>Warehouses couldn't run transformation work on top of their query workload. The warehouse was already at capacity serving analysts. You couldn't add transformation load to it.</li>
  <li>The economics didn't allow "load everything raw, transform on demand" because the warehouse compute was a fixed, finite, expensive resource.</li>
</ol>

<p>Then a new generation of warehouses appeared, starting around 2010-2014:</p>

<ul>
  <li><strong>Google BigQuery</strong>: launched 2010-2011. Compute provisioned per-query, billed per byte scanned.</li>
  <li><strong>Amazon Redshift</strong>: launched 2012. Cluster-based but cluster size could be changed.</li>
  <li><strong>Snowflake</strong>: launched 2014. <em>Completely separated storage from compute</em>. You could spin up a transformation cluster, do work, spin it down, and only pay for the time it was running.</li>
</ul>

<p>Snowflake's design was the cleanest expression of the shift. Storage lived in S3 (or equivalent). Compute was rented in chunks ("virtual warehouses") that could be created in seconds, sized up or down, and shut off when idle. <strong>You paid for storage and compute completely separately, each metered to your actual use.</strong></p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: Elastic Compute (in the warehouse context)

The ability to:
  - Spin up compute clusters in seconds
  - Size them up or down based on workload
  - Pay only for the time and size you actually use
  - Have multiple independent compute clusters reading
    from the same storage simultaneously

The "elastic" part means: the resource expands and
contracts with demand, automatically or on command,
billed by the second.

Why this matters: before elastic compute, transformation
work had to happen on dedicated hardware (the ETL server)
because the warehouse couldn't absorb the extra load.
With elastic compute, you can run transformation work
INSIDE the warehouse - just spin up a separate
compute cluster for it, do the work, spin it down.
────────────────────────────────────────────────</div>

<h3>The two shifts together</h3>

<p>Here's what made ELT possible, both shifts had to happen together:</p>

<p><strong>Cheap object storage</strong> meant you could afford to keep raw data forever. So you could load first, transform later.</p>

<p><strong>Elastic warehouse compute</strong> meant you could afford to run transformation work inside the warehouse, on demand, paying only for the time it ran. So you didn't need a dedicated ETL server anymore.</p>

<p>Together, these eliminated the two cost drivers that had made ETL economically rational. Storage was no longer the bottleneck (so you could keep raw). Compute was no longer a fixed-size resource you'd already paid for (so you could do transformation in the warehouse without buying separate hardware).</p>

<p>Once both shifts had matured (roughly 2015-2018) ELT became the new default. Not because it was more elegant, but because it was <em>cheaper, faster to change, and operationally simpler</em> for the new economic reality.</p>

<h2><span class="num">Part Three</span>ELT: what it actually is, mechanically</h2>

<p>Now let me make ELT concrete, the same way I made ETL concrete.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: ELT

ELT stands for Extract, Load, Transform - in that order.

The defining property is the ORDER:
  1. Extract data from source systems
  2. Load the raw data into the warehouse (or into
     cheap object storage that the warehouse can read)
  3. Transform the data INSIDE the warehouse using
     SQL, computed by the warehouse's own compute

The transformation happens AFTER data enters the
warehouse. The warehouse stores both raw and
transformed data.

In the 2020s, ELT is the default for new builds.
Most companies starting fresh choose ELT. Many
existing companies are migrating from ETL to ELT.
────────────────────────────────────────────────</div>

<h3>The three pieces of an ELT pipeline</h3>

<p>An ELT pipeline has the same three logical components (extract, load, transform), but they're shaped very differently from ETL:</p>

<p><strong>1. Extract.</strong> Same basic job as before: connect to source, pull data. But often simpler now, because the tooling is mature. Modern teams use:</p>

<ul>
  <li><strong>Fivetran, Airbyte, Stitch</strong>: managed ingestion tools. You configure a connector (source + destination + schedule), and the tool handles extraction, including schema inference and incremental sync. We won't go deep on these today but you'll see them in job postings.</li>
  <li><strong>Custom Python scripts</strong>: for sources without managed connectors, or when you need specific control. (Phase 6 covers this.)</li>
  <li><strong>CDC pipelines</strong>: for capturing database changes in real time (Phase 12).</li>
</ul>

<p><strong>2. Load.</strong> The extracted data lands in the warehouse: either directly or via a staging area in object storage (which the warehouse then ingests). The load step is intentionally <em>dumb</em>. It writes the raw data, typed but otherwise unchanged.</p>

<p>A typical Snowflake load looks like:</p>

<pre><code>-- Step 1: data lands in S3 as Parquet files
-- (this happened during extract)

-- Step 2: COPY into a raw table
COPY INTO raw.orders
FROM @s3_stage/orders/year=2025/month=01/day=15/
FILE_FORMAT = (TYPE = PARQUET)
ON_ERROR = 'ABORT_STATEMENT';

-- That's it. Data is now in the warehouse.
-- No business logic yet. No joins yet. No filtering.</code></pre>

<p><strong>3. Transform.</strong> This is where the action is. All the cleaning, joining, aggregating, business-logic application happens here, inside the warehouse, in SQL.</p>

<p>The dominant tool for this is <strong>dbt</strong>. dbt is a SQL-based transformation framework. You write SQL files (each defining one transformation), declare dependencies between them, and dbt executes them in the right order, materializing the results as tables or views inside the warehouse.</p>

<div class="board">────────────────────────────────────────────────
VOCABULARY: dbt (data build tool)

A framework for writing SQL transformations as
version-controlled, tested, documented code.

Mechanically:
  - You write SQL files in a Git repo
  - Each file is a SELECT statement that defines
    one transformation
  - dbt reads your files, figures out the dependency
    graph, runs them in order
  - It materializes each SELECT's result as a table
    or view in the warehouse
  - It runs tests you declare ("this column must not
    be null"; "this column must be unique")
  - It produces documentation showing the full lineage

dbt itself doesn't do compute. It just generates and
sends SQL to the warehouse. The warehouse does the
actual work. dbt is the orchestrator of the SQL.

We cover dbt in full in Phase 10. For today, recognize:
"dbt = the canonical SQL transformation layer in modern
ELT pipelines."
────────────────────────────────────────────────</div>

<p>A dbt transformation file might look like:</p>

<pre><code>-- models/marts/fct_daily_orders.sql

WITH cleaned_orders AS (
    SELECT
        order_id,
        user_id,
        restaurant_id,
        placed_at,
        total_amount,
        status
    FROM {{ ref('stg_orders') }}    -- references upstream model
    WHERE status NOT LIKE 'cancelled%'
),

with_customers AS (
    SELECT
        co.*,
        c.customer_segment,
        c.city
    FROM cleaned_orders co
    JOIN {{ ref('dim_customers') }} c USING (user_id)
)

SELECT
    DATE(placed_at) AS order_date,
    city,
    customer_segment,
    COUNT(*) AS order_count,
    SUM(total_amount) AS gmv_inr
FROM with_customers
GROUP BY 1, 2, 3</code></pre>

<p>This is one transformation. The team has 30 of them. dbt runs them all, in dependency order, every hour. The result: a fully-modeled warehouse with curated tables, just like ETL produced (except the work happened <em>inside</em> the warehouse, not outside).</p>

<h3>The full ELT lifecycle</h3>

<p>Here's the picture for the Tahini fintech I described in the opening:</p>

<div class="board">┌─────────────────┐     ┌────────────┐     ┌──────────────────────┐
│  Operational    │     │            │     │     Snowflake        │
│  Postgres       │ ──→ │  S3 raw    │ ──→ │  ┌────────────────┐  │
│  (orders, etc.) │     │  (Parquet) │     │  │  raw tables    │  │
└─────────────────┘     └────────────┘     │  └────────┬───────┘  │
   [EXTRACT]              [LOAD]           │           │ dbt      │
                                           │           ↓          │
                                           │  ┌────────────────┐  │
                                           │  │ staging tables │  │
                                           │  └────────┬───────┘  │
                                           │           │ dbt      │
                                           │           ↓          │
                                           │  ┌────────────────┐  │
                                           │  │  mart tables   │  │
                                           │  │  (final)       │  │
                                           │  └────────────────┘  │
                                           │      [TRANSFORM      │
                                           │       happens here]  │
                                           └──────────────────────┘</div>

<p>Notice: no ETL server. The transformation work runs inside Snowflake itself, on Snowflake's compute, billed by the second.</p>

<p>This is the modern ELT pipeline. You'll build many of these.</p>
